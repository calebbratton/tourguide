    el("h3", {}, "How much of the repo you've seen"),
    el("div", { class: "cov-bars" },
      el("span", {}, "In this tour"), bar(sum(shown), sum(shown)), el("span", {}, shown.size + " of " + src.length + " files · " + pct(sum(shown)) + "% of code"),
      el("span", {}, "Walked through"), bar(sum(shown), sum(seen)), el("span", {}, seen.size + " files · " + pct(sum(seen)) + "% of code")),
    gaps.length ? el("p", { class: "hint" }, "Not covered by this tour yet. Generate a focused tour for any of these to fill the gap:") : null,
    gaps.length ? el("ul", { class: "gaps" }, gaps.map(([dir, g]) => {
      const cmd = "tourguide generate . --scope " + dir;
      return el("li", {}, el("code", {}, dir + "/"), el("span", { class: "n" }, g.files + " files · " + g.lines + " lines"),
        el("button", { class: "btn", type: "button", style: "padding:3px 9px;font-size:12px", title: cmd, onclick: () => copy(cmd) }, "Copy command"));
    })) : el("p", { class: "hint" }, "This tour shows code from every source file."));
}
function renderMap(scroller) {
  $("srcPath").textContent = "Tour map";
  $("selBar").hidden = true;
  $("srcMeta").replaceChildren(el("span", {}, steps.length + " steps across " + W.topics.length + " topics"));
  const map = el("div", { class: "map" });
  const cov = coverageBlock(); if (cov) map.append(cov);
  map.append(el("h3", {}, "What this tour covers, at the depth you chose"));
  for (const t of W.topics) {
    const d = depthOf(t.id);
    const items = steps.map((s, i) => [s, i]).filter(([s]) => s.topic === t.id);
    map.append(el("section", { class: "map-topic" + (d === "skip" ? " skip" : "") },
      el("header", {}, el("b", {}, t.label), el("span", { class: "chip", title: whyOf(t.id) }, DEPTH_LABEL[d])),
      el("ul", {}, items.map(([s, i]) => el("li", {}, el("a", { href: "#step-" + s.id, onclick: e => { e.preventDefault(); go(i, true); } }, (i + 1) + ". " + s.title), el("span", { class: "f" }, s.file || "overview"))))));
  }
  scroller.replaceChildren(map);
}

// ---------------------------------------------------------------- drawer, toast, keys
function refreshDrawer() { if (!$("tuneDrawer").hidden) $("tuneDrawerBody").replaceChildren(el("h2", { id: "tuneTitle", style: "margin:0 0 14px;font-size:20px" }, "Tune the tour"), tuneEditor({ id: "drawerNote" })); }
function openDrawer() { $("tuneDrawer").hidden = false; $("scrim").hidden = false; refreshDrawer(); const t = $("drawerNote"); if (t) t.focus(); }
function closeDrawer() { $("tuneDrawer").hidden = true; $("scrim").hidden = true; $("tuneBtn").focus(); }
$("tuneBtn").onclick = openDrawer; $("tuneClose").onclick = closeDrawer; $("scrim").onclick = closeDrawer;
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 4200); }
$("prevBtn").onclick = prev; $("nextBtn").onclick = next; $("peekBack").onclick = () => { peeking = null; renderSource(true); };
$("stepSelect").onchange = e => go(+e.target.value, true);
$("selClear").onclick = () => { selection = null; selAnchor = null; renderSource(false); const c = document.querySelector(".ask .sel-slot"); if (c) c.replaceChildren(); };
$("selAsk").onclick = () => { const t = document.querySelector(".ask textarea"); if (t) { t.scrollIntoView({ behavior: "smooth", block: "center" }); t.focus(); } };
document.addEventListener("keydown", e => {
  if (e.target.closest("textarea, input, select")) return;
  if (e.key === "Escape" && !$("tuneDrawer").hidden) return closeDrawer();
  if (!$("tuneDrawer").hidden) return;
  if (e.key === "ArrowRight" || e.key === "j") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft" || e.key === "k") { e.preventDefault(); prev(); }
});
function fromHash() {
  const h = location.hash.slice(1);
  if (h === "welcome") return -1;
  if (h.startsWith("step-")) { const i = steps.findIndex(s => s.id === h.slice(5)); if (i >= 0) return i; }
  return null;
}
window.addEventListener("hashchange", () => { const i = fromHash(); if (i !== null && i !== index) go(i); });

const start = fromHash();
if (start !== null) index = start;
render();
setupLive();
})();
</script>
