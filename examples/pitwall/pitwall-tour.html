<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Pit Wall AI: a guided tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study desk. A slim route rail, the lesson you are reading, and the open source file with highlighter marks. */
:root {
  --paper: #f4f6f8;
  --sheet: #ffffff;
  --ink: #17212b;
  --muted: #5a6776;
  --rule: #d9dfe6;
  --pine: #0b6b62;
  --pine-soft: #e2f1ee;
  --mark: rgba(255, 221, 51, 0.38);
  --mark-edge: #e0b400;
  --code-bg: #fbfcfd;
  --code-ink: #1f2933;
  --gutter: #9aa5b1;
  --warn: #9a5b00;
  --tok-kw: #7a3e9d;
  --tok-str: #0f6e3a;
  --tok-com: #7b8794;
  --tok-num: #b0440f;
  --tok-fn: #1c5aa6;
  --tok-type: #8a5a00;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10161c; --sheet: #161e26; --ink: #e6ebf0; --muted: #98a6b5; --rule: #2a3542;
    --pine: #4fc2b2; --pine-soft: #17302d; --mark: rgba(255, 214, 10, 0.17); --mark-edge: #d9b200;
    --code-bg: #0d1318; --code-ink: #d9e1e8; --gutter: #5b6877; --warn: #f0b45a;
    --tok-kw: #c79bf2; --tok-str: #8fd19e; --tok-com: #6f7d8c; --tok-num: #f2a46b; --tok-fn: #7cb8ff; --tok-type: #e8c66a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10161c; --sheet: #161e26; --ink: #e6ebf0; --muted: #98a6b5; --rule: #2a3542;
  --pine: #4fc2b2; --pine-soft: #17302d; --mark: rgba(255, 214, 10, 0.17); --mark-edge: #d9b200;
  --code-bg: #0d1318; --code-ink: #d9e1e8; --gutter: #5b6877; --warn: #f0b45a;
  --tok-kw: #c79bf2; --tok-str: #8fd19e; --tok-com: #6f7d8c; --tok-num: #f2a46b; --tok-fn: #7cb8ff; --tok-type: #e8c66a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-display); font-size: 15px; line-height: 1.45;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }
a { color: var(--pine); }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* ---------- header ---------- */
.top {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--sheet);
}
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.brand .repo { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; text-wrap: balance; }
.meter { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .bar { width: 120px; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--pine); width: 0; transition: width .3s; }
.tune-btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--paper);
  border-radius: 999px; padding: 6px 12px; font-size: 13px;
}
.tune-btn b { font-weight: 600; }
.tune-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pine); }
.step-select { display: none; max-width: 100%; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; background: var(--paper); }

/* ---------- main grid ---------- */
.desk { display: grid; grid-template-columns: 230px minmax(340px, 470px) minmax(0, 1fr); min-height: 0; }
.rail, .lesson, .source { min-height: 0; min-width: 0; }

.rail { border-right: 1px solid var(--rule); overflow-y: auto; padding: 14px 0 24px; background: var(--paper); }
.rail h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 16px 8px; font-weight: 600; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail li button {
  width: 100%; text-align: left; border: 0; background: none; padding: 7px 16px 7px 14px;
  display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: baseline; border-left: 3px solid transparent;
}
.rail li button:hover { background: var(--sheet); }
.rail li .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail li .t { font-size: 13.5px; line-height: 1.3; }
.rail li .d { grid-column: 2; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.rail li.current button { border-left-color: var(--pine); background: var(--sheet); }
.rail li.current .t { font-weight: 600; }
.rail li.visited .n::after { content: " ✓"; color: var(--pine); }
.rail li.skipped .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule); }

/* ---------- lesson ---------- */
.lesson { overflow-y: auto; background: var(--sheet); border-right: 1px solid var(--rule); display: flex; flex-direction: column; }
.lesson-body { padding: 22px 26px 28px; display: flex; flex-direction: column; gap: 18px; flex: 1; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.eyebrow .topic { text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px;
  padding: 2px 8px; border-radius: 999px; background: var(--pine-soft); color: var(--pine); border: 0;
}
.chip.warn { background: transparent; color: var(--warn); border: 1px dashed currentColor; }
.lesson h2.title { font-size: 26px; line-height: 1.15; margin: 0; font-weight: 700; text-wrap: balance; }
.file-link { align-self: flex-start; font-family: var(--font-mono); font-size: 12.5px; background: none; border: 0; padding: 0; color: var(--pine); text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; text-align: left; }

.prose { font-family: var(--font-body); font-size: 16.5px; line-height: 1.62; max-width: 62ch; }
.prose > :first-child { margin-top: 0; }
.prose > :last-child { margin-bottom: 0; }
.prose p { margin: 0 0 .85em; }
.prose h3, .prose h4 { font-family: var(--font-display); font-size: 16px; margin: 1.2em 0 .4em; }
.prose code { font-family: var(--font-mono); font-size: .82em; background: var(--paper); border: 1px solid var(--rule); padding: 1px 5px; border-radius: 5px; }
.prose pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 13px; }
.prose pre code { border: 0; padding: 0; background: none; }
.prose ul, .prose ol { padding-left: 1.3em; margin: 0 0 .85em; }
.prose li { margin: .2em 0; }
.prose a.peek { text-decoration-style: dotted; }
.prose blockquote { margin: 0 0 .85em; padding-left: 12px; border-left: 3px solid var(--rule); color: var(--muted); }

.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.marks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.marks button {
  width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px;
  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline;
}
.marks button:hover { background: var(--paper); }
.marks .ln { font-family: var(--font-mono); font-size: 12px; background: var(--mark); box-shadow: inset 2px 0 0 var(--mark-edge); padding: 1px 6px; border-radius: 3px; font-variant-numeric: tabular-nums; }

.panel { border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.panel.written { border-color: var(--pine); }
.check-q { font-family: var(--font-body); font-size: 16px; margin: 0; }
.check-a { font-family: var(--font-body); font-size: 15.5px; margin: 0; padding: 10px 12px; background: var(--paper); border-radius: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 12px; font-size: 13.5px;
}
.btn:hover { border-color: var(--pine); }
.btn.primary { background: var(--pine); border-color: var(--pine); color: var(--sheet); font-weight: 600; }
.btn.on { background: var(--pine-soft); border-color: var(--pine); color: var(--pine); }
.btn[disabled] { opacity: .5; cursor: default; }
.feedback .btn { border-radius: 999px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

.links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.links a { font-size: 14px; overflow-wrap: anywhere; }
.links .host { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-left: 6px; }

.ask textarea, .tune textarea {
  width: 100%; min-height: 70px; resize: vertical; border: 1px solid var(--rule); border-radius: 8px;
  padding: 9px 11px; background: var(--paper); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
}
.answer { font-family: var(--font-body); font-size: 15.5px; line-height: 1.55; }
.answer .q { font-family: var(--font-display); font-size: 13px; color: var(--muted); margin: 0 0 4px; }

.nav {
  position: sticky; bottom: 0; display: flex; justify-content: space-between; gap: 10px; align-items: center;
  padding: 12px 26px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--rule); background: var(--sheet);
}
.nav .kbd { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 8px; font-size: 13.5px;
  max-width: min(92vw, 520px); box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 20;
}

/* ---------- tune (profile) ---------- */
.tune { display: flex; flex-direction: column; gap: 14px; }
.topics { display: flex; flex-direction: column; gap: 10px; }
.topic-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.topic-row .nm { font-weight: 600; font-size: 14px; }
.topic-row .ds { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin-top: -4px; }
.topic-row .why { grid-column: 1 / -1; font-size: 12px; color: var(--pine); margin-top: -4px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 5px 9px; font-size: 12.5px; border-left: 1px solid var(--rule); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--pine); color: var(--sheet); font-weight: 600; }
.tune-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--sheet);
  border-left: 1px solid var(--rule); box-shadow: -10px 0 40px rgba(0,0,0,.12); z-index: 30; overflow-y: auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
}
.tune-drawer .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
.scrim { position: fixed; inset: 0; background: rgba(10, 15, 20, .35); z-index: 25; }

/* ---------- source ---------- */
.source { display: flex; flex-direction: column; background: var(--code-bg); }
.source-head {
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--sheet);
}
.source-head .path { font-family: var(--font-mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.source-head .meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.peekbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 7px 16px; background: var(--mark); font-size: 13px; }
.code-scroll { flex: 1; overflow: auto; min-height: 0; }
table.code { border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; color: var(--code-ink); min-width: 100%; }
table.code td { padding: 0; vertical-align: top; }
table.code td.no {
  user-select: none; text-align: right; color: var(--gutter); padding: 0 12px 0 14px; position: sticky; left: 0;
  background: var(--code-bg); font-variant-numeric: tabular-nums; min-width: 48px; width: 1%;
}
table.code td.src { white-space: pre; padding-right: 24px; width: 100%; }
table.code tr.hl td.src { background: var(--mark); }
table.code tr.hl td.no { color: var(--ink); box-shadow: inset -3px 0 0 var(--mark-edge); }
table.code tr.flash td.src { animation: flash 1.1s ease-out; }
table.code td.no { cursor: pointer; }
table.code td.no:hover { color: var(--pine); }
table.code tr.sel td.src { box-shadow: inset 0 1px 0 var(--pine), inset 0 -1px 0 var(--pine); background: var(--pine-soft); }
table.code tr.sel td.no { color: var(--pine); font-weight: 600; }
.selbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 7px 16px; background: var(--pine-soft); color: var(--pine); font-size: 13px; }
.sel-chip { display: inline-flex; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--pine); }
.sel-chip button { border: 0; background: none; color: inherit; padding: 0 2px; font-size: 14px; }
@keyframes flash { from { background: var(--mark-edge); } }
.tag-row td.src { white-space: normal; padding: 8px 0 2px; }
.tag { display: inline-block; font-family: var(--font-display); font-size: 12px; font-weight: 600; background: var(--mark-edge); color: #1d1600; padding: 1px 8px; border-radius: 4px 4px 4px 0; }

.map { padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.map h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.map-topic { display: flex; flex-direction: column; gap: 6px; }
.map-topic header { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.map-topic header b { font-size: 15px; }
.map-topic ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.map-topic li { display: grid; grid-template-columns: 1fr auto; gap: 10px; font-size: 13.5px; padding: 3px 0; border-bottom: 1px dashed var(--rule); }
.map-topic li .f { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; text-align: right; }
.map-topic.skip { opacity: .55; }
.cov { display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--rule); }
.cov-bars { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.cov-bar { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; position: relative; }
.cov-bar i { position: absolute; inset: 0 auto 0 0; background: var(--pine); opacity: .35; }
.cov-bar b { position: absolute; inset: 0 auto 0 0; background: var(--pine); }
.gaps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.gaps li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; border-bottom: 1px dashed var(--rule); }
.gaps code { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.gaps .n { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; }

/* token colors */
.hljs-keyword, .hljs-selector-tag, .hljs-built_in.hljs-keyword { color: var(--tok-kw); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-symbol { color: var(--tok-str); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--tok-com); font-style: italic; }
.hljs-number, .hljs-literal { color: var(--tok-num); }
.hljs-title, .hljs-title.function_, .hljs-section { color: var(--tok-fn); }
.hljs-type, .hljs-title.class_, .hljs-built_in, .hljs-attr, .hljs-attribute { color: var(--tok-type); }
.hljs-params, .hljs-variable, .hljs-property { color: var(--code-ink); }
.hljs-deletion { color: var(--tok-num); }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .desk { grid-template-columns: minmax(320px, 440px) minmax(0, 1fr); }
  .rail { display: none; }
  .step-select { display: block; }
}
@media (max-width: 760px) {
  html, body { height: auto; }
  .app { height: auto; display: block; }
  .desk { display: flex; flex-direction: column; }
  .lesson { border-right: 0; overflow: visible; }
  .lesson-body { padding: 18px max(16px, env(safe-area-inset-left, 0px)) 22px; }
  .nav { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5; }
  .source { border-top: 1px solid var(--rule); }
  .code-scroll { max-height: 70vh; }
  .lesson h2.title { font-size: 22px; }
  .meter .bar { width: 70px; }
  .step-select { flex: 1 1 100%; }
}
.nav .kbd { white-space: nowrap; }
@media (max-width: 760px) { .nav .kbd { display: none; } }

/* ---------- inside VS Code / Cursor: the real editor shows the code ---------- */
:root.in-editor {
  --paper: var(--vscode-sideBar-background, var(--vscode-editor-background));
  --sheet: var(--vscode-editor-background);
  --ink: var(--vscode-foreground);
  --muted: var(--vscode-descriptionForeground);
  --rule: var(--vscode-panel-border, var(--vscode-widget-border, rgba(128,128,128,.35)));
  --pine: var(--vscode-textLink-foreground);
  --pine-soft: var(--vscode-editor-inactiveSelectionBackground);
  --code-bg: var(--vscode-textCodeBlock-background, var(--vscode-editor-background));
  --font-display: var(--vscode-font-family);
  --font-body: var(--vscode-font-family);
  --font-mono: var(--vscode-editor-font-family);
}
:root.in-editor .source, :root.in-editor .rail { display: none; }
:root.in-editor, :root.in-editor body { height: 100%; }
:root.in-editor .app { height: 100%; display: grid; }
:root.in-editor .lesson { overflow-y: auto; }
:root.in-editor .desk { display: flex; flex-direction: column; }
:root.in-editor .lesson { border-right: 0; flex: 1; }
:root.in-editor .step-select { display: block; flex: 1 1 100%; }
:root.in-editor .prose { font-size: 14.5px; }
:root.in-editor .btn.primary { color: var(--vscode-button-foreground); background: var(--vscode-button-background); border-color: var(--vscode-button-background); }
:root.in-editor .seg button[aria-pressed="true"] { color: var(--vscode-button-foreground); background: var(--vscode-button-background); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="repo" id="repoName"></span>
      <h1 id="tourTitle"></h1>
    </div>
    <div class="meter" aria-live="polite"><span id="meterText"></span><span class="bar"><i id="meterBar"></i></span></div>
    <select class="step-select" id="stepSelect" aria-label="Jump to step"></select>
    <button class="tune-btn" id="tuneBtn" type="button" aria-haspopup="dialog"><span class="dot"></span><span id="tuneSummary">Tuned for you</span></button>
  </header>
  <main class="desk">
    <nav class="rail" aria-label="Tour steps">
      <h2>Route</h2>
      <ol id="rail"></ol>
    </nav>
    <section class="lesson" aria-live="polite">
      <div class="lesson-body" id="lesson"></div>
      <div class="nav">
        <button class="btn" id="prevBtn" type="button">← Back</button>
        <span class="kbd">← → to move</span>
        <button class="btn primary" id="nextBtn" type="button">Next →</button>
      </div>
    </section>
    <section class="source" aria-label="Source code">
      <div class="source-head">
        <span class="path" id="srcPath"></span>
        <span class="meta" id="srcMeta"></span>

<script type="application/json" id="walkthrough-data">{"title": "Pit Wall AI: a guided tour", "summary": "Pit Wall AI is a post-race (and live) Formula 1 strategy engine. You ask a natural-language question such as \"Could McLaren have undercut on lap 30 at Monaco 2024?\". It pulls race data from OpenF1, retrieves FIA Sporting Regulation clauses with hybrid RAG, and returns a grounded verdict. It runs at $0: hosted free-tier LLMs (Groq), with embeddings, vector store and simulation all local.\n\nThe tour covers these topics:\n- **Chat agent (LangGraph)**: the route → resolve → fetch ⇄ tools → retrieve → analyze → synthesize state machine and its state types.\n- **LLM providers**: the factory that picks a model per role.\n- **Regulation RAG**: chunking, source selection, glossary rewriting and the hybrid index.\n- **Race data**: the OpenF1 client and its cache.\n- **MCP server and HTTP API**: the two ways the system is exposed.\n- **Simulation and live timing**: luck-adjusted results, the live pipeline and the deterministic pit calls. It ends with data refresh, tests and next steps.\n\nThe recurring design rule is \"LLMs for language, code for facts\". Anything that can be computed deterministically is, and the model's output is checked against evidence it was actually shown.", "topics": [{"id": "agent-graph", "label": "Chat agent (LangGraph)", "description": "The stateful graph that answers a question: state, nodes, edges, tool loop.", "keywords": ["langgraph", "agent", "graph", "state", "nodes", "tool calling", "pydantic"]}, {"id": "llm", "label": "LLM providers", "description": "Provider-agnostic model factory, per-role models, structured output.", "keywords": ["llm", "groq", "anthropic", "structured output", "langchain", "rate limits"]}, {"id": "rag", "label": "Regulation RAG", "description": "Chunking FIA PDFs, picking the right issue, query rewriting, hybrid dense+BM25 search.", "keywords": ["rag", "qdrant", "embeddings", "fastembed", "bm25", "retrieval", "vector"]}, {"id": "data", "label": "Race data and storage", "description": "OpenF1 client, disk cache, warehouse refresh.", "keywords": ["openf1", "cache", "http", "duckdb", "warehouse", "database", "ingest"]}, {"id": "interfaces", "label": "MCP server and HTTP API", "description": "FastAPI SSE chat endpoint and the MCP tool server.", "keywords": ["api", "fastapi", "sse", "mcp", "server", "http", "tools"]}, {"id": "sim-live", "label": "Simulation and live timing", "description": "Luck-adjusted results, deterministic pit calls, live/replay pipeline.", "keywords": ["simulation", "live", "signalr", "strategy", "safety car", "models", "luck"]}, {"id": "tests", "label": "Tests and next steps", "description": "Offline test strategy with fake models, and where to go next.", "keywords": ["tests", "pytest", "fakes", "evals", "status", "roadmap"]}], "steps": [{"id": "overview", "title": "What Pit Wall does and how it is laid out", "topic": "agent-graph", "file": null, "highlights": [], "explanation": {"brief": "Pit Wall is an F1 strategy Q&A engine: LangGraph chat agent, local hybrid RAG over FIA regulations, OpenF1 telemetry, an MCP server, plus a live-timing simulator. $0 running cost is a hard constraint.", "standard": "A question goes into a LangGraph state machine. A small router LLM classifies it, deterministic code resolves the race and regulation issue, a tool-calling LLM fetches telemetry, and hybrid search retrieves rule clauses. An analyst LLM produces a structured verdict and deterministic code renders it, dropping any citation that was not retrieved.\n\nThe same data and models are also exposed as an MCP server, so any MCP client's LLM can reason over them, and as a FastAPI service that streams progress over SSE to a separate UI repo. `src/sim/` and `src/livetiming/` hold the strategy models and the live/replay pipeline.\n\nThe repo's own [CLAUDE.md](https://github.com/calebbratton/pitwall/blob/main/CLAUDE.md) and [docs/STATUS.md](https://github.com/calebbratton/pitwall/blob/main/docs/STATUS.md) are the best orientation.", "deep": "Three constraints shape the design. First, free-tier Groq limits are about 8K tokens/min per model, so prompts have character budgets and each role uses a different model. Second, the product promises no hallucinated numbers or citations, so facts come from code and the LLM only chooses tools and writes structured findings. Third, a \"luck principle\" says safety-car timing and retirements are unpredictable, so predictions omit them and anything learned from past results uses luck-adjusted outcomes. Only the live tools model SC/VSC, because there they are the situation being decided on.\n\nSeason scope is a rolling window (current plus previous season) enforced in the graph, the API and ingest. Older races survive only as test fixtures."}, "links": [{"title": "Repo CLAUDE.md", "url": "https://github.com/calebbratton/pitwall/blob/main/CLAUDE.md"}, {"title": "Repo status doc", "url": "https://github.com/calebbratton/pitwall/blob/main/docs/STATUS.md"}, {"title": "Repo roadmap", "url": "https://github.com/calebbratton/pitwall/blob/main/docs/ROADMAP.md"}, {"title": "LangGraph docs", "url": "https://langchain-ai.github.io/langgraph/"}], "check": {"question": "Which parts of the chat pipeline are deliberately not LLM calls?", "answer": "resolve (race/session/regs lookup), the key-event fetch, and synthesize (rendering the answer). Only route, fetch and analyze use LLMs."}}, {"id": "graph-state", "title": "Graph state and structured outputs", "topic": "agent-graph", "file": "src/agents/state.py", "highlights": [{"start": 34, "end": 49, "label": "PitWallState TypedDict"}, {"start": 52, "end": 76, "label": "RouteDecision schema"}, {"start": 79, "end": 100, "label": "Finding and Analysis schemas"}], "explanation": {"brief": "State is a `TypedDict`; only `messages` has a reducer. Per-question fields are overwritten each turn. Pydantic `RouteDecision` and `Analysis` define what the LLMs must return.", "standard": "`PitWallState` splits fields in two. `messages` (with the `add_messages` reducer) and `race_context` persist across chat turns, so follow-ups like \"and what about Norris?\" keep the race. Everything else (`route`, `fetched_telemetry_json`, `retrieved_rules_text`, `analysis`, `evaluation_steps`) is per-question and reset by the router node.\n\n`RouteDecision` is the router's contract: mode (`rules` or `race`), year, place, a focus sentence, and 2-3 regulation search queries. `Analysis` holds a verdict, `Finding`s (claim, evidence numbers, article ids) and caveats. The field descriptions double as prompt text for the model.", "deep": "With a `TypedDict(total=False)` state, nodes return partial dicts and LangGraph merges them. Fields without a reducer are last-write-wins, which is how reset-per-turn works without any explicit clearing code. `fetch_messages` is a private tool-calling transcript kept apart from the user-visible `messages`, so internal tool chatter never lands in chat history or gets re-sent as history.\n\nPydantic models in state mean the checkpointer must be able to serialise them, which is why [`memory_checkpointer()`](src/agents/graph.py#L62-L69) allow-lists these classes for msgpack. `Finding.evidence` is described as \"exact numbers copied from tool results\" and `articles` as ids from the provided regulations only. That wording supports the no-hallucination rule, and `synthesize` then enforces it in code."}, "links": [{"title": "LangGraph: state and reducers", "url": "https://langchain-ai.github.io/langgraph/concepts/low_level/"}, {"title": "Pydantic docs", "url": "https://docs.pydantic.dev/latest/"}], "check": {"question": "Why does `race_context` persist but `route` doesn't need explicit clearing?", "answer": "`race_context` is carried by the checkpointer across turns. `route` has no reducer, so the router node's new value overwrites it each turn."}}, {"id": "graph-route-resolve", "title": "Route then resolve: LLM intent, deterministic facts", "topic": "agent-graph", "file": "src/agents/graph.py", "highlights": [{"start": 138, "end": 164, "label": "route node (LLM)"}, {"start": 166, "end": 238, "label": "resolve node (no LLM)"}], "explanation": {"brief": "`route` asks a small model for a `RouteDecision` and resets per-question state. `resolve` is plain code: it checks the season window, maps year/place to an OpenF1 session, picks the regs issue, and pre-fetches key events.", "standard": "`route` formats a prompt with today's date, the current race and recent history, then calls the router with a schema. It returns the decision plus a clean slate for this question.\n\n`resolve` never trusts the LLM for identifiers. It rejects seasons outside the supported window, resolves \"latest\" or a place name to a real OpenF1 session, refuses future races, and asks \"Which race?\" if none is known. It then calls `source_for_race` to choose the regulation issue in force that day. For race questions it always fetches key race events and a race summary, and adds incidents when the question looks like a stewarding one. Any problem sets `error`, which routes straight to `synthesize`.", "deep": "Making `resolve` deterministic removes a whole class of failures: hallucinated session keys, wrong-issue regs, silently answering about the wrong season. Errors are values in state (`error`) rather than exceptions, so the conditional edge [`after_resolve`](src/agents/graph.py#L411-L414) can short-circuit to the renderer, and the user sees a useful sentence.\n\nThe injected `today` makes date logic testable. The first two telemetry results (key events, summary) are positional: `fetch` reads `fetched_telemetry_json[0]` and `[1]` to seed the fetcher prompt, a small implicit contract worth knowing before reordering them. `STEWARDING.search` on the query plus focus is a regex gate that also controls decision retrieval later."}, "links": [{"title": "LangGraph conditional edges", "url": "https://langchain-ai.github.io/langgraph/concepts/low_level/#conditional-edges"}], "check": {"question": "What happens if the user asks about a race that hasn't happened yet?", "answer": "`resolve` sets an error message in state, the graph jumps straight to `synthesize`, and that message is returned. No fetching or LLM analysis runs."}}, {"id": "graph-fetch-loop", "title": "The fetch ⇄ tools loop", "topic": "agent-graph", "file": "src/agents/graph.py", "highlights": [{"start": 240, "end": 263, "label": "fetch: bind_tools and invoke"}, {"start": 265, "end": 304, "label": "run_tools: dedupe, run, clip"}, {"start": 416, "end": 428, "label": "loop-exit conditions"}], "explanation": {"brief": "A hand-rolled tool loop: `fetch` lets the model call telemetry tools, `run_tools` executes them with dedupe and clipping, and edges stop at `MAX_FETCH_ROUNDS` or when a round is all repeats.", "standard": "`fetch` binds the telemetry tools for the session to the fetcher model and invokes it with the transcript. If the reply has tool calls, the `tools` node runs each one. Errors come back as `ERROR: ...` strings so the model can retry, and unknown tool names are handled the same way. Results are clipped to 2,500 characters.\n\nTwo guards keep the loop cheap. Identical repeated calls are not re-run and not added to the evidence twice. Older rounds' tool results are shortened (`_compact_old_rounds`) when re-sent. The loop ends when the model stops calling tools, when a round was only repeats, or after four rounds.", "deep": "Rather than using a prebuilt ReAct agent, the loop is explicit nodes and edges, which makes budgets visible: `MAX_TOOL_RESULT_CHARS`, `OLD_ROUND_RESULT_CHARS` and `MAX_FETCH_ROUNDS` all exist because of Groq's per-minute token cap. The fetcher is the model that supports parallel tool calls, so one reply can request several tools.\n\n`run_tools` keys calls by `name + sorted JSON args`, so the evidence list never contains duplicates and `analyze` can split its character budget evenly across results. When a repeat occurs, the full earlier result is returned to the model, because the transcript only holds it clipped. The `all(...startswith(REPEATED_CALL_NOTE))` check in `after_tools` is a loop-detector: if the model re-asks and gets nothing new, more rounds won't help. Catching broad exceptions here is intentional (noqa'd) because any tool failure should become model-visible feedback."}, "links": [{"title": "LangChain tool calling", "url": "https://python.langchain.com/docs/concepts/tool_calling/"}], "check": {"question": "Name two ways the loop is prevented from running away.", "answer": "The `MAX_FETCH_ROUNDS` cap (4), and stopping early when every call in a round was a repeat of an earlier call."}}, {"id": "graph-analyze-synthesize", "title": "Analyze and synthesize: grounding the answer", "topic": "agent-graph", "file": "src/agents/graph.py", "highlights": [{"start": 340, "end": 376, "label": "analyze builds prompt, gets Analysis"}, {"start": 378, "end": 407, "label": "synthesize drops unretrieved citations"}, {"start": 430, "end": 449, "label": "graph assembly"}], "explanation": {"brief": "`analyze` makes one structured LLM call over clipped telemetry and retrieved rules. `synthesize` renders text in code and drops any cited article that wasn't retrieved.", "standard": "`analyze` budgets telemetry (12,000 characters split across results), separates regulations from stewards' rulings, and asks the analyst model for an `Analysis`. `synthesize` has no LLM. It builds a verdict line, bullet findings with evidence and `[article]` refs, caveats, and lists of cited regulations and decisions.\n\nThe key trick is `valid = [a for a in f.articles if a in rules]`. A model can only cite what it was actually shown, and any dropped citation is recorded in `evaluation_steps`. The bottom of the file wires the nodes and edges into a compiled `StateGraph`, with the checkpointer injected.", "deep": "Because rendering is deterministic, the answer format is stable and unit-testable, and the Faithfulness eval has a clear contract: numbers in evidence must come from `fetched_telemetry_json`, citations from `retrieved_rules_text`. The post-hoc filter is cheaper and more reliable than prompting the model not to invent citations.\n\n`build_graph` takes all dependencies (OpenF1 client, regulation index, models dict, checkpointer, `today`, seasons, decisions). Models are created lazily through `model(role)` and cached in the dict, which is also how tests substitute scripted fakes. Stewards' rulings reuse the `RetrievedRule` shape, distinguished only by a citation prefix (`DECISION_CITATION`), which is simple but means that prefix is load-bearing in both `analyze` and `synthesize`."}, "links": [{"title": "LangGraph StateGraph reference", "url": "https://langchain-ai.github.io/langgraph/reference/graphs/"}], "check": {"question": "Where is hallucinated-citation protection enforced, and how?", "answer": "In `synthesize`: only articles present in `retrieved_rules_text` are kept; others are dropped and noted in `evaluation_steps`."}}, {"id": "llm-factory", "title": "The LLM factory: one place for provider SDKs", "topic": "llm", "file": "src/llm/factory.py", "highlights": [{"start": 18, "end": 27, "label": "per-role Groq defaults and limits"}, {"start": 39, "end": 79, "label": "get_chat_model"}, {"start": 82, "end": 98, "label": "with_schema helper"}], "explanation": {"brief": "`get_chat_model(role)` returns a Groq model per role by default, Anthropic only on explicit opt-in. `with_schema` wraps structured output in Groq's JSON-schema mode with retries.", "standard": "Each role (router, fetcher, analyst, judge) has its own default Groq model, because free-tier limits are per model and splitting roles multiplies the budget. Environment variables override: `LLM_MODEL_\u003cROLE>` for one role, `LLM_MODEL` for all, `LLM_PROVIDER` for the provider. Missing keys raise `LLMConfigError`, and Anthropic needs an explicit model name. It never becomes a silent fallback, to avoid accidental charges.\n\nThis is the only module allowed to import provider packages. `with_schema` is how nodes get structured output.", "deep": "Provider imports sit inside the branches so unused SDKs are never loaded. Qwen models get `reasoning_format=\"parsed\"` so `\u003cthink>` text stays out of content, and Qwen's output-token-per-minute cap is applied by clamping `max_tokens`, because Groq rejects over-cap requests rather than queueing them.\n\n`with_schema` avoids default tool-call structured output for Groq: when the model answers in prose, the tool route returns a 400 (\"Tool choice is required\"). JSON-schema mode constrains the output itself, and `with_retry` on `BadRequestError` handles the intermittent `json_validate_failed`. The judge is deliberately a different model family from the analyst to reduce self-preference bias in evals."}, "links": [{"title": "Groq docs", "url": "https://console.groq.com/docs"}, {"title": "LangChain chat models", "url": "https://python.langchain.com/docs/concepts/chat_models/"}], "check": {"question": "Why can't the code just call `with_structured_output()` directly on Groq models?", "answer": "Groq's tool-call route fails with a 400 when the model replies in prose. `with_schema` uses JSON-schema mode plus retries instead."}}, {"id": "rag-chunking-sources", "title": "Regulation chunks and picking the issue in force", "topic": "rag", "file": "src/rag/sources.py", "highlights": [{"start": 31, "end": 45, "label": "indexed regulation issues"}, {"start": 48, "end": 54, "label": "source_for_race"}], "explanation": {"brief": "Each FIA regulation issue is a `RegSource`; `source_for_race` picks the latest issue published on or before race day. `RegChunk` (one per clause) carries the citation text.", "standard": "Regulations are reissued several times a season, and a race is judged under the issue in force that day (Monaco 2024 uses Issue 6, not 7). `SOURCES` lists every indexed issue with its publish date, URL and format. `source_for_race` filters by season, sorts by date and returns the last one not after race day.\n\nIngest turns PDFs into [`RegChunk`](src/rag/chunking.py#L21-L36)s, one per clause, via two parsers: `classic` (2023-2025 style, `30.5`) and `section_b` (2026, `B6.3.6`). A chunk's `citation` property is the exact string answers cite.", "deep": "Every search filters on both season and issue, so a 2026 question cannot retrieve 2024 text. The chunkers are regex-based on the PDF text and need real-world fixes: long clauses are split at line boundaries with a minimum tail size, wrapped cross-references are detected so they don't create false clause boundaries, and the 2026 PDF's broken \"ff\" ligature is repaired in `_fix_ligatures`. `embedding_text()` prefixes the article number and title, so the embedding carries context that the bare clause text lacks. When the FIA publishes a new issue, you add one `RegSource` and re-run the ingest script."}, "links": [{"title": "FIA regulations", "url": "https://www.fia.com/regulation/category/110"}, {"title": "Repo chunking module", "url": "https://github.com/calebbratton/pitwall/blob/main/src/rag/chunking.py"}], "check": {"question": "A race on 2024-05-26 and issues published 04-30 and 07-31: which is used?", "answer": "The 04-30 issue (Issue 6), the latest published on or before race day."}}, {"id": "rag-glossary-retrieve", "title": "Glossary rewriting and rank-fused retrieval", "topic": "rag", "file": "src/rag/glossary.py", "highlights": [{"start": 11, "end": 20, "label": "jargon to regulation vocabulary"}, {"start": 23, "end": 30, "label": "substitute, don't append"}, {"start": 34, "end": 45, "label": "US to UK spelling"}], "explanation": {"brief": "Paddock jargon (\"red flag\", \"undercut\") is substituted with the words the regs use; the retrieve node searches all variants and merges them with reciprocal rank fusion.", "standard": "Users say \"red flag\" and \"undercut\", but the regulations say \"suspension\" and never mention undercuts. `expand_query` applies regex substitutions and returns a rewritten query, or `None` if nothing changed. Substitution beats appending because extra words dilute the dense embedding of the original.\n\n`normalize_spelling` converts \"tire\" to \"tyre\" and similar, since BM25 matches exact tokens. In [`retrieve`](src/agents/graph.py#L306-L338), the router's queries, the raw question and their expansions are each searched, scored with `1/(RRF_K + rank)` and summed, and the top five clauses win.", "deep": "Doing this deterministically means retrieval quality does not depend on the router LLM remembering to rephrase. Fusion across phrasings rewards clauses that several variants agree on, which is robust to any single bad query. Stewards' decisions are searched separately and in memory (not Qdrant) when the query looks like a penalty question, so the running API can see newly scraped rulings without reopening the embedded vector store. A trade-off is that the glossary is hand-maintained and regex-greedy (\"compounds?\" always becomes \"specifications of dry-weather tyres\"), so new jargon misses until added."}, "links": [{"title": "Reciprocal rank fusion (Qdrant hybrid queries)", "url": "https://qdrant.tech/documentation/concepts/hybrid-queries/"}], "check": {"question": "Why replace \"red flag\" with \"suspension\" instead of adding \"suspension\" to the query?", "answer": "Appended words dilute the dense embedding of the original query; substitution keeps the query focused on the vocabulary the regulations use."}}, {"id": "rag-hybrid-index", "title": "Hybrid dense + BM25 search on embedded Qdrant", "topic": "rag", "file": "src/rag/index.py", "highlights": [{"start": 33, "end": 36, "label": "embedded Qdrant and local models"}, {"start": 38, "end": 70, "label": "rebuild with dense and sparse vectors"}, {"start": 72, "end": 98, "label": "filtered hybrid query with RRF"}], "explanation": {"brief": "`RegulationIndex` stores each chunk with a dense bge-small vector and a BM25 sparse vector in local Qdrant, and queries both with a season/issue filter fused by RRF.", "standard": "Everything is local and free: `QdrantClient(path=...)` runs embedded storage with no server, and `fastembed` runs ONNX models for dense (`BAAI/bge-small-en-v1.5`) and sparse (`Qdrant/bm25`) embeddings. `rebuild` recreates the collection with a named dense vector and an IDF-modified sparse vector, then upserts batches.\n\n`search` normalises spelling, embeds the query (dense gets bge's retrieval prefix), and issues two prefetches filtered to the requested season and issue. Qdrant fuses them with RRF and returns the top `k`. Dense catches paraphrase and BM25 catches exact regulatory terms.", "deep": "Point ids are `uuid5(chunk_id)`, so re-ingesting is deterministic. The full `RegChunk` is the payload, so no second lookup is needed. Prefetch limit is `k * 4` per branch to give fusion enough candidates. Embedded Qdrant allows only one client per storage folder, which is why the API shares a single `RegulationIndex` between the chat graph and the MCP server through `_regulation_index()` in `api.py`. Ingest embeds on CPU and takes minutes, but queries are fast. Rebuild deletes and recreates the collection rather than updating, which is simple and fine at this corpus size."}, "links": [{"title": "Qdrant local mode", "url": "https://qdrant.tech/documentation/quickstart/"}, {"title": "FastEmbed", "url": "https://qdrant.github.io/fastembed/"}], "check": {"question": "Why can't two processes open the same embedded Qdrant folder, and how does the repo cope?", "answer": "Embedded mode takes a single-client lock on the folder. The API keeps one shared `RegulationIndex` used by both chat graph and MCP server."}}, {"id": "openf1-client", "title": "OpenF1 client with a cache that knows when data is final", "topic": "data", "file": "src/tools/openf1.py", "highlights": [{"start": 198, "end": 199, "label": "settle and calendar TTLs"}, {"start": 214, "end": 229, "label": "URL-keyed disk cache"}, {"start": 231, "end": 253, "label": "expiry policy"}], "explanation": {"brief": "`HttpOpenF1Client` caches responses on disk, but only freezes session data once the session ended more than six hours ago; empty results are never cached.", "standard": "OpenF1 is the free historical race API. The client keys cache files by a hash of endpoint plus params. A cache entry stores rows and an `expires_at`.\n\nThe expiry rules avoid freezing partial data: during and just after a session nothing is cached (`never-cache`), settled sessions are cached forever, and calendar-level queries expire after 12 hours because races move. Empty responses are never cached since a 404 during a live window is not a permanent answer. An `OpenF1Client` abstract base and a `MockOpenF1Client` over fixture files let tests run offline.", "deep": "The cache is a correctness feature, not just speed. A naive URL cache would freeze half a race's laps forever if fetched mid-session. `_expiry` looks up the session's `date_end` (memoised in `_session_ends` to avoid an extra request per call) and compares it with `SETTLE_AFTER`. A legacy cache format (a bare list) is still readable and treated as permanent. There is also retry logic in `_fetch` with `max_retries`, and `OpenF1Error` is raised when OpenF1 is closed for a live session, which `refresh` interprets as \"skip and retry next run\"."}, "links": [{"title": "OpenF1 API docs", "url": "https://openf1.org/"}, {"title": "httpx", "url": "https://www.python-httpx.org/"}], "check": {"question": "When is an OpenF1 response cached forever?", "answer": "When it has rows and the session's end plus the six-hour settle window is in the past."}}, {"id": "mcp-server", "title": "The MCP server: tools for any client's LLM", "topic": "interfaces", "file": "src/mcp_server.py", "highlights": [{"start": 47, "end": 57, "label": "server instructions"}, {"start": 73, "end": 91, "label": "PitwallTools plain methods"}, {"start": 875, "end": 911, "label": "register tools, HTTP app"}], "explanation": {"brief": "`PitwallTools` is a class of plain methods returning compact JSON or `ERROR:` strings; `build_server` registers them with MCP, and `http_app` serves them stateless at `/mcp`.", "standard": "The direction for open-ended questions is: the client's LLM reasons, the server only computes. Tools are general building blocks (results, laps, stints, pit stops, race control, weather, regulations, stewards' rulings) plus models (`review_pit_stop`, `who_wins_from_here`, `predict_race`, `luck_adjusted_result`, `tyre_life`). No LLM calls happen inside any tool.\n\nMethods are plain Python so tests call them directly on fixtures with no MCP transport. Every result carries a `source`, and unknowns are `null` or `ERROR: ...` with valid options, never a guess. The `INSTRUCTIONS` string tells the client LLM to take numbers only from tool results.", "deep": "`build_server` loops over a `TOOLS` tuple and uses `add_tool(..., structured_output=False)`, since results are already JSON text and a structured copy would double the tokens the client reads. `http_app` uses stateless HTTP with JSON responses so any replica can answer any call. DNS-rebinding protection allows only localhost Host headers unless `PITWALL_MCP_HOSTS` lists public names. The tool class reuses the same telemetry builders as the chat graph (`build_telemetry_tools`) and takes injectable `now`, `seasons` and index factories, which is what makes it testable. Per CLAUDE.md, new data should be added as a general tool, not a question-shaped one."}, "links": [{"title": "Model Context Protocol", "url": "https://modelcontextprotocol.io/"}, {"title": "MCP Python SDK", "url": "https://github.com/modelcontextprotocol/python-sdk"}], "check": {"question": "Why does the MCP server contain no LLM calls?", "answer": "The connected client's own LLM does the reasoning; the server only computes data and model outputs, which keeps it deterministic, testable and free."}}, {"id": "http-api", "title": "FastAPI chat endpoint streaming SSE", "topic": "interfaces", "file": "src/api.py", "highlights": [{"start": 5, "end": 9, "label": "SSE contract"}, {"start": 151, "end": 203, "label": "create_app with injectable graph"}, {"start": 210, "end": 236, "label": "/api/chat streams graph updates"}], "explanation": {"brief": "`create_app(make_graph)` builds the FastAPI app and mounts MCP at `/mcp`. `POST /api/chat` streams `thread`, `step`, `answer` and `error` SSE events as the graph runs.", "standard": "The chat endpoint calls `graph.stream(..., stream_mode=\"updates\")` and emits one `step` event per node, so the UI can show progress (\"route\", \"fetch round 1...\"), then a final `answer` event assembled from the checkpointed state. The `thread_id` selects the conversation in the in-memory checkpointer.\n\nThe contract is documented in the module docstring and consumed by the sibling `pitwall-ui` repo, so changes must be made in both. A lifespan hook starts the graph, the radio transcriber, the live session registry and, optionally, background warehouse refresh.", "deep": "The graph factory returns `(graph, cleanup)`, so `tests/test_api.py` can inject fake-model graphs. The generator is synchronous: Starlette runs it in a threadpool, so blocking LLM calls don't stall the event loop. Mounting the MCP app last (`app.mount(\"/\", mcp_app)`) works because it only answers `/mcp` and API routes are registered first. The MCP session manager runs inside the same lifespan. Live endpoints (`/api/live/*`) reuse one pipeline for live and replay, covered in the live-timing steps."}, "links": [{"title": "FastAPI StreamingResponse", "url": "https://fastapi.tiangolo.com/advanced/custom-response/#streamingresponse"}, {"title": "Server-Sent Events (MDN)", "url": "https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events"}], "check": {"question": "What does the UI see between sending a question and receiving the answer?", "answer": "A `thread` event with the id, then one `step` event per graph node as it completes, then `answer` (or `error`)."}}, {"id": "luck-principle", "title": "Luck-adjusted results: a core modelling rule", "topic": "sim-live", "file": "src/sim/luck.py", "highlights": [{"start": 1, "end": 12, "label": "definition of luck"}, {"start": 26, "end": 31, "label": "neutralisation_luck signature"}, {"start": 64, "end": 70, "label": "per-window, per-driver loop"}], "explanation": {"brief": "Safety-car/VSC/red-flag timing is measured as seconds gained or lost versus clean pace and field median, so scoring and learning use luck-adjusted results.", "standard": "A driver who pits just as a safety car appears gains a lot, which is luck and not skill. `neutralisation_luck` queries the DuckDB warehouse for laps, clean-lap pace, pit laps and neutralised windows. For each window and driver it compares expected elapsed time (laps × clean pace, plus a green-flag pit loss if they pitted) with actual time, relative to the field median. Adjusted finish equals actual plus luck.\n\nThis is a stated product principle: predictions leave neutralisations out, and anything learned from past results must use these adjusted outcomes, so a team never gains favour in a model from luck.", "deep": "The model works on lap-end timestamps (`crossings`) around each window, from the lap before it starts to the lap after the restart, and requires at least two post-window crossings to be meaningful. The `after_lap` parameter lets in-race backtests score a prediction made mid-race without removing the neutralisation already underway, because that is part of the situation then, not luck. Contrast with `src/livetiming/strategy.py`, which deliberately does model SC/VSC, since there it is the live decision."}, "links": [{"title": "Simulation notes in repo", "url": "https://github.com/calebbratton/pitwall/blob/main/docs/SIMULATION.md"}, {"title": "DuckDB docs", "url": "https://duckdb.org/docs/"}], "check": {"question": "Why does `neutralisation_luck` accept `after_lap`?", "answer": "To score an in-race prediction without treating the already-running neutralisation as luck to be removed."}}, {"id": "live-pipeline-and-calls", "title": "Live timing: one pipeline and deterministic SC/VSC calls", "topic": "sim-live", "file": "src/livetiming/strategy.py", "highlights": [{"start": 1, "end": 21, "label": "deterministic design and named constants"}, {"start": 61, "end": 115, "label": "per-driver PIT / STAY OUT rules"}, {"start": 139, "end": 159, "label": "pit_calls with echoed assumptions"}], "explanation": {"brief": "Under a safety car there's about a lap to decide, so PIT/STAY OUT calls come from ordered rules over a `RaceSnapshot`; the LLM only explains them. Assumptions are named constants echoed with the result.", "standard": "The live stack is a pipeline: archive or live SignalR messages → `state.py` (merge partial updates) → `snapshot.py` (`RaceSnapshot`) → `strategy.py` (calls) → `monitor.py` (events). [`pump()`](src/livetiming/monitor.py#L399-L425) is shared by replay and the live feed, so live runs the code that replays test.\n\n`_call` applies rules in priority order: retired/in pit, still needs a second compound, too few laps left, tyres too fresh, a free stop (no car within pit-loss behind), old tyres with few places at risk, else stay out. Each decision returns a human reason. `pit_calls` bundles results with the assumptions used.", "deep": "Making the rules constants (`FRESH_TYRE_LAPS`, `OLD_TYRE_LAPS`, `MIN_LAPS_TO_BENEFIT`, ...) lets them be tuned against past races and surfaced to the user rather than hidden in a prompt. Pit loss prefers the circuit's measured value and falls back to `estimated_pit_loss` (median pit-lane time minus a bypass, scaled by SC/VSC factors). `places_at_risk` assumes cars behind stay out, which is stated in the assumptions. The `quiet` flag in `pump` lets replay fast-forward through messages without emitting events, then send a snapshot when it ends. Position and car-data topics are token-gated on the live feed, and the F1 TV token is for the owner's local use only."}, "links": [{"title": "Repo STATUS doc (live feed notes)", "url": "https://github.com/calebbratton/pitwall/blob/main/docs/STATUS.md"}, {"title": "Python dataclasses", "url": "https://docs.python.org/3/library/dataclasses.html"}], "check": {"question": "Why are the pit calls computed in code rather than by an LLM?", "answer": "Latency and trust: there's about a lap to decide, so the call is computed in milliseconds and tunable constants are shown as assumptions; the LLM only explains."}}, {"id": "refresh-and-tests", "title": "Keeping data fresh, and testing without network or LLM", "topic": "tests", "file": "src/warehouse/refresh.py", "highlights": [{"start": 65, "end": 90, "label": "idempotent refresh"}], "explanation": {"brief": "`refresh()` ingests finished sessions, rebuilds the warehouse only if something new arrived, and fetches stewards' decisions; failures are reported, not fatal. Tests use scripted fake models and fixtures.", "standard": "Run `python -m src.warehouse.refresh` from cron, or set `PITWALL_REFRESH_MINUTES` so the API process does it in the background. It is idempotent: if OpenF1 is closed for a live session, `OpenF1Error` is caught and the run is marked skipped. A rebuild happens only if sessions were added, and a stewards-site outage is recorded in `errors` without stopping the job. Ingest, build and decisions functions are injectable parameters.\n\nThe test suite follows the same philosophy. In `tests/test_graph.py`, a `Scripted` class stands in for a chat model by returning queued outputs, `FakeIndex` stands in for Qdrant, and `MockOpenF1Client` reads Monaco 2024 fixtures. Nothing touches the network or tokens.", "deep": "Injecting `ingest_fn`, `build_fn` and `decisions_fn` lets `tests/test_refresh.py` verify the control flow without DuckDB or HTTP. `Scripted` implements just `invoke`, `bind_tools` and `with_structured_output`, which is the whole surface the graph uses, so graph wiring (routing, dedupe, citation dropping, memory) is testable deterministically. Real-LLM checks live separately in `tests/evals` and `python -m src.evals.run`. They measure routing, retrieval precision and faithfulness with a Qwen judge, and run only on explicit request (`PITWALL_EVALS=1`) to protect the free-tier budget."}, "links": [{"title": "pytest docs", "url": "https://docs.pytest.org/"}, {"title": "DeepEval", "url": "https://deepeval.com/docs/getting-started"}], "check": {"question": "How do graph tests run with no LLM?", "answer": "Models are replaced by `Scripted` fakes that return queued outputs; the index and OpenF1 client are also fakes/fixtures."}}, {"id": "next-steps", "title": "Where to go next", "topic": "tests", "file": null, "highlights": [], "explanation": {"brief": "Read docs/STATUS.md and docs/ROADMAP.md, run the offline tests, then try the CLI chat or a live replay.", "standard": "Suggested path:\n1. Set up with `uv venv --python 3.12`, then `uv pip install -e \".[dev]\"`, and run `pytest tests --ignore=tests/evals`.\n2. Read [docs/STATUS.md](https://github.com/calebbratton/pitwall/blob/main/docs/STATUS.md) for current state and next steps, and [docs/ROADMAP.md](https://github.com/calebbratton/pitwall/blob/main/docs/ROADMAP.md) before adding features.\n3. With a free Groq key, run `python -m src.chat --trace` to watch the graph's `evaluation_steps`.\n4. Try a replay: `python -m src.live --year 2024 --meeting Miami --from-lap 26`.\n5. Explore `src/sim/pit_review.py` (counterfactual stop reviews), `src/sim/inrace.py` (who wins from here) and `src/livetiming/` (the live client and recorder).", "deep": "Good first changes show the architecture's seams. Add a glossary entry and a test in `tests/test_glossary.py`. Add a general MCP tool to `PitwallTools` and `TOOLS`, with a fixture-based test in `tests/test_mcp_server.py`. Add a new `RegSource` when the FIA issues new regulations. Keep three conventions in mind: provider SDK imports stay in `src/llm/`, tools return `ERROR:` strings rather than raising, and anything learned from past results uses luck-adjusted outcomes."}, "links": [{"title": "Repository", "url": "https://github.com/calebbratton/pitwall"}, {"title": "SIMULATION.md", "url": "https://github.com/calebbratton/pitwall/blob/main/docs/SIMULATION.md"}], "check": null}], "version": 1, "repo": {"name": "calebbratton/pitwall", "url": "https://github.com/calebbratton/pitwall", "ref": "f69bb594eb0a3d21a6e4627442b462106bec672c"}, "files": {"src/agents/state.py": "\"\"\"Graph state and the structured outputs the LLM nodes produce.\"\"\"\n\nfrom typing import Annotated, Any, Literal, TypedDict\n\nfrom langchain_core.messages import AnyMessage\nfrom langgraph.graph.message import add_messages\nfrom pydantic import BaseModel, Field\n\n\nclass RaceContext(TypedDict):\n    year: int\n    place: str  # as resolved by OpenF1: \"Monaco (Monaco, 2024-05-26)\"\n    session_key: int\n    race_date: str  # ISO date\n\n\nclass RegContext(TypedDict):\n    season: int\n    issue: int\n\n\nclass ToolResult(TypedDict):\n    tool: str\n    args: dict[str, Any]\n    result: str\n\n\nclass RetrievedRule(TypedDict):\n    article: str\n    citation: str\n    text: str\n\n\nclass PitWallState(TypedDict, total=False):\n    # Persist across chat turns (checkpointed per thread).\n    messages: Annotated[list[AnyMessage], add_messages]\n    race_context: RaceContext | None\n\n    # Per-question fields: overwritten (no reducer) by the router at the start of each turn.\n    current_query: str\n    route: \"RouteDecision\"\n    reg_context: RegContext | None\n    fetch_messages: list[AnyMessage]  # the fetch agent's private tool-calling transcript\n    fetch_rounds: int\n    fetched_telemetry_json: list[ToolResult]\n    retrieved_rules_text: list[RetrievedRule]\n    analysis: \"Analysis\"\n    evaluation_steps: list[str]\n    error: str | None\n\n\nclass RouteDecision(BaseModel):\n    \"\"\"How to handle the user's question.\"\"\"\n\n    mode: Literal[\"rules\", \"race\"] = Field(\n        description='\"rules\" for regulation-only questions; \"race\" when the answer needs data '\n        \"from a specific race (lap times, tyres, flags, strategy).\"\n    )\n    year: int | None = Field(\n        None, description=\"Season, if stated or implied by the conversation. Null if unknown.\"\n    )\n    place: str | None = Field(\n        None,\n        description=\"Race location as a country, city or circuit (e.g. Monaco, Madrid, Silverstone).\"\n        ' Use \"latest\" for the last / most recent race. Null for rules questions that don\\'t name'\n        \" a race, or to keep the previous race.\",\n    )\n    focus: str = Field(\n        description=\"One sentence: what to analyse, naming drivers/teams/laps if mentioned.\"\n    )\n    regulation_queries: list[str] = Field(\n        description=\"2-3 search queries phrased in FIA Sporting Regulations vocabulary, e.g. \"\n        '\"race suspension work permitted on cars\", \"use of two dry-weather tyre specifications\".',\n        min_length=1,\n        max_length=3,\n    )\n\n\nclass Finding(BaseModel):\n    claim: str = Field(description=\"One factual or analytical statement.\")\n    evidence: list[str] = Field(\n        default_factory=list,\n        description=\"Exact numbers copied from telemetry tool results that support the claim.\",\n    )\n    articles: list[str] = Field(\n        default_factory=list,\n        description=(\n            'Article numbers from the provided regulations only, e.g. \"B6.3.6\", \"30.5\", and keys '\n            \"of the provided stewards' decisions, e.g. \\\"Doc 26, 2026 Bahrain Grand Prix In \"\n            'Malaysia\" (cite a ruling here, not in evidence).'\n        ),\n    )\n\n\nclass Analysis(BaseModel):\n    verdict: str = Field(description=\"Direct answer to the question in 1-3 sentences.\")\n    findings: list[Finding] = Field(description=\"Supporting findings, most important first.\")\n    caveats: list[str] = Field(\n        default_factory=list, description=\"Missing data or assumptions that limit the verdict.\"\n    )\n", "src/agents/graph.py": "\"\"\"Pit Wall AI state machine: Route -> Resolve -> Fetch \u003c-> Tools -> Retrieve -> Analyze -> Synthesize.\n\n    START -> route -> resolve --(race)--> fetch \u003c-> tools\n                        |                   |\n                        |--(rules)--------> retrieve -> analyze -> synthesize -> END\n                        '--(error)--------------------------------> synthesize\n\nDependencies (models, OpenF1 client, regulation index) are injected into `build_graph` so tests\ncan swap in fakes.\n\"\"\"\n\nimport json\nfrom datetime import UTC, date, datetime\nfrom typing import Any\n\nfrom langchain_core.language_models.chat_models import BaseChatModel\nfrom langchain_core.messages import AIMessage, HumanMessage, SystemMessage, ToolMessage\nfrom langgraph.checkpoint.base import BaseCheckpointSaver\nfrom langgraph.checkpoint.memory import InMemorySaver\nfrom langgraph.checkpoint.serde.jsonplus import JsonPlusSerializer\nfrom langgraph.graph import END, START, StateGraph\n\nfrom src.agents import prompts\nfrom src.agents.state import (\n    Analysis,\n    PitWallState,\n    RetrievedRule,\n    RouteDecision,\n    ToolResult,\n)\nfrom src.llm.factory import Role, get_chat_model, with_schema\nfrom src.rag.decisions import STEWARDING, DecisionIndex\nfrom src.rag.glossary import expand_query\nfrom src.rag.index import RegulationIndex\nfrom src.rag.sources import source_for_race\nfrom src.seasons import out_of_scope_message\nfrom src.tools.openf1 import OpenF1Client, OpenF1Error\nfrom src.tools.telemetry import (\n    build_telemetry_tools,\n    key_race_events,\n    race_incidents,\n    race_summary,\n)\n\nMAX_FETCH_ROUNDS = 4\nRULES_PER_QUERY = 4\nMAX_RULES = 5\nMAX_DECISIONS = 3  # stewards' rulings added to the rules for penalty / incident questions\nDECISION_CITATION = \"Stewards' decision\"\nRRF_K = 60  # standard reciprocal-rank-fusion constant\n# Groq free tier caps input at ~7-8K tokens/minute per model (~4 chars/token), so every prompt\n# that grows with data has a character budget.\nMAX_TOOL_RESULT_CHARS = 2500\nOLD_ROUND_RESULT_CHARS = 300  # earlier rounds' results, when resent to the fetcher\n# Prefixes the earlier result when the fetcher repeats a call (same tool, same arguments).\nREPEATED_CALL_NOTE = \"Same call as an earlier round; the result is unchanged:\"\nMAX_ANALYST_TELEMETRY_CHARS = 12000\nHISTORY_MESSAGES = 6\nLATEST_PLACES = {\"latest\", \"last\", \"last race\", \"latest race\", \"most recent\", \"most recent race\"}\n\n\ndef memory_checkpointer() -> InMemorySaver:\n    \"\"\"In-process chat memory that is allowed to round-trip our Pydantic state types.\"\"\"\n    serde = JsonPlusSerializer(\n        allowed_msgpack_modules=[\n            (\"src.agents.state\", name) for name in (\"RouteDecision\", \"Analysis\", \"Finding\")\n        ]\n    )\n    return InMemorySaver(serde=serde)\n\n\ndef _clip(text: str, limit: int) -> str:\n    return (\n        text if len(text) \u003c= limit else f\"{text[:limit]}... [truncated {len(text) - limit} chars]\"\n    )\n\n\ndef _compact_old_rounds(messages: list) -> list:\n    \"\"\"The fetcher already saw earlier rounds' tool results; resend them shortened so the\n    transcript doesn't outgrow the per-minute token limit. The latest round stays whole.\"\"\"\n    last_ai = max((i for i, m in enumerate(messages) if isinstance(m, AIMessage)), default=-1)\n    return [\n        ToolMessage(_clip(m.content, OLD_ROUND_RESULT_CHARS), tool_call_id=m.tool_call_id)\n        if isinstance(m, ToolMessage) and i \u003c last_ai\n        else m\n        for i, m in enumerate(messages)\n    ]\n\n\ndef _call_key(name: str, args: dict) -> str:\n    return f\"{name}{json.dumps(args, sort_keys=True, default=str)}\"\n\n\ndef _history(state: PitWallState) -> str:\n    msgs = state.get(\"messages\", [])[-HISTORY_MESSAGES:]\n    return \"\\n\".join(f\"{m.type}: {m.content}\" for m in msgs) or \"(none)\"\n\n\ndef _race_label(state: PitWallState) -> str:\n    ctx = state.get(\"race_context\")\n    return ctx[\"place\"] if ctx else \"none\"\n\n\ndef build_graph(\n    openf1: OpenF1Client,\n    index: RegulationIndex,\n    models: dict[Role, BaseChatModel] | None = None,\n    checkpointer: BaseCheckpointSaver | None = None,\n    today: date | None = None,\n    seasons: list[int] | None = None,\n    decisions: DecisionIndex | None = None,\n):\n    models = models or {}\n\n    def model(role: Role) -> BaseChatModel:\n        if role not in models:\n            models[role] = get_chat_model(role)\n        return models[role]\n\n    tools_cache: dict[int, list] = {}\n\n    def tools_for(session_key: int) -> list:\n        if session_key not in tools_cache:\n            session = openf1.get_session_by_key(session_key)\n            tools_cache[session_key] = build_telemetry_tools(openf1, session)\n        return tools_cache[session_key]\n\n    def _now() -> datetime:\n        return (\n            datetime.combine(today, datetime.max.time(), tzinfo=UTC) if today else datetime.now(UTC)\n        )\n\n    def _today() -> date:\n        return _now().date()\n\n    # --- nodes ---------------------------------------------------------------------------\n\n    def route(state: PitWallState) -> dict[str, Any]:\n        query = state[\"messages\"][-1].content\n        prompt = prompts.ROUTER.format(\n            today=_today().isoformat(),\n            current_year=_today().year,\n            race_context=_race_label(state),\n            history=_history(state),\n        )\n        decision: RouteDecision = with_schema(model(\"router\"), RouteDecision).invoke(\n            [SystemMessage(prompt), HumanMessage(query)]\n        )\n        return {\n            \"current_query\": query,\n            \"route\": decision,\n            \"reg_context\": None,\n            \"fetch_messages\": [],\n            \"fetch_rounds\": 0,\n            \"fetched_telemetry_json\": [],\n            \"retrieved_rules_text\": [],\n            \"error\": None,\n            \"evaluation_steps\": [\n                (\n                    f\"route: mode={decision.mode} year={decision.year} place={decision.place} \"\n                    f\"focus={decision.focus!r} queries={decision.regulation_queries}\"\n                )\n            ],\n        }\n\n    def resolve(state: PitWallState) -> dict[str, Any]:\n        \"\"\"Deterministic: turn the router's year/place into an OpenF1 session and pick the\n        regulations issue in force. No LLM, so no hallucinated session keys.\"\"\"\n        decision = state[\"route\"]\n        steps = list(state[\"evaluation_steps\"])\n        race_context = state.get(\"race_context\")\n\n        if seasons is not None and decision.year and decision.year not in seasons:\n            msg = out_of_scope_message(decision.year, _today())\n            return {\"error\": msg, \"evaluation_steps\": [*steps, f\"resolve: {msg}\"]}\n\n        if decision.mode == \"race\" and decision.place:\n            year = decision.year or _today().year\n            try:\n                if decision.place.strip().casefold() in LATEST_PLACES:\n                    session = openf1.get_latest_session(_now())\n                    year = session.year\n                else:\n                    session = openf1.get_session(year, decision.place)\n            except OpenF1Error as e:\n                return {\"error\": str(e), \"evaluation_steps\": [*steps, f\"resolve: {e}\"]}\n            if datetime.fromisoformat(session.date_start) > _now():\n                msg = f\"{session.label} hasn't happened yet, so there is no race data.\"\n                return {\"error\": msg, \"evaluation_steps\": [*steps, f\"resolve: {msg}\"]}\n            race_context = {\n                \"year\": year,\n                \"place\": session.label,\n                \"session_key\": session.session_key,\n                \"race_date\": session.date_start[:10],\n            }\n\n        if decision.mode == \"race\" and not race_context:\n            msg = \"Which race? Name the season and location, e.g. 'Monaco 2024'.\"\n            return {\"error\": msg, \"evaluation_steps\": [*steps, \"resolve: no race\"]}\n\n        if decision.mode == \"race\":\n            ref_date = date.fromisoformat(race_context[\"race_date\"])\n        elif decision.year and decision.year != _today().year:\n            ref_date = date(decision.year, 12, 31)\n        else:\n            ref_date = _today()\n        season = ref_date.year if decision.mode == \"race\" else (decision.year or _today().year)\n        try:\n            source = source_for_race(season, ref_date)\n        except ValueError as e:\n            return {\"error\": str(e), \"evaluation_steps\": [*steps, f\"resolve: {e}\"]}\n\n        telemetry = []\n        if decision.mode == \"race\":\n            session_key = race_context[\"session_key\"]\n            events = key_race_events(openf1, session_key)\n            summary = race_summary(openf1, openf1.get_session_by_key(session_key))\n            telemetry = [\n                ToolResult(tool=\"key_race_events\", args={}, result=events),\n                ToolResult(tool=\"race_summary\", args={}, result=summary),\n            ]\n            if STEWARDING.search(f\"{state['current_query']} {decision.focus}\"):\n                # In-race determinations: track-limits deletions, flags, investigations,\n                # penalties - the record a \"should X have been penalised?\" answer rests on.\n                incidents = race_incidents(openf1, session_key)\n                telemetry.append(ToolResult(tool=\"race_incidents\", args={}, result=incidents))\n        return {\n            \"race_context\": race_context,\n            \"reg_context\": {\"season\": source.season, \"issue\": source.issue},\n            \"fetched_telemetry_json\": telemetry,\n            \"evaluation_steps\": [\n                *steps,\n                (\n                    f\"resolve: race={race_context['place'] if decision.mode == 'race' else '-'} \"\n                    f\"regs={source.season} issue {source.issue}\"\n                ),\n            ],\n        }\n\n    def fetch(state: PitWallState) -> dict[str, Any]:\n        tools = tools_for(state[\"race_context\"][\"session_key\"])\n        messages = state[\"fetch_messages\"] or [\n            SystemMessage(\n                prompts.FETCH.format(\n                    focus=state[\"route\"].focus,\n                    race=_race_label(state),\n                    max_rounds=MAX_FETCH_ROUNDS,\n                    key_events=state[\"fetched_telemetry_json\"][0][\"result\"],\n                    race_summary=state[\"fetched_telemetry_json\"][1][\"result\"],\n                )\n            ),\n            HumanMessage(state[\"current_query\"]),\n        ]\n        reply = model(\"fetcher\").bind_tools(tools).invoke(_compact_old_rounds(messages))\n        calls = [f\"{c['name']}({c['args']})\" for c in reply.tool_calls]\n        return {\n            \"fetch_messages\": [*messages, reply],\n            \"fetch_rounds\": state[\"fetch_rounds\"] + 1,\n            \"evaluation_steps\": [\n                *state[\"evaluation_steps\"],\n                f\"fetch round {state['fetch_rounds'] + 1}: {calls or 'done'}\",\n            ],\n        }\n\n    def run_tools(state: PitWallState) -> dict[str, Any]:\n        tools = {t.name: t for t in tools_for(state[\"race_context\"][\"session_key\"])}\n        reply: AIMessage = state[\"fetch_messages\"][-1]\n        tool_messages, results, repeats = [], [], []\n        earlier = {\n            _call_key(r[\"tool\"], r[\"args\"]): r[\"result\"] for r in state[\"fetched_telemetry_json\"]\n        }\n        for call in reply.tool_calls:\n            key = _call_key(call[\"name\"], call[\"args\"])\n            if key in earlier:\n                # Not re-run, and not added to the evidence twice. The fetcher only sees earlier\n                # rounds clipped, so it gets the whole result again.\n                repeats.append(call[\"name\"])\n                tool_messages.append(\n                    ToolMessage(f\"{REPEATED_CALL_NOTE}\\n{earlier[key]}\", tool_call_id=call[\"id\"])\n                )\n                continue\n            if call[\"name\"] in tools:\n                try:\n                    output = tools[call[\"name\"]].invoke(call[\"args\"])\n                except Exception as e:  # noqa: BLE001 — any tool failure goes back to the model to retry\n                    output = f\"ERROR: {type(e).__name__}: {e}\"\n            else:\n                output = f\"ERROR: unknown tool {call['name']!r}\"\n            output = _clip(output, MAX_TOOL_RESULT_CHARS)\n            tool_messages.append(ToolMessage(output, tool_call_id=call[\"id\"]))\n            results.append(ToolResult(tool=call[\"name\"], args=call[\"args\"], result=output))\n            earlier[key] = output\n        return {\n            \"fetch_messages\": [*state[\"fetch_messages\"], *tool_messages],\n            \"fetched_telemetry_json\": [*state[\"fetched_telemetry_json\"], *results],\n            \"evaluation_steps\": [\n                *state[\"evaluation_steps\"],\n                *(\n                    [f\"tools: repeated calls answered from earlier results: {repeats}\"]\n                    if repeats\n                    else []\n                ),\n            ],\n        }\n\n    def retrieve(state: PitWallState) -> dict[str, Any]:\n        \"\"\"Hybrid search per query (router queries, the question, and glossary expansions of\n        both), merged with reciprocal rank fusion so clauses that several phrasings agree on\n        rank first.\"\"\"\n        reg = state[\"reg_context\"]\n        queries = [*state[\"route\"].regulation_queries, state[\"current_query\"]]\n        queries += [e for q in list(queries) if (e := expand_query(q))]\n        scores: dict[str, float] = {}\n        rules_by_id: dict[str, RetrievedRule] = {}\n        for query in queries:\n            hits = index.search(query, reg[\"season\"], reg[\"issue\"], k=RULES_PER_QUERY)\n            for rank, hit in enumerate(hits):\n                c = hit.chunk\n                scores[c.chunk_id] = scores.get(c.chunk_id, 0.0) + 1 / (RRF_K + rank)\n                rules_by_id[c.chunk_id] = RetrievedRule(\n                    article=c.article, citation=c.citation, text=c.text\n                )\n        ranked = sorted(scores, key=scores.__getitem__, reverse=True)[:MAX_RULES]\n        rules = [rules_by_id[chunk_id] for chunk_id in ranked]\n        if decisions is not None and any(STEWARDING.search(q) for q in queries):\n            rulings = decisions.search(\n                state[\"current_query\"], seasons or [reg[\"season\"]], k=MAX_DECISIONS\n            )\n            rules += [\n                RetrievedRule(article=d.key, citation=d.citation, text=d.text()) for d in rulings\n            ]\n        return {\n            \"retrieved_rules_text\": rules,\n            \"evaluation_steps\": [\n                *state[\"evaluation_steps\"],\n                f\"retrieve ({len(queries)} queries): {[r['article'] for r in rules]}\",\n            ],\n        }\n\n    def analyze(state: PitWallState) -> dict[str, Any]:\n        reg = state[\"reg_context\"]\n        results = state[\"fetched_telemetry_json\"]\n        per_result = MAX_ANALYST_TELEMETRY_CHARS // max(len(results), 1)\n        telemetry = [\n            {\"tool\": r[\"tool\"], \"args\": r[\"args\"], \"result\": _clip(r[\"result\"], per_result)}\n            for r in results\n        ]\n        retrieved = state[\"retrieved_rules_text\"]\n        rules = \"\\n\\n\".join(\n            f\"[{r['article']}] {r['text']}\"\n            for r in retrieved\n            if not r[\"citation\"].startswith(DECISION_CITATION)\n        )\n        rulings = \"\\n\\n\".join(\n            f\"[{r['article']}] {r['text'
