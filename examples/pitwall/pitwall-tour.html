]}\"\n            for r in retrieved\n            if r[\"citation\"].startswith(DECISION_CITATION)\n        )\n        prompt = prompts.ANALYST.format(\n            question=state[\"current_query\"],\n            race=_race_label(state) if state[\"route\"].mode == \"race\" else \"n/a (rules question)\",\n            telemetry=json.dumps(telemetry, separators=(\",\", \":\")) if telemetry else \"(none)\",\n            reg_source=f\"{reg['season']} Sporting Regulations, Issue {reg['issue']}\",\n            rules=rules or \"(none retrieved)\",\n            decisions=rulings or \"(none retrieved)\",\n        )\n        analysis: Analysis = with_schema(model(\"analyst\"), Analysis).invoke(\n            [SystemMessage(prompt), HumanMessage(state[\"current_query\"])]\n        )\n        return {\n            \"analysis\": analysis,\n            \"evaluation_steps\": [\n                *state[\"evaluation_steps\"],\n                f\"analyze: {len(analysis.findings)} findings\",\n            ],\n        }\n\n    def synthesize(state: PitWallState) -> dict[str, Any]:\n        \"\"\"Deterministic rendering (no LLM). Drops citations of articles that weren't retrieved,\n        so the answer can only cite regulation text the model was actually shown.\"\"\"\n        if state.get(\"error\"):\n            return {\"messages\": [AIMessage(state[\"error\"])]}\n\n        analysis = state[\"analysis\"]\n        rules = {r[\"article\"]: r for r in state[\"retrieved_rules_text\"]}\n        steps = list(state[\"evaluation_steps\"])\n        lines = [analysis.verdict, \"\"]\n        cited: dict[str, str] = {}\n        for f in analysis.findings:\n            valid = [a for a in f.articles if a in rules]\n            dropped = sorted(set(f.articles) - set(valid))\n            if dropped:\n                steps.append(f\"synthesize: dropped unretrieved citations {dropped}\")\n            for a in valid:\n                cited[a] = rules[a][\"citation\"]\n            refs = f\" [{', '.join(valid)}]\" if valid else \"\"\n            evidence = f\" ({'; '.join(f.evidence)})\" if f.evidence else \"\"\n            lines.append(f\"- {f.claim}{evidence}{refs}\")\n        if analysis.caveats:\n            lines += [\"\", \"Caveats:\", *(f\"- {c}\" for c in analysis.caveats)]\n        regs = [c for c in cited.values() if not c.startswith(DECISION_CITATION)]\n        rulings = [c for c in cited.values() if c.startswith(DECISION_CITATION)]\n        if regs:\n            lines += [\"\", \"Regulations:\", *(f\"- {c}\" for c in regs)]\n        if rulings:\n            lines += [\"\", \"Stewards' decisions:\", *(f\"- {c}\" for c in rulings)]\n        return {\"messages\": [AIMessage(\"\\n\".join(lines))], \"evaluation_steps\": steps}\n\n    # --- edges ---------------------------------------------------------------------------\n\n    def after_resolve(state: PitWallState) -> str:\n        if state.get(\"error\"):\n            return \"synthesize\"\n        return \"fetch\" if state[\"route\"].mode == \"race\" else \"retrieve\"\n\n    def after_fetch(state: PitWallState) -> str:\n        last = state[\"fetch_messages\"][-1]\n        if isinstance(last, AIMessage) and last.tool_calls:\n            return \"tools\"\n        return \"retrieve\"\n\n    def after_tools(state: PitWallState) -> str:\n        # A round of nothing but repeats adds no data: the fetcher is looping, not working.\n        reply = next(m for m in reversed(state[\"fetch_messages\"]) if isinstance(m, AIMessage))\n        answered = state[\"fetch_messages\"][-len(reply.tool_calls) :]\n        if all(m.content.startswith(REPEATED_CALL_NOTE) for m in answered):\n            return \"retrieve\"\n        return \"fetch\" if state[\"fetch_rounds\"] \u003c MAX_FETCH_ROUNDS else \"retrieve\"\n\n    g = StateGraph(PitWallState)\n    for name, fn in [\n        (\"route\", route),\n        (\"resolve\", resolve),\n        (\"fetch\", fetch),\n        (\"tools\", run_tools),\n        (\"retrieve\", retrieve),\n        (\"analyze\", analyze),\n        (\"synthesize\", synthesize),\n    ]:\n        g.add_node(name, fn)\n    g.add_edge(START, \"route\")\n    g.add_edge(\"route\", \"resolve\")\n    g.add_conditional_edges(\"resolve\", after_resolve, [\"fetch\", \"retrieve\", \"synthesize\"])\n    g.add_conditional_edges(\"fetch\", after_fetch, [\"tools\", \"retrieve\"])\n    g.add_conditional_edges(\"tools\", after_tools, [\"fetch\", \"retrieve\"])\n    g.add_edge(\"retrieve\", \"analyze\")\n    g.add_edge(\"analyze\", \"synthesize\")\n    g.add_edge(\"synthesize\", END)\n    return g.compile(checkpointer=checkpointer)\n", "src/llm/factory.py": "\"\"\"Chat-model factory. The only module that imports provider packages.\"\"\"\n\nimport os\nfrom typing import Literal\n\nfrom dotenv import load_dotenv\nfrom langchain_core.language_models.chat_models import BaseChatModel\nfrom langchain_core.runnables import Runnable\nfrom pydantic import BaseModel\n\nload_dotenv()\n\nRole = Literal[\"router\", \"fetcher\", \"analyst\", \"judge\"]\n\n# Groq free-tier rate limits are per model, so giving each role its own model multiplies the\n# budget. The judge is a different model family from the analyst it grades, which reduces\n# self-preference bias. Check https://console.groq.com/docs/models — Groq rotates models often.\nGROQ_DEFAULTS: dict[Role, str] = {\n    \"router\": \"openai/gpt-oss-20b\",\n    \"fetcher\": \"qwen/qwen3.8-27b\",  # makes parallel tool calls; gpt-oss-20b calls one at a time\n    \"analyst\": \"openai/gpt-oss-120b\",\n    \"judge\": \"qwen/qwen3.8-27b\",\n}\nDEFAULT_MAX_TOKENS = 4096  # reasoning tokens count toward this on reasoning models\n# Free-tier output-tokens-per-minute caps: Groq rejects (not queues) any request whose\n# max_tokens exceeds them, so requests are clamped under the cap.\nGROQ_OUTPUT_TPM = {\"qwen/qwen3.8-27b\": 1000}\n\n\nclass LLMConfigError(RuntimeError):\n    pass\n\n\ndef _env(name: str) -> str:\n    # `.env` lines like `LLM_PROVIDER=` load as empty strings; treat those as unset.\n    return os.getenv(name, \"\").strip()\n\n\ndef get_chat_model(\n    role: Role = \"analyst\",\n    temperature: float = 0.0,\n    max_tokens: int = DEFAULT_MAX_TOKENS,\n    reasoning: bool = True,\n) -> BaseChatModel:\n    \"\"\"Model for a graph role. Override per role with LLM_MODEL_\u003cROLE>, or all roles with\n    LLM_MODEL. `reasoning=False` turns off hidden reasoning where the model supports it (saves\n    output tokens, which are the scarce budget on some free-tier models).\"\"\"\n    provider = (_env(\"LLM_PROVIDER\") or \"groq\").lower()\n    model = _env(f\"LLM_MODEL_{role.upper()}\") or _env(\"LLM_MODEL\")\n\n    if provider == \"groq\":\n        if not _env(\"GROQ_API_KEY\"):\n            raise LLMConfigError(\n                \"GROQ_API_KEY is not set. Get a free key at console.groq.com/keys.\"\n            )\n        from langchain_groq import ChatGroq\n\n        model = model or GROQ_DEFAULTS[role]\n        extra = {}\n        if model.startswith(\"qwen/\"):\n            # Keep \u003cthink> text out of message content; \"raw\" is rejected with tool use.\n            extra[\"reasoning_format\"] = \"parsed\"\n            if not reasoning:\n                extra[\"reasoning_effort\"] = \"none\"\n        if model in GROQ_OUTPUT_TPM:\n            max_tokens = min(max_tokens, GROQ_OUTPUT_TPM[model] - 50)\n        return ChatGroq(model=model, temperature=temperature, max_tokens=max_tokens, **extra)\n\n    if provider == \"anthropic\":\n        # Paid provider: explicit opt-in only. No default model, no fallback.\n        if not _env(\"ANTHROPIC_API_KEY\"):\n            raise LLMConfigError(\"LLM_PROVIDER=anthropic but ANTHROPIC_API_KEY is not set.\")\n        if not model:\n            raise LLMConfigError(\"LLM_PROVIDER=anthropic requires LLM_MODEL to be set explicitly.\")\n        from langchain_anthropic import ChatAnthropic\n\n        return ChatAnthropic(model=model, max_tokens=max_tokens)\n\n    raise LLMConfigError(f\"Unknown LLM_PROVIDER {provider!r}; expected 'groq' or 'anthropic'.\")\n\n\ndef with_schema(model: BaseChatModel, schema: type[BaseModel]) -> Runnable:\n    \"\"\"Structured output using the most reliable method for the model's provider.\"\"\"\n    from langchain_groq import ChatGroq\n\n    if isinstance(model, ChatGroq):\n        # Groq's tool-call route fails hard when the model answers in prose instead\n        # (\"Tool choice is required, but model did not call a tool\"); JSON-schema mode\n        # constrains the output itself.\n        # Groq intermittently rejects a generation that fails its own JSON validation\n        # (400 json_validate_failed, often with an empty generation); a fresh sample usually\n        # passes.\n        from groq import BadRequestError\n\n        return model.with_structured_output(schema, method=\"json_schema\").with_retry(\n            retry_if_exception_type=(BadRequestError,), stop_after_attempt=3\n        )\n    return model.with_structured_output(schema)\n", "src/rag/sources.py": "\"\"\"FIA Formula One Sporting Regulations issues we index, and picking the one in force for a race.\n\nEach season's regulations are reissued several times. A race must be judged against the issue\nin force on race day, e.g. Monaco 2024 (26 May) falls under Issue 6, not the later Issue 7.\n\"\"\"\n\nfrom dataclasses import dataclass\nfrom datetime import date\nfrom typing import Literal\n\n_OLD = \"https://www.fia.com/sites/default/files\"\n_NEW = \"https://www.fia.com/system/files/documents\"\n\n\n@dataclass(frozen=True)\nclass RegSource:\n    season: int\n    issue: int\n    published: date\n    url: str\n    fmt: Literal[\"classic\", \"section_b\"] = \"classic\"\n\n    @property\n    def filename(self) -> str:\n        return f\"{self.season}_iss{self.issue:02d}.pdf\"\n\n\n# 2026 first: it's the current season. Issues 1-4 predate the first race and are omitted.\n_S26 = \"fia_2026_f1_regulations_-_section_b_sporting_-_iss\"\n_F24 = \"fia_2024_formula_1_sporting_regulations_-_issue\"\nSOURCES: tuple[RegSource, ...] = (\n    RegSource(2026, 5, date(2026, 2, 27), f\"{_NEW}/{_S26}_05_-_2026-02-27.pdf\", \"section_b\"),\n    RegSource(2026, 6, date(2026, 4, 28), f\"{_NEW}/{_S26}_06_-_2026-04-28.pdf\", \"section_b\"),\n    RegSource(2026, 7, date(2026, 6, 25), f\"{_NEW}/{_S26}_07_-_2026-06-25.pdf\", \"section_b\"),\n    RegSource(2026, 8, date(2026, 8, 5), f\"{_NEW}/{_S26}_08_-_2026-08-05_7.pdf\", \"section_b\"),\n    RegSource(\n        2025,\n        5,\n        date(2025, 4, 30),\n        f\"{_NEW}/fia_2025_formula_1_sporting_regulations_-_issue_5_-_2025-04-30.pdf\",\n    ),\n    RegSource(2024, 5, date(2024, 2, 28), f\"{_OLD}/{_F24}_5_-_2024-02-28.pdf\"),\n    RegSource(2024, 6, date(2024, 4, 30), f\"{_OLD}/{_F24}_6_-_2024-04-30_v2.pdf\"),\n    RegSource(2024, 7, date(2024, 7, 31), f\"{_OLD}/{_F24}_7_-_2024-07-31.pdf\"),\n)\n\n\ndef source_for_race(season: int, race_date: date) -> RegSource:\n    \"\"\"Latest indexed issue published on or before race day; earliest issue if none precede it.\"\"\"\n    issues = sorted((s for s in SOURCES if s.season == season), key=lambda s: s.published)\n    if not issues:\n        raise ValueError(f\"No Sporting Regulations indexed for {season}.\")\n    in_force = [s for s in issues if s.published \u003c= race_date]\n    return in_force[-1] if in_force else issues[0]\n", "src/rag/chunking.py": "\"\"\"Split Sporting Regulations text into clause-level chunks.\n\nTwo document formats exist:\n- \"classic\" (2023-2025): articles `30) SUPPLY OF TYRES ...`, clauses `30.5 Use of Tyres`.\n- \"section_b\" (2026+): `ARTICLE B6: TYRE LIMITATIONS`, sections `B6.3 Use & Return of Tyres`,\n  clauses `B6.3.6 Unless they have used ...`.\nEach clause becomes one chunk (long clauses are split into parts) so retrieval results can cite\nan exact article number.\n\"\"\"\n\nimport re\nimport unicodedata\nfrom dataclasses import dataclass\n\nfrom src.rag.sources import RegSource\n\nMAX_CHUNK_CHARS = 1800\nMIN_TAIL_CHARS = 300  # shorter leftovers are merged into the previous part\n\n\n@dataclass(frozen=True)\nclass RegChunk:\n    chunk_id: str\n    article: str  # most specific number, e.g. \"30.5\" or \"B6.3.6\"\n    article_title: str  # enclosing article (classic) or section (section_b) title\n    part: int\n    text: str\n    season: int\n    issue: int\n\n    @property\n    def citation(self) -> str:\n        return f\"{self.season} Sporting Regulations (Issue {self.issue}), Article {self.article}\"\n\n    def embedding_text(self) -> str:\n        return f\"Article {self.article} ({self.article_title.title()}): {self.text}\"\n\n\ndef _split_long(text: str) -> list[str]:\n    if len(text) \u003c= MAX_CHUNK_CHARS:\n        return [text]\n    parts, current = [], \"\"\n    for line in text.splitlines(keepends=True):\n        if current and len(current) + len(line) > MAX_CHUNK_CHARS:\n            parts.append(current)\n            current = \"\"\n        current += line\n    if current.strip() and parts and len(current) \u003c MIN_TAIL_CHARS:\n        parts[-1] += current\n    elif current.strip():\n        parts.append(current)\n    return parts\n\n\ndef _make_chunks(spans: list[tuple[str, str, str]], source: RegSource) -> list[RegChunk]:\n    \"\"\"spans: (article number, title, text).\"\"\"\n    chunks = []\n    for article, title, text in spans:\n        text = text.strip()\n        if not text or text.upper() == \"VOID\":\n            continue\n        for part, piece in enumerate(_split_long(text), start=1):\n            chunks.append(\n                RegChunk(\n                    chunk_id=f\"{source.season}-iss{source.issue}-{article}-{part}\",\n                    article=article,\n                    article_title=title,\n                    part=part,\n                    text=piece.strip(),\n                    season=source.season,\n                    issue=source.issue,\n                )\n            )\n    return chunks\n\n\n_MID_SENTENCE = re.compile(\n    r\"(?:\\b(?:Articles?|and|or|of|to|in|with|under|see)|,)\\s*$\", re.IGNORECASE\n)\n\n\ndef _is_wrapped_reference(text: str, m: re.Match) -> bool:\n    \"\"\"True if the line before `m` ends mid-sentence (\"...see Article\" / \"...B5.3.3 and\"), meaning\n    `m` is a cross-reference that wrapped onto a new line rather than a new clause.\"\"\"\n    previous = text[: m.start()].rstrip().rsplit(\"\\n\", 1)[-1]\n    return bool(_MID_SENTENCE.search(previous))\n\n\ndef _sequential(matches, key, max_gap: int = 3) -> list[re.Match]:\n    \"\"\"Keep matches that plausibly follow the previous clause: a slightly higher number in the\n    same section, or clause 1 of a nearby section. Keys are (section, clause) tuples.\n\n    Cross-references that wrap onto a new line (\"...see Article\\\\n10.1 which...\") otherwise look\n    like clause starts, and a single forward-jumping one would swallow the real clauses after it.\n    \"\"\"\n    kept, (ps, pc) = [], (0, 0)\n    for m in matches:\n        cs, cc = key(m)\n        first_in_article = not kept and cc == 1\n        if (\n            first_in_article\n            or (cs == ps and pc \u003c cc \u003c= pc + max_gap)\n            or (ps \u003c cs \u003c= ps + max_gap and cc == 1)\n        ):\n            kept.append(m)\n            ps, pc = cs, cc\n    return kept\n\n\ndef _slice(text: str, matches: list[re.Match], i: int, end: int) -> str:\n    return text[matches[i].start() : matches[i + 1].start() if i + 1 \u003c len(matches) else end]\n\n\n# --- classic (2023-2025) -------------------------------------------------------------------\n\n_C_ARTICLE = re.compile(r\"^\\s*(\\d{1,2})\\)\\s+([A-Z][A-Z ,\\-/()&'’É]+?)\\s*$\", re.MULTILINE)\n_C_CLAUSE = re.compile(r\"^\\s*(\\d{1,2})\\.(\\d{1,2})\\s\", re.MULTILINE)\n_C_APPENDIX = re.compile(r\"^\\s*APPENDIX 1\\s*$\", re.MULTILINE)\n_C_NOISE = (\n    re.compile(r\"^\\s*\\d{4} Formula 1 Sporting Regulations \\d+/\\d+ .*$\", re.MULTILINE),\n    re.compile(r\"^\\s*©\\d{4} Fédération Internationale de l.Automobile.*$\", re.MULTILINE),\n)\n\n\ndef _chunk_classic(text: str, source: RegSource) -> list[RegChunk]:\n    for pattern in _C_NOISE:\n        text = pattern.sub(\"\", text)\n    first = _C_ARTICLE.search(text)\n    if not first:\n        raise ValueError(\"No article headings found; not a classic-format document.\")\n    body = text[first.start() :]  # drops the table of contents\n    appendix = _C_APPENDIX.search(body)\n    body = body[: appendix.start()] if appendix else body\n\n    headings = list(_C_ARTICLE.finditer(body))\n    spans = []\n    for i, heading in enumerate(headings):\n        number, title = heading.group(1), heading.group(2).strip()\n        section = _slice(body, headings, i, len(body))[heading.end() - heading.start() :]\n        clauses = _sequential(\n            (\n                m\n                for m in _C_CLAUSE.finditer(section)\n                if m.group(1) == number and not _is_wrapped_reference(section, m)\n            ),\n            key=lambda m: (0, int(m.group(2))),\n        )\n        if not clauses:\n            spans.append((number, title, section))\n        for j, m in enumerate(clauses):\n            spans.append(\n                (f\"{number}.{m.group(2)}\", title, _slice(section, clauses, j, len(section)))\n            )\n    return _make_chunks(spans, source)\n\n\n# --- section_b (2026+) ---------------------------------------------------------------------\n\n# Table-of-contents headings end in a page number; body headings don't.\n_B_ARTICLE = re.compile(r\"^\\s*ARTICLE B(\\d{1,2}):\\s*(.+?)\\s*$\", re.MULTILINE)\n_B_SECTION = re.compile(r\"^\\s*B(\\d{1,2})\\.(\\d{1,2})\\s+([A-Z].*?)\\s*$\", re.MULTILINE)\n_B_APPENDIX = re.compile(r\"^\\s*APPENDIX B\\d+:.*[^\\d\\s]\\s*$\", re.MULTILINE)  # body, not TOC\n_B_CLAUSE = re.compile(r\"^\\s*B(\\d{1,2})\\.(\\d{1,2})\\.(\\d{1,2})\\s\", re.MULTILINE)\n_B_NOISE = (\n    re.compile(r\"^\\s*SECTION B: SPORTING REGULATIONS\\s*$\", re.MULTILINE),\n    re.compile(r\"^\\s*B\\d+ \\d{4} Formula 1: Sporting Regulations\\s*$\", re.MULTILINE),\n    re.compile(r\"^\\s*©\\d{4} Fédération Internationale de l.Automobile.*$\", re.MULTILINE),\n    re.compile(r\"^\\s*\\d{2} [A-Z][a-z]+ \\d{4}\\s*$\", re.MULTILINE),  # issue date line\n    re.compile(r\"^\\s*Issue \\d+\\s*$\", re.MULTILINE),\n    re.compile(r\"^\\s*[0B]\\s*$\", re.MULTILINE),  # stray page-furniture glyphs\n)\n\n\ndef _fix_ligatures(text: str) -> str:\n    # The 2026 PDF maps the \"ff\"/\"ffi\" ligature glyph to \"‘\" (body) or \"W\" (headings):\n    # \"o‘icials\" -> \"officials\", \"e‘ort\" -> \"effort\", \"OWicials\" -> \"Officials\".\n    text = unicodedata.normalize(\"NFKC\", text)  # \"ﬁ\" -> \"fi\", \"ﬂ\" -> \"fl\"\n    text = re.sub(r\"(?\u003c=[A-Za-z])‘\", \"ff\", text)\n    return re.sub(r\"\\bOW(?=ic)\", \"Off\", text)\n\n\ndef _chunk_section_b(text: str, source: RegSource) -> list[RegChunk]:\n    text = _fix_ligatures(text)\n    for pattern in _B_NOISE:\n        text = pattern.sub(\"\", text)\n\n    body_articles = [m for m in _B_ARTICLE.finditer(text) if not re.search(r\"\\s\\d+$\", m.group(2))]\n    # Appendices repeat article headings; stop at the first non-increasing number.\n    articles = []\n    for m in body_articles:\n        if articles and int(m.group(1)) \u003c= int(articles[-1].group(1)):\n            break\n        articles.append(m)\n    if not articles:\n        raise ValueError(\"No ARTICLE Bn headings found; not a section_b-format document.\")\n    appendix = _B_APPENDIX.search(text, articles[0].start())\n    body_end = appendix.start() if appendix else len(text)\n\n    spans = []\n    for i, article in enumerate(articles):\n        number = article.group(1)\n        article_text = _slice(text, articles, i, body_end)\n        section_titles: dict[str, str] = {}\n        for m in _B_SECTION.finditer(article_text):\n            if m.group(1) == number:\n                section_titles.setdefault(m.group(2), m.group(3))\n        # Section heading lines would otherwise trail the previous clause's text.\n        article_text = _B_SECTION.sub(\"\", article_text)\n        clauses = _sequential(\n            (\n                m\n                for m in _B_CLAUSE.finditer(article_text)\n                if m.group(1) == number and not _is_wrapped_reference(article_text, m)\n            ),\n            key=lambda m: (int(m.group(2)), int(m.group(3))),\n        )\n        for j, m in enumerate(clauses):\n            title = section_titles.get(m.group(2), article.group(2))\n            spans.append(\n                (\n                    f\"B{number}.{m.group(2)}.{m.group(3)}\",\n                    title,\n                    _slice(article_text, clauses, j, len(article_text)),\n                )\n            )\n    return _make_chunks(spans, source)\n\n\ndef chunk_regulations(raw_text: str, source: RegSource) -> list[RegChunk]:\n    if source.fmt == \"section_b\":\n        return _chunk_section_b(raw_text, source)\n    return _chunk_classic(raw_text, source)\n", "src/rag/glossary.py": "\"\"\"Map paddock vocabulary to the words the Sporting Regulations actually use.\n\nRetrieval misses happen when a question uses team jargon the regulations never contain: the\n2026 text says \"suspension\", never \"red flag\" in its clauses on work permitted during a stoppage,\nand never mentions an \"undercut\" at all. Expansion is deterministic so it doesn't depend on the\nrouter LLM remembering to rephrase.\n\"\"\"\n\nimport re\n\nGLOSSARY: dict[str, str] = {\n    r\"red[\\s-]?flag(?:ged)?(?: period)?\": \"suspension\",\n    r\"under[\\s-]?cut|over[\\s-]?cut\": \"pit stop tyre change\",\n    r\"\\bvsc\\b\": \"virtual safety car\",\n    r\"\\bsc\\b\": \"safety car\",\n    r\"compounds?\": \"specifications of dry-weather tyres\",\n    r\"degradation|\\bdeg\\b\": \"use of tyres\",\n    r\"restart\": \"resumption\",\n    r\"track[\\s-]?limits?\": \"leaving the track gaining an advantage\",\n}\n\n\ndef expand_query(query: str) -> str | None:\n    \"\"\"`query` with paddock jargon replaced by regulation vocabulary, or None if it has none.\n\n    Substitution beats appending: extra words dilute the dense embedding of the original.\"\"\"\n    expanded = query\n    for pattern, replacement in GLOSSARY.items():\n        expanded = re.sub(pattern, replacement, expanded, flags=re.IGNORECASE)\n    return expanded if expanded != query else None\n\n\n# The regulations use British spelling; BM25 matches exact tokens, so \"tire\" never hits \"tyre\".\nUS_TO_UK: dict[str, str] = {\n    r\"\\btire(s?)\\b\": r\"tyre\\1\",\n    r\"\\blicense(s?)\\b\": r\"licence\\1\",\n    r\"\\bcenter\\b\": \"centre\",\n    r\"\\bcolor(s?)\\b\": r\"colour\\1\",\n}\n\n\ndef normalize_spelling(query: str) -> str:\n    for pattern, replacement in US_TO_UK.items():\n        query = re.sub(pattern, replacement, query, flags=re.IGNORECASE)\n    return query\n", "src/rag/index.py": "\"\"\"Hybrid (dense + BM25) regulation index on embedded Qdrant.\n\nDense vectors (bge-small) catch paraphrases (\"pit lane shut during a stoppage\"); BM25 catches\nexact regulatory vocabulary (\"dry-weather tyres\", \"suspended\"). Results are fused with\nReciprocal Rank Fusion. Everything runs locally: embedded Qdrant storage, fastembed ONNX models.\n\"\"\"\n\nfrom dataclasses import asdict, dataclass\nfrom pathlib import Path\nfrom uuid import NAMESPACE_URL, uuid5\n\nfrom fastembed import SparseTextEmbedding, TextEmbedding\nfrom qdrant_client import QdrantClient, models\n\nfrom src.rag.chunking import RegChunk\nfrom src.rag.glossary import normalize_spelling\n\nDEFAULT_INDEX_PATH = Path(\"data/qdrant\")\nCOLLECTION = \"sporting_regulations\"\nDENSE_MODEL = \"BAAI/bge-small-en-v1.5\"\nSPARSE_MODEL = \"Qdrant/bm25\"\n# bge models expect this prefix on queries (not documents) for retrieval.\n_QUERY_PREFIX = \"Represent this sentence for searching relevant passages: \"\n\n\n@dataclass(frozen=True)\nclass RetrievedClause:\n    chunk: RegChunk\n    score: float\n\n\nclass RegulationIndex:\n    def __init__(self, path: Path = DEFAULT_INDEX_PATH) -> None:\n        self._client = QdrantClient(path=str(path))\n        self._dense = TextEmbedding(DENSE_MODEL)\n        self._sparse = SparseTextEmbedding(SPARSE_MODEL)\n\n    def rebuild(self, chunks: list[RegChunk], batch_size: int = 64) -> None:\n        if self._client.collection_exists(COLLECTION):\n            self._client.delete_collection(COLLECTION)\n        dim = self._dense.embedding_size\n        self._client.create_collection(\n            COLLECTION,\n            vectors_config={\n                \"dense\": models.VectorParams(size=dim, distance=models.Distance.COSINE)\n            },\n            sparse_vectors_config={\"bm25\": models.SparseVectorParams(modifier=models.Modifier.IDF)},\n        )\n\n        for start in range(0, len(chunks), batch_size):\n            batch = chunks[start : start + batch_size]\n            texts = [c.embedding_text() for c in batch]\n            dense = self._dense.embed(texts)\n            sparse = self._sparse.embed(texts)\n            self._client.upsert(\n                COLLECTION,\n                points=[\n                    models.PointStruct(\n                        id=str(uuid5(NAMESPACE_URL, c.chunk_id)),\n                        vector={\n                            \"dense\": d.tolist(),\n                            \"bm25\": models.SparseVector(\n                                indices=s.indices.tolist(), values=s.values.tolist()\n                            ),\n                        },\n                        payload=asdict(c),\n                    )\n                    for c, d, s in zip(batch, dense, sparse, strict=True)\n                ],\n            )\n\n    def search(self, query: str, season: int, issue: int, k: int = 5) -> list[RetrievedClause]:\n        query = normalize_spelling(query)\n        dense = next(self._dense.embed([_QUERY_PREFIX + query])).tolist()\n        sparse = next(self._sparse.query_embed(query))\n        scope = models.Filter(\n            must=[\n                models.FieldCondition(key=\"season\", match=models.MatchValue(value=season)),\n                models.FieldCondition(key=\"issue\", match=models.MatchValue(value=issue)),\n            ]\n        )\n        result = self._client.query_points(\n            COLLECTION,\n            prefetch=[\n                models.Prefetch(query=dense, using=\"dense\", filter=scope, limit=k * 4),\n                models.Prefetch(\n                    query=models.SparseVector(\n                        indices=sparse.indices.tolist(), values=sparse.values.tolist()\n                    ),\n                    using=\"bm25\",\n                    filter=scope,\n                    limit=k * 4,\n                ),\n            ],\n            query=models.FusionQuery(fusion=models.Fusion.RRF),\n            limit=k,\n        )\n        return [RetrievedClause(RegChunk(**p.payload), p.score) for p in result.points]\n\n    def close(self) -> None:\n        self._client.close()\n", "src/tools/openf1.py": "\"\"\"OpenF1 API clients.\n\n`OpenF1Client` holds all query logic; subclasses only supply `_fetch`, which returns the raw\nJSON rows for an endpoint filtered by exact-match params. `HttpOpenF1Client` hits the real API\nwith a disk cache; `MockOpenF1Client` serves recorded fixtures so tests never touch the network.\n\"\"\"\n\nimport hashlib\nimport json\nimport re\nimport time\nimport unicodedata\nfrom abc import ABC, abstractmethod\nfrom collections.abc import Callable\nfrom datetime import UTC, datetime, timedelta\nfrom pathlib import Path\nfrom typing import Any, Literal\n\nimport httpx\n\nfrom src.tools.models import (\n    Driver,\n    Interval,\n    Lap,\n    PitStop,\n    Position,\n    RaceControlMessage,\n    Session,\n    SessionResult,\n    Stint,\n)\n\nBASE_URL = \"https://api.openf1.org/v1\"\nDEFAULT_CACHE_DIR = Path(\"data/cache/openf1\")\n\nParams = dict[str, str | int]\n\n\nclass OpenF1Error(RuntimeError):\n    pass\n\n\ndef _normalize(name: str) -> str:\n    \"\"\"Case- and accent-insensitive form, so \"montreal\" matches \"Montréal\".\"\"\"\n    decomposed = unicodedata.normalize(\"NFKD\", name.strip().casefold())\n    return \"\".join(ch for ch in decomposed if not unicodedata.combining(ch))\n\n\nclass OpenF1Client(ABC):\n    @abstractmethod\n    def _fetch(self, endpoint: str, params: Params) -> list[dict[str, Any]]: ...\n\n    def get_session(self, year: int, place: str, session_name: str = \"Race\") -> Session:\n        \"\"\"Find a session by country, location or circuit name (case-insensitive).\n\n        Several countries host more than one race a season (2026: Spain has Barcelona and\n        Madrid), so an ambiguous country raises instead of guessing.\n        \"\"\"\n        rows = self._fetch(\"sessions\", {\"year\": year, \"session_name\": session_name})\n        sessions = [Session.model_validate(r) for r in rows]\n        needle = _normalize(place)\n        names = {\n            s.session_key: [\n                _normalize(n) for n in (s.country_name, s.location, s.circuit_short_name)\n            ]\n            for s in sessions\n        }\n        matches = [s for s in sessions if needle in names[s.session_key]]\n        # Short forms: a whole word first (\"Spa\" -> Spa-Francorchamps, not Spain), then a prefix.\n        for short in (\n            lambda n: needle in re.split(r\"[^a-z0-9]+\", n),\n            lambda n: n.startswith(needle),\n        ):\n            if matches or not needle:\n                break\n            matches = [s for s in sessions if any(short(n) for n in names[s.session_key])]\n        if len(matches) == 1:\n            return matches[0]\n        if matches:\n            options = \"; \".join(s.label for s in matches)\n            raise OpenF1Error(f\"{place!r} matches several {year} races, specify one: {options}\")\n        known = \", \".join(sorted({s.location for s in sessions})) or \"none\"\n        raise OpenF1Error(f\"No {year} {session_name} found for {place!r}. Known locations: {known}\")\n\n    def get_latest_session(\n        self, now: datetime, session_name: str = \"Race\", settle: timedelta = timedelta(minutes=30)\n    ) -> Session:\n        \"\"\"Most recent session that has finished (and whose data is free: OpenF1 releases it\n        ~30 minutes after the end). Looks back into the previous season early in the year.\"\"\"\n        for year in (now.year, now.year - 1):\n            rows = self._fetch(\"sessions\", {\"year\": year, \"session_name\": session_name})\n            done = [\n                Session.model_validate(r)\n                for r in rows\n                if r.get(\"date_end\")\n                and datetime.fromisoformat(r[\"date_end\"]) + settle \u003c= now\n                and not r.get(\"is_cancelled\")\n            ]\n            if done:\n                return max(done, key=lambda s: s.date_start)\n        raise OpenF1Error(f\"No finished {session_name} found in {now.year - 1}-{now.year}.\")\n\n    def get_results(self, session_key: int) -> list[SessionResult]:\n        rows = self._fetch(\"session_result\", {\"session_key\": session_key})\n        return sorted(\n            (SessionResult.model_validate(r) for r in rows), key=lambda r: r.position or 99\n        )\n\n    def get_all_laps(self, session_key: int) -> list[Lap]:\n        \"\"\"Every driver's laps in one request (vs one request per driver).\"\"\"\n        laps = [Lap.model_validate(r) for r in self._fetch(\"laps\", {\"session_key\": session_key})]\n        return sorted(laps, key=lambda lap: (lap.driver_number, lap.lap_number))\n\n    def get_session_by_key(self, session_key: int) -> Session:\n        rows = self._fetch(\"sessions\", {\"session_key\": session_key})\n        if not rows:\n            raise OpenF1Error(f\"No session with key {session_key}.\")\n        return Session.model_validate(rows[0])\n\n    def get_drivers(self, session_key: int, team_name: str | None = None) -> list[Driver]:\n        params: Params = {\"session_key\": session_key}\n        if team_name:\n            params[\"team_name\"] = team_name\n        return [Driver.model_validate(r) for r in self._fetch(\"drivers\", params)]\n\n    def get_stints(self, session_key: int, driver_number: int | None = None) -> list[Stint]:\n        params: Params = {\"session_key\": session_key}\n        if driver_number is not None:\n            params[\"driver_number\"] = driver_number\n        stints = [Stint.model_validate(r) for r in self._fetch(\"stints\", params)]\n        return sorted(stints, key=lambda s: (s.driver_number, s.stint_number))\n\n    def get_laps(\n        self,\n        session_key: int,\n        driver_number: int,\n        lap_start: int | None = None,\n        lap_end: int | None = None,\n    ) -> list[Lap]:\n        # Range filtering is done locally: a driver's full race is \u003c 100 rows and it keeps\n        # the fetch cacheable regardless of the requested window.\n        rows = self._fetch(\"laps\", {\"session_key\": session_key, \"driver_number\": driver_number})\n        laps = [Lap.model_validate(r) for r in rows]\n        laps = [\n            lap\n            for lap in laps\n            if (lap_start is None or lap.lap_number >= lap_start)\n            and (lap_end is None or lap.lap_number \u003c= lap_end)\n        ]\n        return sorted(laps, key=lambda lap: lap.lap_number)\n\n    def get_race_control(\n        self,\n        session_key: int,\n        lap_start: int | None = None,\n        lap_end: int | None = None,\n        category: str | None = None,\n    ) -> list[RaceControlMessage]:\n        rows = self._fetch(\"race_control\", {\"session_key\": session_key})\n        msgs = [RaceControlMessage.model_validate(r) for r in rows]\n        return [\n            m\n            for m in msgs\n            if (category is None or m.category == category)\n            and (lap_start is None or (m.lap_number is not None and m.lap_number >= lap_start))\n            and (lap_end is None or (m.lap_number is not None and m.lap_number \u003c= lap_end))\n        ]\n\n    # Time-series endpoints. `until`/`since` are ISO timestamps; OpenF1 filters them\n    # server-side via `date\u003c`/`date>` params, so we never download a whole race of intervals.\n\n    def get_positions(self, session_key: int, until: str | None = None) -> list[Position]:\n        params: Params = {\"session_key\": session_key}\n        if until:\n            params[\"date\u003c\"] = until\n        return [Position.model_validate(r) for r in self._fetch(\"position\", params)]\n\n    def get_intervals(self, session_key: int, since: str, until: str) -> list[Interval]:\n        params: Params = {\"session_key\": session_key, \"date>\": since, \"date\u003c\": until}\n        return [Interval.model_validate(r) for r in self._fetch(\"intervals\", params)]\n\n    def get_pit_stops(self, session_key: int, until: str | None = None) -> list[PitStop]:\n        params: Params = {\"session_key\": session_key}\n        if until:\n            params[\"date\u003c\"] = until\n        return [PitStop.model_validate(r) for r in self._fetch(\"pit\", params)]\n\n\nclass HttpOpenF1Client(OpenF1Client):\n    \"\"\"Real API client with a disk cache that knows when data can still change.\n\n    - Data for a session is cached forever only once the session ended SETTLE_AFTER ago; during\n      and just after a race weekend it's refetched, so partial data never gets frozen.\n    - Empty results are never cached (a 404 during a live window isn't a permanent answer).\n    - Calendar queries (sessions by year) expire after CALENDAR_TTL: races get added/moved.\n    \"\"\"\n\n    SETTLE_AFTER = timedelta(hours=6)\n    CALENDAR_TTL = timedelta(hours=12)\n\n    def __init__(\n        self,\n        cache_dir: Path | None = DEFAULT_CACHE_DIR,\n        timeout: float = 30.0,\n        max_retries: int = 4,\n        now: Callable[[], datetime] = lambda: datetime.now(UTC),\n    ) -> None:\n        self._http = httpx.Client(base_url=BASE_URL, timeout=timeout)\n        self._cache_dir = cache_dir\n        self._max_retries = max_retries\n        self._now = now\n        self._session_ends: dict[Any, str | None] = {}  # avoids a sessions request per call\n\n    def _cache_path(self, endpoint: str, params: Params) -> Path | None:\n        if self._cache_dir is None:\n            return None\n        key = json.dumps([endpoint, sorted(params.items())], default=str)\n        return self._cache_dir / f\"{endpoint}-{hashlib.sha1(key.encode()).hexdigest()[:16]}.json\"\n\n    def _read_cache(self, path: Path | None) -> list[dict[str, Any]] | None:\n        if not path or not path.exists():\n            return None\n        entry = json.loads(path.read_text())\n        if isinstance(entry, list):  # legacy format: cached forever\n            return entry\n        expires = entry[\"expires_at\"]\n        if expires and datetime.fromisoformat(expires) \u003c= self._now():\n            return None\n        return entry[\"rows\"]\n\n    def _expiry(\n        self, endpoint: str, params: Params, rows: list[dict[str, Any]]\n    ) -> datetime | None | Literal[\"never-cache\"]:\n        \"\"\"When a response stops being trustworthy: None = never expires.\"\"\"\n        if not rows:\n            return \"never-cache\"\n        now = self._now()\n        if endpoint == \"sessions\" and \"session_key\" not in params:\n            return now + self.CALENDAR_TTL\n        session_key = params.get(\"session_key\")\n        if session_key is None:\n            return now + self.CALENDAR_TTL\n        if endpoint == \"sessions\":\n            self._session_ends[session_key] = rows[0].get(\"date_end\")\n        elif session_key not in self._session_ends:\n            session_rows = self._fetch(\"sessions\", {\"session_key\": session_key})\n            self._session_ends[session_key] = (\n                session_rows[0].get(\"date_end\") if session_rows else None\n            )\n        date_end = self._session_ends[session_key]\n        if date_end and datetime.fromisoformat(date_end) + self.SETTLE_AFTER \u003c= now:\n            return None\n        return now + self.CALENDAR_TTL if endpoint == \"sessions\" else \"never-cache\"\n\n    def _fetch(self, endpoint: str, params: Params) -> list[dict[str, Any]]:\n        path = self._cache_path(endpoint, params)\n        cached = self._read_cache(path)\n        if cached is not None:\n            return cached\n\n        for attempt in range(self._max_retries + 1):\n            resp = self._http.get(f\"/{endpoint}\", params=params)\n            if resp.status_code == 429 and attempt \u003c self._max_retries:\n                # Free tier: 3 req/s and 30 req/min, so back off in seconds, not milliseconds.\n                retry_after = resp.headers.get(\"retry-after\", \"\")\n                time.sleep(float(retry_after) if retry_after.isdigit() else 2 ** (attempt + 2))\n                continue\n            # OpenF1 returns 404 with a JSON detail when a filter matches nothing.\n            if resp.status_code == 404:\n                rows: list[dict[str, Any]] = []\n                break\n            if resp.status_code in (401, 403):\n                # Live data (30 min before to 30 min after a session) needs a paid account.\n                raise OpenF1Error(\n                    f\"OpenF1 refused {endpoint} (HTTP {resp.status_code}). If a session is live, \"\n                    \"its data is paid-only until about 30 minutes after it ends.\"\n                )\n            if resp.is_error:\n                raise OpenF1Error(f\"OpenF1 {endpoint} {params} -> HTTP {resp.status_code}\")\n            rows = resp.json()\n            break\n\n        expiry = self._expiry(endpoint, params, rows)\n        if path and expiry != \"never-cache\":\n            path.parent.mkdir(parents=True, exist_ok=True)\n            entry = {\"expires_at\": expiry.isoformat() if expiry else None, \"rows\": rows}\n            path.write_text(json.dumps(entry))\n        return rows\n\n\nclass MockOpenF1Client(OpenF1Client):\n    \"\"\"Serves rows from `\u003cfixtures_dir>/\u003cendpoint>.json`, filtered by exact-match params.\"\"\"\n\n    def __init__(self, fixtures_dir: Path) -> None:\n        self._fixtures_dir = fixtures_dir\n        self.calls: list[tuple[str, Params]] = []\n\n    def _fetch(self, endpoint: str, params: Params) -> list[dict[str, Any]]:\n        self.calls.append((endpoint, params))\n        path = self._fixtures_dir / f\"{endpoint}.json\"\n        if not path.exists():\n            return []\n        rows = json.loads(path.read_text())\n        return [r for r in rows if all(_matches(r, k, v) for k, v in params.items())]\n\n\ndef _matches(row: dict[str, Any], key: str, value: str | int) -> bool:\n    \"\"\"Exact match, or OpenF1's `field\u003c` / `field>` range filters (the mock's version).\"\"\"\n    if key.endswith(\"\u003c\"):\n        return row.get(key[:-1], \"\") \u003c value\n    if key.endswith(\">\"):\n        return row.get(key[:-1], \"\") > value\n    return row.get(key) == value\n", "src/mcp_server.py": "\"\"\"Pit Wall as an MCP server: race data and strategy models as tools, the client's LLM reasons.\n\nGeneral building blocks rather than question-shaped tools: results, laps, stints, pit stops,\npositions, gaps, race control, weather, regulations and stewards' rulings, plus the models an LLM\ncan't reproduce by reading tables (pit-stop reviews and what-ifs, who wins from here, pre-race\nprediction, luck-adjusted results, tyre life). No LLM calls inside the tools.\n\nEvery result is compact JSON with a `source`; anything that isn't known is reported as unknown\n(`null` or an `ERROR: ...` string with the valid options), never filled in.\n\nRun:\n  python -m src.mcp_server                       # stdio (Claude Code / Claude Desktop)\n  uvicorn src.api:app --port 8000                # streamable HTTP at http://localhost:8000/mcp\n\"\"\"\n\nimport json\nimport re\nimport unicodedata\nfrom collections.abc import Callable\nfrom datetime import UTC, date, datetime, timedelta\nfrom typing import Any\n\nimport httpx\n\nfrom src.seasons import out_of_scope_message, supported_seasons\nfrom src.tools.models import Driver, Lap, Session\nfrom src.tools.openf1 import HttpOpenF1Client, OpenF1Client, OpenF1Error\nfrom src.tools.telemetry import (\n    _overlaps,\n    build_telemetry_tools,\n    key_race_events,\n    neutralised_windows,\n    race_incidents,\n    race_summary,\n    representative_laps,\n)\n\nOPENF1 = \"OpenF1 (api.openf1.org)\"\nARCHIVE = \"F1 live-timing archive (livetiming.formula1.com)\"\nWAREHOUSE = \"Pit Wall warehouse (DuckDB, built from OpenF1)\"\nMAX_ROWS = 400  # per result; narrow the lap range beyond that\n\n# Broadcast nicknames that aren't part of a driver's name. First names, surnames, acronyms and\n# numbers are matched from the feed itself.\nNICKNAMES = {\"checo\": \"PER\", \"lewis hamilton\": \"HAM\"}\n\nINSTRUCTIONS = \"\"\"\\\nPit Wall: Formula 1 race data and strategy models for the current and previous season.\n- Take every number from a tool result; if a tool says unknown or returns ERROR, say so rather\n  than estimating. Check a question's premise against the data (who pitted when, who finished).\n- Name races by year + place (\"2026\", \"Madrid\"); an ambiguous place returns the options.\n  Use find_driver for first names and nicknames (\"Kimi\", \"Checo\").\n- Strategy questions: review_pit_stop simulates the alternatives with traffic; pace and stints\n  alone don't. Cite regulation articles from search_regulations and rulings from\n  stewards_decisions by their ids.\n- Luck principle: safety car / VSC / red flag timing is luck. luck_adjusted_result removes it;\n  predictions leave it out.\"\"\"\n\n\ndef _json(data: Any) -> str:\n    return json.dumps(data, separators=(\",\", \":\"), default=str)\n\n\ndef _fold(s: str) -> str:\n    decomposed = unicodedata.normalize(\"NFKD\", str(s).strip().casefold())\n    return \"\".join(ch for ch in decomposed if not unicodedata.combining(ch))\n\n\ndef _error(msg: str) -> str:\n    return f\"ERROR: {msg}\"\n\n\nclass PitwallTools:\n    \"\"\"The tool implementations, plain methods so they test without an MCP transport.\"\"\"\n\n    def __init__(\n        self,\n        client: OpenF1Client,\n        seasons: list[int] | None = None,\n        now: Callable[[], datetime] = lambda: datetime.now(UTC),\n        regulations: Callable[[], Any] | None = None,\n        decisions: Callable[[], Any] | None = None,\n    ):\n        self.client = client\n        self._seasons = seasons\n        self._now = now\n        self._make_regulations = regulations\n        self._make_decisions = decisions\n        self._regulations = None\n        self._decisions = None\n        self._telemetry: dict[int, dict[str, Any]] = {}\n\n    # --- resolution -------------------------------------------------------------------------\n\n    def seasons(self) -> list[int]:\n        return self._seasons or supported_seasons(self._now().date())\n\n    def _race(self, year: int, race: str, allow_future: bool = False) -> Session | str:\n        if year not in self.seasons():\n            return _error(out_of_scope_message(year, self._now().date()))\n        try:\n            if _fold(race) in (\"latest\", \"last\", \"last race\", \"most recent\"):\n                session = self.client.get_latest_session(self._now())\n            else:\n                session = self.client.get_session(year, race)\n        except OpenF1Error as e:\n            return _error(str(e))\n        if not allow_future and datetime.fromisoformat(session.date_start) > self._now():\n            return _error(f\"{session.label} hasn't happened yet, so there is no race data.\")\n        return session\n\n    def _tool(self, session: Session, name: str) -> Any:\n        if session.session_key not in self._telemetry:\n            tools = build_telemetry_tools(self.client, session)\n            self._telemetry[session.session_key] = {t.name: t for t in tools}\n        return self._telemetry[session.session_key][name]\n\n    def _drivers(self, session: Session) -> list[Driver]:\n        return self.client.get_drivers(session.session_key)\n\n    def _match(self, drivers: list[Driver], name: str) -> list[Driver]:\n        key = _fold(name).lstrip(\"#\")\n        alias = NICKNAMES.get(key)\n        exact, partial = [], []\n        for d in drivers:\n            given = d.first_name or \" \".join(d.full_name.split()[:-1])\n            names = {\n                str(d.driver_number),\n                d.name_acronym,\n                d.full_name,\n                given,\n                *given.split(),\n                d.last_name or d.full_name.split()[-1],\n            }\n            folded = {_fold(n) for n in names if n}\n            if key in folded or (alias and d.name_acronym == alias):\n                exact.append(d)\n            elif len(key) >= 3 and any(n.startswith(key) for n in folded):\n                partial.append(d)\n        return exact or partial\n\n    def _driver(self, session: Session, name: str) -> Driver | str:\n        drivers = self._drivers(session)\n        if not drivers:\n            return _error(f\"no entry list published for {session.label} yet; name another race\")\n        found = self._match(drivers, name)\n        if len(found) == 1:\n            return found[0]\n        options = \", \".join(f\"{d.name_acronym} ({d.full_name}, #{d.driver_number})\" for d in found)\n        if found:\n            return _error(f\"{name!r} matches several drivers: {options}\")\n        valid = \", \".join(f\"{d.name_acronym} ({d.full_name})\" for d in drivers)\n        return _error(f\"unknown driver {name!r} in {session.label}. Drivers: {valid}\")\n\n    def _laps(self, session: Session) -> list[Lap]:\n        return self.client.get_all_laps(session.session_key)\n\n    def _windows(self, session: Session):\n        return neutralised_windows(\n            self.client.get_race_control(session.session_key), self._laps(session)\n        )\n\n    # --- data tools -------------------------------------------------------------------------\n\n    def list_races(self, year: int) -> str:\n        \"\"\"Every Grand Prix of a season with its date and whether it has run yet.\"\"\"\n        if year not in self.seasons():\n            return _error(out_of_scope_message(year, self._now().date()))\n        rows = self.client._fetch(\"sessions\", {\"year\": year, \"session_name\": \"Race\"})\n        sessions = sorted((Session.model_validate(r) for r in rows), key=lambda s: s.date_start)\n        now = self._now()\n        return _json(\n            {\n                \"source\": OPENF1,\n                \"races\": [\n                    {\n                        \"location\": s.location,\n                        \"country\": s.country_name,\n                        \"circuit\": s.circuit_short_name,\n                        \"date\": s.date_start[:10],\n                        \"finished\": datetime.fromisoformat(s.date_start) \u003c= now,\n                    }\n                    for s in sessions\n                ],\n            }\n        )\n\n    def find_driver(self, year: int, name: str, race: str | None = None) -> str:\n        \"\"\"Find a driver by number, acronym, first name, surname, full name or nickname\n        (\"Kimi\", \"Checo\", \"Lando\", \"44\"). Uses the given race's entry list, else the season's\n        latest race. Returns every match when the name is ambiguous.\"\"\"\n        session = self._race(year, race or \"latest\")\n        if isinstance(session, str):\n            return session\n        found = self._match(self._drivers(session), name)\n        if not found:\n            return self._driver(session, name)\n        return _json(\n            {\n                \"source\": OPENF1,\n                \"entry_list_of\": session.label,\n                \"matches\": [\n                    {\n                        \"acronym\": d.name_acronym,\n                        \"name\": d.full_name,\n                        \"number\": d.driver_number,\n                        \"team\": d.team_name,\n                    }\n                    for d in found\n                ],\n            }\n        )\n\n    def race_results(self, year: int, race: str) -> str:\n        \"\"\"Final classification: position, driver, team, grid slot, status (finished / DNF /\n        DNS / DSQ), laps completed, gap to the winner (seconds, or \"+N LAP\") and points.\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        sk = session.session_key\n        drivers = {d.driver_number: d for d in self._drivers(session)}\n        grid: dict[int, int] = {}\n        for p in sorted(self.client.get_positions(sk), key=lambda p: p.date):\n            grid.setdefault(p.driver_number, p.position)\n        rows = []\n        for r in self.client.get_results(sk):\n            d = drivers.get(r.driver_number)\n            status = \"DSQ\" if r.dsq else \"DNS\" if r.dns else \"DNF\" if r.dnf else \"finished\"\n            rows.append(\n                {\n                    \"position\": r.position,\n                    \"driver\": d.name_acronym if d else r.driver_number,\n                    \"team\": d.team_name if d else None,\n                    \"grid\": grid.get(r.driver_number),\n                    \"status\": status,\n                    \"laps\": r.number_of_laps,\n                    \"gap_to_winner\": r.gap_to_leader,\n                    \"points\": r.points,\n                }\n            )\n        if not rows:\n            return _error(f\"no classification published for {session.label} yet\")\n        return _json(\n            {\n                \"source\": OPENF1,\n                \"race\": session.label,\n                \"notes\": \"grid = first position reading (includes penalties); gap null = \"\n                \"not published\",\n                \"results\": rows,\n            }\n        )\n\n    def race_summary(self, year: int, race: str) -> str:\n        \"\"\"The whole field in one table (strategy, stints, pace per stint, pit-lane time) plus\n        the race's key events (safety cars, VSCs, red flags). A good first call for any\n        question about a race.\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        return _json(\n            {\n                \"source\": OPENF1,\n                \"race\": session.label,\n                \"key_events\": json.loads(key_race_events(self.client, session.session_key)),\n                \"field\": json.loads(race_summary(self.client, session)),\n            }\n        )\n\n    def lap_times(self, year: int, race: str, driver: str, lap_start: int, lap_end: int) -> str:\n        \"\"\"One driver's lap times over a lap range (at most 20 laps; longer ranges return a pace\n        summary). Rows are [lap, seconds, pit-out lap].\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        d = self._driver(session, driver)\n        if isinstance(d, str):\n            return d\n        out = self._tool(session, \"get_lap_times\").invoke(\n            {\"driver\": str(d.driver_number), \"lap_start\": lap_start, \"lap_end\": lap_end}\n        )\n        return _json({\"source\": OPENF1, \"driver\": d.name_acronym, \"laps\": json.loads(out)})\n\n    def pace_summary(self, year: int, race: str, driver: str, lap_start: int, lap_end: int) -> str:\n        \"\"\"Mean / median / best lap and lap-time trend for one driver over a lap range,\n        excluding lap 1, pit laps, safety car / VSC / red flag laps and outliers.\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        d = self._driver(session, driver)\n        if isinstance(d, str):\n            return d\n        out = self._tool(session, \"get_pace_summary\").invoke(\n            {\"driver\": str(d.driver_number), \"lap_start\": lap_start, \"lap_end\": lap_end}\n        )\n        return _json({\"source\": OPENF1} | json.loads(out))\n\n    def tyre_stints(self, year: int, race: str, driver: str | None = None) -> str:\n        \"\"\"Tyre stints (compound, laps, tyre age at the start) for one driver or all, with each\n        stint's own measured wear: fuel-corrected seconds lost per lap of tyre age, from its\n        clean laps (null when the stint has too few clean laps to fit).\"\"\"\n        from src.models.tyres import CleanLap, stint_slopes\n\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        number = None\n        if driver:\n            d = self._driver(session, driver)\n            if isinstance(d, str):\n                return d\n            number = d.driver_number\n        sk = session.session_key\n        stints = self.client.get_stints(sk)\n        acronyms = {d.driver_number: d.name_acronym for d in self._drivers(session)}\n        clean = representative_laps(self._laps(session), self._windows(session))\n        rows: list[CleanLap] = []\n        for lap in clean:\n            st = next(\n                (\n                    s\n                    for s in stints\n                    if s.driver_number == lap.driver_number\n                    and s.lap_start is not None\n                    and s.lap_end is not None\n                    and s.lap_start \u003c= lap.lap_number \u003c= s.lap_end\n                ),\n                None,\n            )\n            if st and st.compound and lap.lap_duration:\n                age = (st.tyre_age_at_start or 0) + lap.lap_number - st.lap_start\n                rows.append(\n                    CleanLap(\n                        str(lap.driver_number),\n                        st.stint_number,\n                        st.compound,\n                        lap.lap_number,\n                        age,\n                        lap.lap_duration,\n                    )\n                )\n        wear = stint_slopes(rows)\n        return _json(\n            {\n                \"source\": OPENF1,\n                \"race\": session.label,\n                \"wear_note\": \"fuel-corrected (0.04 s/lap assumed fuel gain), from clean laps\",\n                \"stints\": [\n                    {\n                        \"driver\": acronyms.get(s.driver_number, s.driver_number),\n                        \"stint\": s.stint_number,\n                        \"compound\": s.compound,\n                        \"laps\": [s.lap_start, s.lap_end],\n                        \"tyre_age_at_start\": s.tyre_age_at_start,\n                        \"wear_s_per_lap\": (\n                            round(w, 3)\n                            if (w := wear.get((str(s.driver_number), s.stint_number))) is not None\n                            else None\n                        ),\n                    }\n                    for s in stints\n                    if number is None or s.driver_number == number\n                ],\n            }\n        )\n\n    def pit_stops(self, year: int, race: str, driver: str | None = None) -> str:\n        \"\"\"Every pit stop: driver, in-lap, pit-lane time (entry to exit), stationary time (null\n        where not published) and whether a safety car / VSC / red flag was out that lap.\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        number = None\n        if driver:\n            d = self._driver(session, driver)\n            if isinstance(d, str):\n                return d\n            number = d.driver_number\n        acronyms = {d.driver_number: d.name_acronym for d in self._drivers(session)}\n        laps = {(lap.driver_number, lap.lap_number): lap for lap in self._laps(session)}\n        windows = self._windows(session)\n        rows = []\n        for p in sorted(self.client.get_pit_stops(session.session_key), key=lambda p: p.date):\n            if number is not None and p.driver_number != number:\n                continue\n            lap = laps.get((p.driver_number, p.lap_number))\n            status = (\n                [\n                    k\n                    for k in (\"SC\", \"VSC\", \"RED\")\n                    if _overlaps(lap, [w for w in windows if w[2] == k])\n                ]\n                if lap\n                else None\n            )\n            rows.append(\n                {\n                    \"driver\": acronyms.get(p.driver_number, p.driver_number),\n                    \"lap\": p.lap_number,\n                    \"pit_lane_s\": p.lane_duration,\n                    \"stationary_s\": p.stop_duration,\n                    \"neutralised\": status,\n                }\n            )\n        return _json(\n            {\n                \"source\": OPENF1,\n                \"race\": session.label,\n                \"notes\": \"pit_lane_s over ~60 s is usually a red-flag or garage stop, not a \"\n                \"racing stop; neutralised null = lap times missing\",\n                \"stops\": rows,\n            }\n        )\n\n    def _crossings(self, session: Session) -> dict[int, dict[int, datetime]]:\n        \"\"\"driver -> {lap: time they crossed the line to complete it}.\"\"\"\n        out: dict[int, dict[int, datetime]] = {}\n        for lap in self._laps(session):\n            if lap.date_start and lap.lap_duration:\n                start = datetime.fromisoformat(lap.date_start)\n                out.setdefault(lap.driver_number, {})[lap.lap_number] = start + _seconds(\n                    lap.lap_duration\n                )\n        return out\n\n    def positions_by_lap(\n        self,\n        year: int,\n        race: str,\n        lap_start: int,\n        lap_end: int,\n        drivers: list[str] | None = None,\n    ) -> str:\n        \"\"\"Running order at the end of each lap (from timing: the order cars crossed the line\n        on that lap; lapped cars count behind), for all drivers or a list.\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        wanted = None\n        if drivers:\n            wanted = set()\n            for name in drivers:\n                d = self._driver(session, name)\n                if isinstance(d, str):\n                    return d\n                wanted.add(d.driver_number)\n        acronyms = {d.driver_number: d.name_acronym for d in self._drivers(session)}\n        crossings = self._crossings(session)\n        rows = {}\n        for n in range(lap_start, lap_end + 1):\n            done = sorted(\n                ((t[n], car) for car, t in crossings.items() if n in t), key=lambda x: x[0]\n            )\n            order = [car for _, car in done]\n            # Cars that never completed lap n are behind everyone who did, in the order they\n            # completed their last lap (latest last lap first).\n            behind = sorted(\n                (car for car, t in crossings.items() if n not in t and t),\n                key=lambda car: -max(t for t in crossings[car]),\n            )\n            order += behind\n            rows[n] = {\n                acronyms.get(car, car): pos\n                for pos, car in enumerate(order, 1)\n                if wanted is None or car in wanted\n            }\n        if sum(len(r) for r in rows.values()) > MAX_ROWS:\n            return _error(f\"more than {MAX_ROWS} entries; narrow the lap range or drivers\")\n        return _json({\"source\": OPENF1, \"race\": session.label, \"positions\": rows})\n\n    def gap_between(\n        self, year: int, race: str, driver: str, other: str, lap_start: int, lap_end: int\n    ) -> str:\n        \"\"\"Time gap between two drivers at the end of each lap (seconds; positive = `driver`\n        behind `other`), from when each crossed the line on the same lap.\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        a, b = self._driver(session, driver), self._driver(session, other)\n        for d in (a, b):\n            if isinstance(d, str):\n                return d\n        crossings = self._crossings(session)\n        ta, tb = crossings.get(a.driver_number, {}), crossings.get(b.driver_number, {})\n        gaps = {\n            n: (round((ta[n] - tb[n]).total_seconds(), 3) if n in ta and n in tb else None)\n            for n in range(lap_start, lap_end + 1)\n        }\n        if len(gaps) > MAX_ROWS:\n            return _error(f\"more than {MAX_ROWS} laps; narrow the range\")\n        return _json(\n            {\n                \"source\": OPENF1,\n                \"race\": session.label,\n                \"driver\": a.name_acronym,\n                \"other\": b.name_acronym,\n                \"notes\": \"null = one of them has no timed lap there (pit, retirement, missing data)\",\n                \"gap_s\": gaps,\n            }\n        )\n\n    def race_control(\n        self,\n        year: int,\n        race: str,\n        lap_start: int | None = None,\n        lap_end: int | None = None,\n        category: str | None = None,\n    ) -> str:\n        \"\"\"Race control messages: flags, safety car, VSC, red flags, investigations, penalties.\n        Optional lap range and category (\"Flag\", \"SafetyCar\", \"Other\").\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        out = self._tool(session, \"get_race_control\").invoke(\n            {\"lap_start\": lap_start, \"lap_end\": lap_end, \"category\": category}\n        )\n        return _json({\"source\": OPENF1, \"race\": session.label, \"messages\": json.loads(out)})\n\n    def race_incidents(self, year: int, race: str) -> str:\n        \"\"\"Stewarding record of a race: per-driver track-limits deletions (lap, turn),\n        black-and-white flags, and every incident noted / investigated / penalised.\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        return _json(\n            {\n                \"source\": OPENF1,\n                \"race\": session.label,\n                \"notes\": \"the track-limits threshold for a penalty is set in the Race \"\n                \"Director's Event Notes, which this server doesn't have\",\n                \"incidents\": json.loads(race_incidents(self.client, session.session_key)),\n            }\n        )\n\n    def weather(self, year: int, race: str) -> str:\n        \"\"\"Weather during the race: air and track temperature range, humidity, wind, and when\n        rain was reported (with the leader's lap at the time).\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        rows = self.client._fetch(\"weather\", {\"session_key\": session.session_key})\n        if not rows:\n            return _error(f\"no weather data published for {session.label}\")\n        rows.sort(key=lambda r: r[\"date\"])\n        start = datetime.fromisoformat(session.date_start)\n        end = datetime.fromisoformat(session.date_end) if session.date_end else None\n        rows = [\n            r\n            for r in rows\n            if datetime.fromisoformat(r[\"date\"]) >= start\n            and (end is None or datetime.fromisoformat(r[\"date\"]) \u003c= end)\n        ] or rows\n\n        def span(key: str) -> list[float] | None:\n            # 0.0 is a sensor dropout in the temperature feeds, not a reading.\n            values = [r[key] for r in rows if r.get(key) is not None]\n            if key.endswith(\"temperature\"):\n                values = [v for v in values if v != 0]\n            return [min(values), max(values)] if values else None\n\n        leader_laps = sorted(\n            (datetime.fromisoformat(lap.date_start), lap.lap_number)\n            for lap in self._laps(session)\n            if lap.date_start\n        )\n\n        def lap_at(stamp: str) -> int | None:\n            t = datetime.fromisoformat(stamp)\n            before = [n for s, n in leader_laps if s \u003c= t]\n            return max(before) if before else None\n\n        rain = [r for r in rows if r.get(\"rainfall\")]\n        return _json(\n            {\n                \"source\": OPENF1,\n                \"race\": session.label,\n                \"air_temp_c\": span(\"air_temperature\"),\n                \"track_temp_c\": span(\"track_temperature\"),\n                \"humidity_pct\": span(\"humidity\"),\n                \"wind_speed_ms\": span(\"wind_speed\"),\n                \"notes\": \"rain lap null with rain reported = before the first lap started\",\n                \"rain_reported\": bool(rain),\n                \"rain_from_lap\": lap_at(rain[0][\"date\"]) if rain else None,\n                \"rain_until_lap\": lap_at(rain[-1][\"date\"]) if rain else None,\n            }\n        )\n\n    def search_regulations(\n        self, query: str, year: int | None = None, race: str | None = None\n    ) -> str:\n        \"\"\"Search the FIA Sporting Regulations (issue in force at the race, or the season's\n        latest issue). Returns article ids and text to quote.\"\"\"\n        from src.rag.sources import source_for_race\n\n        year = year or self._now().year\n        if year not in self.seasons():\n            return _error(out_of_scope_message(year, self._now().date()))\n        ref = date(year, 12, 31) if year != self._now().year else self._now().date()\n        if race:\n            session = self._race(year, race)\n            if isinstance(session, str):\n                return session\n            ref = date.fromisoformat(session.date_start[:10])\n        try:\n            source = source_for_race(year, ref)\n        except ValueError as e:\n            return _error(str(e))\n        if self._regulations is None:\n            if self._make_regulations is None:\n                return _error(\"regulation search isn't configured on this server\")\n            self._regulations = self._make_regulations()\n        hits = self._regulations.search(query, source.season, source.issue, k=6)\n        return _json(\n            {\n                \"source\": f\"FIA {source.season} Sporting Regulations, issue {source.issue}\",\n                \"clauses\": [\n                    {\n                        \"article\": h.chunk.article,\n                        \"citation\": h.chunk.citation,\n                        \"title\": h.chunk.article_title,\n                        \"text\": h.chunk.text,\n                    }\n                    for h in hits\n                ],\n            }\n        )\n\n    def stewards_decisions(self, query: str, year: int | None = None) -> str:\n        \"\"\"Search the FIA stewards' decisions (penalties, investigations, rulings) for the\n        supported seasons, or one season.\"\"\"\n        seasons = [year] if year else self.seasons()\n        if year and year not in self.seasons():\n            return _error(out_of_scope_message(year, self._now().date()))\n        if self._decisions is None:\n            if self._make_decisions is None:\n                return _error(\"stewards' decisions aren't configured on this server\")\n            self._decisions = self._make_decisions()\n        found = self._decisions.search(query, seasons, k=5)\n        return _json(\n            {\n                \"source\": \"FIA stewards' decisions (fia.com)\",\n                \"decisions\": [_decision(d) for d in found],\n            }\n        )\n\n    # --- models -----------------------------------------------------------------------------\n\n    def review_pit_stop(\n        self, year: int, race: str, driver: str, lap: int | None = None, compound: str | None = None\n    ) -> str:\n        \"\"\"Simulate a pit decision with traffic, from the tyre wear and pit loss measured in\n        that race (rivals stop when they really did). On a lap the driver pitted: was it right,\n        vs staying out 1-5 laps / no more stops. On any other lap: what if they had pitted\n        there (e.g. under a SC/VSC), with a time ledger. Without a lap: their stops and their\n        laps under SC/VSC/red flag. Takes 20-60 s.\"\"\"\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        d = self._driver(session, driver)\n        if isinstance(d, str):\n            return d\n        args: dict[str, Any] = {\"driver\": str(d.driver_number)}\n        if lap is not None:\n            args[\"lap\"] = lap\n        if compound:\n            args[\"compound\"] = compound\n        out = self._tool(session, \"review_pit_stop\").invoke(args)\n        if out.startswith(\"ERROR\"):\n            return out\n        return _json({\"source\": f\"Pit Wall simulator on the {ARCHIVE}\"} | json.loads(out))\n\n    def who_wins_from_here(self, year: int, race: str, lap: int) -> str:\n        \"\"\"Win / podium chances and expected positions for every car from the race state at\n        the end of a lap (the leader's), simulated forward with each car's pace, tyres and\n        stops still to make. Safety cars to come are left out (luck).\"\"\"\n        from src.livetiming.monitor import RaceMonitor, _circuit_for\n        from src.livetiming.sources import race_messages\n        from src.models.tyre_curves import season_curves\n        from src.sim.inrace import NotEnoughData, race_state, simulate_from\n\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        try:\n            race_data = race_messages(\n                year, session.location, session.date_start[:10], client=self.client, session=session\n            )\n        except (LookupError, httpx.HTTPError) as e:\n            return _error(f\"no timing for {session.label}: {e}\")\n        messages = race_data.messages\n        circuit = _circuit_for(messages)\n        loss = (\n            (circuit.pit_loss.green, circuit.pit_loss.safety_car)\n            if circuit and circuit.pit_loss\n            else (22.0, 13.5)\n        )\n        monitor = RaceMonitor(pit_loss=circuit.pit_loss if circuit else None)\n        reached = False\n        for m in messages:\n            if m.topic == \"LapCount\" and int(m.data.get(\"CurrentLap\") or 0) > lap:\n                reached = True\n                break\n            monitor.feed(m)\n        if not reached:\n            return _error(f\"{session.label} has no lap {lap + 1}: pick a lap before the last\")\n        try:\n            state = race_state(\n                monitor, monitor.snapshot(), pit_loss=loss, curves=season_curves(year)\n            )\n            out = simulate_from(state, sims=3000, seed=7)\n        except NotEnoughData as e:\n            return _error(str(e))\n        return _json(\n            {\n                \"source\": f\"Pit Wall in-race simulator ({race_data.source})\",\n                \"race\": session.label,\n                \"after_lap\": out[\"lap\"],\n                \"laps_remaining\": out[\"laps_remaining\"],\n                \"track_status\": out[\"status\"],\n                \"pit_loss_s\": {\"green\": loss[0], \"safety_car\": loss[1]},\n                \"table\": out[\"table\"],\n                \"notes\": out[\"notes\"]\n                + [\"no future safety cars or retirements (luck); calibrated on 2026 races\"],\n            }\n        )\n\n    def predict_race(self, year: int, race: str, laps: int | None = None) -> str:\n        \"\"\"Pre-race prediction from the weekend's qualifying and recent race pace: expected\n        position and win / podium / points chances per driver (calibrated; no safety-car or\n        retirement luck). Needs qualifying to be in the warehouse; `laps` = race distance when\n        the race hasn't run.\"\"\"\n        from src.sim.calibrate import DEFAULT_CALIBRATION, apply\n        from src.sim.inputs import build_inputs\n        from src.sim.race import simulate\n        from src.warehouse.queries import connect\n\n        session = self._race(year, race, allow_future=True)\n        if isinstance(session, str):\n            return session\n        sims = 4000\n        try:\n            con = connect()\n            try:\n                inputs = build_inputs(con, year, session.location, laps=laps)\n            finally:\n                con.close()\n            table = apply(simulate(inputs, sims=sims).table(), DEFAULT_CALIBRATION, sims)\n        except Exception as e:  # noqa: BLE001 - the reason goes back to the model\n            return _error(\n                f\"no prediction for {session.label}: {type(e).__name__}: {e}. The predictor \"\n                \"needs the weekend's qualifying in the warehouse (and `laps` before race day).\"\n            )\n        grid = {d.tla: d.grid for d in inputs.drivers}\n        return _json(\n            {\n                \"source\": f\"Pit Wall pre-race simulator ({WAREHOUSE})\",\n                \"race\": session.label,\n                \"table\": [row | {\"grid\": grid.get(row[\"tla\"])} for row in table],\n                \"notes\": list(inputs.notes)\n                + [\"every car finishes, no SC/VSC luck; probabilities calibrated on 2026\"],\n            }\n        )\n\n    def luck_adjusted_result(self, year: int, race: str) -> str:\n        \"\"\"The finishing order with safety car / VSC / red flag luck removed, and each\n        driver's seconds gained (+) or lost (-) to neutralisations.\"\"\"\n        from src.sim.inputs import weekend_sessions\n        from src.sim.luck import neutralisation_luck\n        from src.warehouse.queries import connect\n\n        session = self._race(year, race)\n        if isinstance(session, str):\n            return session\n        pit_loss_green = 22.0  # the scorecard's assumption; the order is insensitive to it\n        try:\n            con = connect()\n            try:\n                _, sessions = weekend_sessions(con, year, session.location)\n                report = neutralisation_luck(con, sessions[\"Race\"], pit_loss_green)\n            finally:\n                con.close()\n        except (LookupError, KeyError) as e:\n            return _error(f\"{session.label} isn't in the warehouse yet ({e})\")\n        tla = {d.driver_number: d.name_acronym for d in self._drivers(session)}\n        actual = [\n            r.driver_number for r in self.client.get_results(session.session_key) if r.position\n        ]\n        return _json(\n            {\n                \"source\": WAREHOUSE,\n                \"race\": session.label,\n                \"neutralisations\": report.windows,\n                \"actual_order\": [tla.get(n, n) for n in actual],\n                \"luck_adjusted_order\": [tla.get(n, n) for n in report.adjusted_order],\n                \"luck_s\": {tla.get(n, n): round(s, 1) for n, s in report.luck_s.items()},\n                \"notes\": [f\"green-flag pit loss assumed {pit_loss_green:.0f} s\"],\n            }\n        )\n\n    def tyre_life(self, year: int) -> str:\n        \"\"\"Season tyre curves by Pirelli compound (C1-C6): seconds lost vs a fresh set by tyre\n        age, and the proven life (how far it ran in races without dropping off).\"\"\"\n        from src.models.tyre_curves import late_slope, season_curves\n\n        if year not in self.seasons():\n            return _error(out_of_scope_message(year, self._now().date()))\n        curves = season_curves(year)\n        if not curves:\n            return _error(f\"no tyre curves for {year}: the warehouse isn't available\")\n        return _json(\n            {\n                \"source\": WAREHOUSE,\n                \"season\": year,\n                \"compounds\": {\n                    c: {\n                        \"life_laps\": curve.life_laps,\n                        \"drop_off_seen_at\": curve.drop_off_age,\n                        \"late_wear_s_per_lap\": (\n                            round(s, 3) if (s := late_slope(curve)) is not None else None\n                        ),\n                        \"loss_vs_fresh_s_by_age_band\": [\n                            [a, round(v, 2)] for a, v, _ in curve.bands\n                        ],\n                    }\n                    for c, curve in sorted(curves.items())\n                },\n                \"notes\": \"map a race's SOFT/MEDIUM/HARD to C-numbers with the event's nomination\",\n            }\n        )\n\n\ndef _seconds(value: float) -> timedelta:\n    return timedelta(seconds=value)\n\n\ndef _decision(d: Any) -> dict:\n    \"\"\"A stewards' decision, cited as \"Doc \u003cnumber>, \u003ccompetition>\".\"\"\"\n    return {\n        \"cite_as\": f\"Doc {d.number}, {d.competition}\",\n        \"title\": d.title,\n        \"driver\": d.driver,\n        \"session\": d.session,\n        \"fact\": re.sub(r\"\\s+\", \" \", d.fact)[:600],\n        \"infringement\": re.sub(r\"\\s+\", \" \", d.infringement)[:400],\n        \"decision\": d.decision,\n        \"reason\": re.sub(r\"\\s+\", \" \", d.reason)[:800],\n        \"url\": d.url,\n    }\n\n\nTOOLS = (\n    \"list_races\",\n    \"find_driver\",\n    \"race_results\",\n    \"race_summary\",\n    \"lap_times\",\n    \"pace_summary\",\n    \"tyre_stints\",\n    \"pit_stops\",\n    \"positions_by_lap\",\n    \"gap_between\",\n    \"race_control\",\n    \"race_incidents\",\n    \"weather\",\n    \"search_regulations\",\n    \"stewards_decisions\",\n    \"review_pit_stop\",\n    \"who_wins_from_here\",\n    \"predict_race\",\n    \"luck_adjusted_result\",\n    \"tyre_life\",\n)\n\n\ndef build_server(tools: PitwallTools):\n    from mcp.server.mcpserver import MCPServer\n\n    server = MCPServer(\"pitwall\", instructions=INSTRUCTI
