ONS)\n    for name in TOOLS:\n        # Results are JSON text already; a structured copy would double what the client reads.\n        server.add_tool(getattr(tools, name), name=name, structured_output=False)\n\n    @server.prompt(name=\"pitwall_rules\", description=\"How to answer with Pit Wall's tools\")\n    def pitwall_rules() -> str:\n        return INSTRUCTIONS\n\n    return server\n\n\ndef http_app(server):\n    \"\"\"The streamable-HTTP app (stateless, JSON responses: any replica can answer any call).\n    Public hostnames go in PITWALL_MCP_HOSTS (comma-separated); without it only localhost is\n    accepted, which guards a local server against DNS rebinding.\"\"\"\n    import os\n\n    from mcp.server.transport_security import TransportSecuritySettings\n\n    hosts = [h.strip() for h in os.getenv(\"PITWALL_MCP_HOSTS\", \"\").split(\",\") if h.strip()]\n    security = None\n    if hosts:\n        local = [\"127.0.0.1:*\", \"localhost:*\", \"[::1]:*\"]\n        security = TransportSecuritySettings(\n            allowed_hosts=[*hosts, *local],\n            allowed_origins=[f\"https://{h}\" for h in hosts] + [f\"http://{h}\" for h in local],\n        )\n    return server.streamable_http_app(\n        streamable_http_path=\"/mcp\",\n        stateless_http=True,\n        json_response=True,\n        transport_security=security,\n    )\n\n\ndef default_tools(regulations: Callable[[], Any] | None = None) -> PitwallTools:\n    from src.rag.decisions import DecisionIndex\n    from src.rag.index import RegulationIndex\n\n    return PitwallTools(\n        HttpOpenF1Client(), regulations=regulations or RegulationIndex, decisions=DecisionIndex\n    )\n\n\ndef main() -> None:\n    import logging\n\n    logging.getLogger(\"httpx\").setLevel(logging.WARNING)\n    build_server(default_tools()).run(\"stdio\")\n\n\nif __name__ == \"__main__\":\n    main()\n", "src/api.py": "\"\"\"HTTP API for the chat UI (pitwall-ui). Streams graph progress as Server-Sent Events.\n\nUsage: uvicorn src.api:app --reload --port 8000\n\nPOST /api/chat {\"thread_id\": str | null, \"message\": str} -> text/event-stream:\n  event: thread  {\"thread_id\"}                      first; send it back for follow-ups\n  event: step    {\"node\", \"detail\"}                 one per graph node as it completes\n  event: answer  {\"answer\", \"mode\", \"race\", \"regs\", \"citations\", \"tool_calls\", \"steps\"}\n  event: error   {\"message\"}\n\"\"\"\n\nimport asyncio\nimport json\nimport logging\nimport os\nimport time\nimport uuid\nfrom collections.abc import AsyncIterator, Callable, Iterator\nfrom contextlib import asynccontextmanager\nfrom typing import Any\n\nfrom fastapi import FastAPI, HTTPException, Query, Request\nfrom fastapi.middleware.cors import CORSMiddleware\nfrom fastapi.responses import StreamingResponse\nfrom langchain_core.messages import HumanMessage, ToolMessage\nfrom pydantic import BaseModel, Field\n\nfrom src.agents.graph import build_graph, memory_checkpointer\nfrom src.agents.live_chat import answer, prediction_event\nfrom src.livetiming.archive import ArchiveSession, list_sessions\nfrom src.livetiming.monitor import replay\nfrom src.livetiming.session import SessionRegistry\nfrom src.llm.transcribe import RadioTranscriber\nfrom src.mcp_server import PitwallTools, default_tools\nfrom src.mcp_server import build_server as build_mcp_server\nfrom src.mcp_server import http_app as mcp_http_app\nfrom src.rag.decisions import DecisionIndex\nfrom src.rag.index import RegulationIndex\nfrom src.seasons import out_of_scope_message, supported_seasons\nfrom src.sim.inrace import NotEnoughData\nfrom src.sim.prerace import grid_prediction_event, pre_q3_prediction_event\nfrom src.tools.openf1 import HttpOpenF1Client\n\nlog = logging.getLogger(__name__)\nUI_ORIGINS = os.getenv(\"PITWALL_UI_ORIGINS\", \"http://localhost:5173,http://127.0.0.1:5173\").split(\n    \",\"\n)\n\n\nclass ChatRequest(BaseModel):\n    thread_id: str | None = None\n    message: str = Field(min_length=1, max_length=2000)\n\n\ndef _sse(event: str, data: dict[str, Any]) -> str:\n    return f\"event: {event}\\ndata: {json.dumps(data)}\\n\\n\"\n\n\ndef _step_detail(node: str, update: dict[str, Any], seen_steps: int) -> str:\n    steps = update.get(\"evaluation_steps\") or []\n    if len(steps) > seen_steps:\n        return steps[-1]\n    if node == \"tools\":\n        # The tools node appends ToolMessages to the fetch transcript; count this batch.\n        batch = 0\n        for message in reversed(update.get(\"fetch_messages\", [])):\n            if not isinstance(message, ToolMessage):\n                break\n            batch += 1\n        return f\"ran {batch} tool call{'s' if batch != 1 else ''}\"\n    return node\n\n\ndef _answer(values: dict[str, Any]) -> dict[str, Any]:\n    route = values.get(\"route\")\n    mode = route.mode if route else None\n    return {\n        \"answer\": values[\"messages\"][-1].content,\n        \"mode\": mode,\n        \"race\": values.get(\"race_context\") if mode == \"race\" and not values.get(\"error\") else None,\n        \"regs\": values.get(\"reg_context\"),\n        \"citations\": values.get(\"retrieved_rules_text\") or [],\n        \"tool_calls\": [\n            {\"tool\": r[\"tool\"], \"args\": r[\"args\"]}\n            for r in values.get(\"fetched_telemetry_json\") or []\n        ],\n        \"steps\": values.get(\"evaluation_steps\") or [],\n    }\n\n\n_INDEX: list[RegulationIndex] = []\n\n\ndef _regulation_index() -> RegulationIndex:\n    \"\"\"Embedded Qdrant allows one client per storage folder: the chat graph and the MCP\n    server share one index, opened on first use.\"\"\"\n    if not _INDEX:\n        _INDEX.append(RegulationIndex())\n    return _INDEX[0]\n\n\ndef _default_graph():\n    index = _regulation_index()\n    graph = build_graph(\n        HttpOpenF1Client(),\n        index,\n        checkpointer=memory_checkpointer(),\n        seasons=supported_seasons(),\n        decisions=DecisionIndex(),\n    )\n    return graph, index.close\n\n\ndef _default_transcriber() -> RadioTranscriber | None:\n    return RadioTranscriber() if RadioTranscriber.available() else None\n\n\nWAREHOUSE_REFRESH_S = 15 * 60  # race weekends (live mode): sessions land before the next one\n\n\ndef _refresh_interval_s() -> int | None:\n    \"\"\"PITWALL_REFRESH_MINUTES (opt-in) keeps the data store current; live mode implies 15.\"\"\"\n    minutes = os.getenv(\"PITWALL_REFRESH_MINUTES\", \"\").strip()\n    if minutes:\n        return max(int(float(minutes) * 60), 60)\n    if os.getenv(\"PITWALL_LIVE_AUTOSTART\", \"\").strip() in (\"1\", \"true\", \"yes\"):\n        return WAREHOUSE_REFRESH_S\n    return None\n\n\nasync def _refresh_warehouse_forever(interval_s: int) -> None:\n    \"\"\"Pull each finished session into the warehouse soon after OpenF1 frees it, plus new\n    stewards' decisions (src/warehouse/refresh.py). On race weekends that also keeps the pre-Q3\n    / grid predictions off OpenF1 while a session is live (it's closed then).\"\"\"\n    from src.warehouse.refresh import refresh\n\n    while True:\n        try:\n            report = await asyncio.to_thread(refresh)\n            if report.sessions or report.errors:\n                log.info(\"refresh: %s\", report)\n        except Exception:\n            log.exception(\"warehouse refresh failed\")\n        await asyncio.sleep(interval_s)\n\n\ndef _default_mcp_tools() -> PitwallTools:\n    return default_tools(regulations=_regulation_index)\n\n\ndef create_app(\n    make_graph: Callable[[], tuple[Any, Callable[[], None]]] = _default_graph,\n    make_transcriber: Callable[[], Any] = _default_transcriber,\n    chat_model: Any = None,\n    make_mcp_tools: Callable[[], PitwallTools] = _default_mcp_tools,\n) -> FastAPI:\n    \"\"\"make_graph returns (compiled graph, cleanup). Tests inject a graph with fake models and\n    no transcriber. The MCP server (src/mcp_server.py) is served at /mcp.\"\"\"\n    mcp_server = build_mcp_server(make_mcp_tools())\n    mcp_app = mcp_http_app(mcp_server)\n\n    @asynccontextmanager\n    async def lifespan(app: FastAPI):\n        async with mcp_server.session_manager.run(), _app_lifespan(app):\n            yield\n\n    @asynccontextmanager\n    async def _app_lifespan(app: FastAPI):\n        app.state.graph, cleanup = make_graph()\n        app.state.transcriber = make_transcriber()\n        app.state.sessions = SessionRegistry()\n        app.state.chat_model = chat_model  # None -> the analyst model from the factory\n        refresher = None\n        if os.getenv(\"PITWALL_LIVE_AUTOSTART\", \"\").strip() in (\"1\", \"true\", \"yes\"):\n            _start_live(app)  # race weekends: follow the live feed from server start\n        if interval := _refresh_interval_s():\n            refresher = asyncio.create_task(_refresh_warehouse_forever(interval))\n        yield\n        if refresher:\n            refresher.cancel()\n        await app.state.sessions.stop_live()\n        cleanup()\n        if app.state.transcriber:\n            await app.state.transcriber.aclose()\n\n    app = FastAPI(title=\"Pit Wall AI\", lifespan=lifespan)\n    app.add_middleware(\n        CORSMiddleware, allow_origins=UI_ORIGINS, allow_methods=[\"GET\", \"POST\"], allow_headers=[\"*\"]\n    )\n    app.get(\"/api/health\")(health)\n    app.post(\"/api/chat\")(chat)\n    app.get(\"/api/seasons\")(seasons)\n    app.get(\"/api/live/sessions\")(live_sessions)\n    app.get(\"/api/live/replay\")(live_replay)\n    app.post(\"/api/live/ask\")(live_ask)\n    app.post(\"/api/live/start\")(live_start)\n    app.post(\"/api/live/stop\")(live_stop)\n    app.get(\"/api/live/current\")(live_current)\n    app.get(\"/api/live/stream\")(live_stream)\n    app.get(\"/api/race/verdicts\")(race_verdicts)\n    app.get(\"/api/race/list\")(race_list)\n    app.mount(\"/\", mcp_app)  # after the API routes: it only answers /mcp\n    return app\n\n\ndef health() -> dict[str, str]:\n    return {\"status\": \"ok\"}\n\n\ndef chat(req: ChatRequest, request: Request) -> StreamingResponse:\n    graph = request.app.state.graph\n    thread_id = req.thread_id or str(uuid.uuid4())\n    config = {\"configurable\": {\"thread_id\": thread_id}}\n\n    def events() -> Iterator[str]:\n        yield _sse(\"thread\", {\"thread_id\": thread_id})\n        seen_steps = 0\n        try:\n            for chunk in graph.stream(\n                {\"messages\": [HumanMessage(req.message)]}, config, stream_mode=\"updates\"\n            ):\n                for node, update in chunk.items():\n                    update = update or {}\n                    detail = _step_detail(node, update, seen_steps)\n                    if \"evaluation_steps\" in update:\n                        seen_steps = len(update[\"evaluation_steps\"])\n                    yield _sse(\"step\", {\"node\": node, \"detail\": detail})\n            yield _sse(\"answer\", _answer(graph.get_state(config).values))\n        except Exception as e:\n            log.exception(\"chat failed\")\n            yield _sse(\"error\", {\"message\": f\"{type(e).__name__}: {e}\"})\n\n    # Sync generator: Starlette runs it in a threadpool, so graph.stream doesn't block the loop.\n    return StreamingResponse(\n        events(), media_type=\"text/event-stream\", headers={\"Cache-Control\": \"no-cache\"}\n    )\n\n\ndef seasons() -> list[int]:\n    \"\"\"Seasons available to users (current and previous), newest first.\"\"\"\n    return supported_seasons()\n\n\ndef live_sessions(year: int) -> list[dict[str, str]]:\n    \"\"\"Races in F1's live-timing archive for `year` (for the replay picker).\"\"\"\n    if year not in supported_seasons():\n        raise HTTPException(404, out_of_scope_message(year))\n    return list_sessions(year)\n\n\ndef live_replay(\n    request: Request,\n    path: str,\n    speed: float = Query(20.0, gt=0, le=1000),\n    from_lap: int | None = Query(None, ge=1),\n    transcribe: bool = True,\n) -> StreamingResponse:\n    \"\"\"Replay an archived race as if live (SSE, GET so EventSource works). Event names are the\n    monitor's event types: session, snapshot, track_status, race_control, radio,\n    radio_transcript, pit_calls, end.\"\"\"\n    transcriber = request.app.state.transcriber if transcribe else None\n    session = request.app.state.sessions.create(\"replay\", path)\n\n    async def events() -> AsyncIterator[str]:\n        yield _sse(\"live\", {\"type\": \"live\", \"live_id\": session.live_id, \"source\": \"replay\"})\n        try:\n            async for event in replay(\n                ArchiveSession(path),\n                speed=speed,\n                from_lap=from_lap,\n                transcriber=transcriber,\n                monitor=session.monitor,\n                on_neutralisation=prediction_event,\n                on_grid=grid_prediction_event,\n                alerts=True,\n            ):\n                yield _sse(event[\"type\"], event)\n        except Exception as e:\n            log.exception(\"replay failed\")\n            yield _sse(\"error\", {\"message\": f\"{type(e).__name__}: {e}\"})\n        finally:\n            # Replays feed the session only while their stream is open (they're a test source);\n            # the race state stays queryable afterwards. The live feed will run as a server task.\n            session.finished = time.time()\n\n    return StreamingResponse(\n        events(), media_type=\"text/event-stream\", headers={\"Cache-Control\": \"no-cache\"}\n    )\n\n\ndef race_list(year: int) -> dict[str, Any]:\n    \"\"\"Finished races in the warehouse for a season (for the review tab).\"\"\"\n    from src.warehouse.queries import connect\n\n    con = connect()\n    try:\n        rows = con.execute(\n            \"\"\"SELECT location, strftime(date_start, '%Y-%m-%d') FROM races\n               WHERE year = ? AND session_name = 'Race' ORDER BY date_start\"\"\",\n            [year],\n        ).fetchall()\n    finally:\n        con.close()\n    return {\"year\": year, \"races\": [{\"place\": loc, \"date\": d} for loc, d in rows]}\n\n\nasync def race_verdicts(year: int, place: str) -> dict[str, Any]:\n    \"\"\"Post-race strategy verdicts for the top finishers' stops (src/sim/verdicts.py; cached,\n    the first call for a race replays it and can take a few minutes).\"\"\"\n    from src.sim.verdicts import verdicts\n\n    try:\n        found = await asyncio.to_thread(verdicts, year, place)\n    except LookupError as e:\n        raise HTTPException(status_code=404, detail=str(e)) from e\n    return {\"year\": year, \"place\": place, \"verdicts\": found}\n\n\ndef _start_live(app: FastAPI):\n    return app.state.sessions.start_live(\n        transcriber=app.state.transcriber,\n        on_neutralisation=prediction_event,\n        on_grid=grid_prediction_event,\n        alerts=True,\n        on_q3=pre_q3_prediction_event,\n    )\n\n\ndef _describe(session) -> dict[str, Any]:\n    snap = session.monitor.snapshot()\n    return {\n        \"live_id\": session.live_id,\n        \"source\": session.source,\n        \"connected\": session.connected,\n        \"recording\": session.recording,\n        \"meeting\": snap.meeting,\n        \"session\": snap.session,\n        \"lap\": snap.current_lap,\n        \"total_laps\": snap.total_laps,\n        \"status\": snap.track_status,\n    }\n\n\nasync def live_start(request: Request) -> dict[str, Any]:\n    \"\"\"Follow the live F1 timing feed (a server task; idempotent). Local tool: no auth.\"\"\"\n    return _describe(_start_live(request.app))\n\n\nasync def live_stop(request: Request) -> dict[str, str]:\n    await request.app.state.sessions.stop_live()\n    return {\"status\": \"stopped\"}\n\n\ndef live_current(request: Request) -> dict[str, Any]:\n    \"\"\"The live-feed session, if one is running (or finished recently).\"\"\"\n    session = request.app.state.sessions.current_live\n    if session is None:\n        raise HTTPException(404, \"No live session. POST /api/live/start to follow the live feed.\")\n    return _describe(session)\n\n\ndef live_stream(request: Request, live_id: str) -> StreamingResponse:\n    \"\"\"Subscribe to a live session (SSE): `live`, a catch-up of the current state, then events.\"\"\"\n    session = request.app.state.sessions.get(live_id)\n    if session is None:\n        raise HTTPException(404, \"That live session isn't running any more.\")\n\n    async def events() -> AsyncIterator[str]:\n        async for event in session.subscribe():\n            yield _sse(event[\"type\"], event)\n\n    return StreamingResponse(\n        events(), media_type=\"text/event-stream\", headers={\"Cache-Control\": \"no-cache\"}\n    )\n\n\nclass AskRequest(BaseModel):\n    live_id: str\n    message: str = Field(min_length=1, max_length=1000)\n\n\ndef live_ask(req: AskRequest, request: Request) -> dict[str, Any]:\n    \"\"\"Answer a question about a live session's race as it stands right now.\"\"\"\n    session = request.app.state.sessions.get(req.live_id)\n    if session is None:\n        raise HTTPException(404, \"That live session isn't running any more.\")\n    try:\n        return answer(session.monitor, req.message, model=request.app.state.chat_model)\n    except NotEnoughData as e:\n        raise HTTPException(409, f\"Not enough race data yet: {e}\") from e\n\n\napp = create_app()\n", "src/sim/luck.py": "\"\"\"Safety car / VSC / red flag luck, measured from timing data — and results with it removed.\n\nNeutralisation timing isn't predictable, so predictions ignore it and are scored against the\nrace with its effects taken out (\"Norris would have won Madrid 2026\").\n\nFor each neutralisation window and each driver, from the lap before it starts to the lap after\nthe restart:\n    expected elapsed = laps × their clean green-flag pace (+ green pit loss if they pitted)\n    luck             = expected − actual, relative to the field median (positive = gained)\nPitting under a VSC/SC shows up as losing less than a green stop; bunching up behind an SC shows\nup as the leader losing time relative to the cars behind. Adjusted finish = actual + luck.\n\"\"\"\n\nimport statistics\nfrom collections import defaultdict\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass LuckReport:\n    luck_s: dict[int, float]  # driver -> seconds gained from neutralisations (+ = helped)\n    adjusted_order: list[int]  # classified drivers in luck-adjusted finishing order\n    windows: int\n\n\ndef neutralisation_luck(\n    con, race_sk: int, pit_loss_green: float, after_lap: int | None = None\n) -> LuckReport:\n    \"\"\"`after_lap`: only count neutralisations that start after the leader began lap\n    `after_lap + 1` — for scoring an in-race prediction made on lap `after_lap`, where the\n    neutralisation already underway is part of the situation, not luck to be removed.\"\"\"\n    laps = con.execute(\n        \"\"\"SELECT driver_number, lap_number, lap_end, lap_time FROM laps\n           WHERE session_key = ? AND lap_end IS NOT NULL ORDER BY 1, 2\"\"\",\n        [race_sk],\n    ).fetchall()\n    crossings: dict[int, list[tuple[int, object]]] = defaultdict(list)\n    for driver, lap, end, _ in laps:\n        crossings[driver].append((lap, end))\n    pace = dict(\n        con.execute(\n            \"SELECT driver_number, median(lap_time) FROM clean_laps WHERE session_key = ? GROUP BY 1\",\n            [race_sk],\n        ).fetchall()\n    )\n    field_pace = statistics.median(pace.values()) if pace else 90.0\n    pits: dict[int, set[int]] = defaultdict(set)\n    for driver, lap in con.execute(\n        \"SELECT driver_number, lap_number FROM raw_pits WHERE session_key = ?\", [race_sk]\n    ).fetchall():\n        pits[driver].add(lap)\n    windows = con.execute(\n        \"\"\"SELECT start::TIMESTAMPTZ, least(\"end\", '2100-01-01')::TIMESTAMPTZ FROM raw_neutralised\n           WHERE session_key = ? ORDER BY 1\"\"\",\n        [race_sk],\n    ).fetchall()\n    if after_lap is not None:\n        cutoff = con.execute(\n            \"SELECT min(lap_start) FROM laps WHERE session_key = ? AND lap_number = ?\",\n            [race_sk, after_lap + 1],\n        ).fetchone()[0]\n        windows = [w for w in windows if cutoff is not None and w[0] > cutoff]\n\n    luck: dict[int, float] = defaultdict(float)\n    for start, end in windows:\n        per_driver: dict[int, float] = {}\n        for driver, laps_ in crossings.items():\n            before = [(lap, t) for lap, t in laps_ if t \u003c= start]\n            after = [(lap, t) for lap, t in laps_ if t > end]\n            if not before or len(after) \u003c 2:\n                continue\n            (lap_b, t_b), (lap_a, t_a) = before[-1], after[1]  # +1 lap: the restart lap\n            n_laps = lap_a - lap_b\n            pitted = any(lap_b \u003c lap \u003c= lap_a for lap in pits.get(driver, ()))\n            expected = n_laps * pace.get(driver, field_pace) + (pit_loss_green if pitted else 0)\n            per_driver[driver] = expected - (t_a - t_b).total_seconds()\n        if len(per_driver) \u003c 5:\n            continue\n        reference = statistics.median(per_driver.values())\n        for driver, gain in per_driver.items():\n            luck[driver] += gain - reference\n\n    results = con.execute(\n        \"\"\"SELECT r.driver_number, r.number_of_laps, max(l.lap_end)\n           FROM raw_results r JOIN laps l\n             ON l.session_key = r.session_key AND l.driver_number = r.driver_number\n           WHERE r.session_key = ? AND r.position IS NOT NULL\n             AND NOT coalesce(r.dnf, FALSE) AND NOT coalesce(r.dns, FALSE)\n             AND NOT coalesce(r.dsq, FALSE)\n           GROUP BY 1, 2\"\"\",\n        [race_sk],\n    ).fetchall()\n    finish = {\n        d: (laps_done or 0, end.timestamp() + luck.get(d, 0.0)) for d, laps_done, end in results\n    }\n    adjusted = sorted(finish, key=lambda d: (-finish[d][0], finish[d][1]))\n    return LuckReport(dict(luck), adjusted, len(windows))\n", "src/livetiming/strategy.py": "\"\"\"Safety car / VSC pit calls: who should pit and who should stay out.\n\nDeterministic on purpose: under a safety car there's about a lap to decide, so the call is\ncomputed from the snapshot in milliseconds and the LLM only explains it. Every rule of thumb is a\nnamed constant and is reported with the calls, so they can be tuned against past races.\n\"\"\"\n\nfrom dataclasses import dataclass\n\nfrom src.livetiming.circuits import PitLoss\nfrom src.livetiming.snapshot import DriverState, RaceSnapshot\n\n# Assumptions (rules of thumb, not measurements):\nPIT_LANE_BYPASS_S = 5.0  # track time the pit lane replaces; loss = lane time - this\nDEFAULT_PIT_LANE_S = 22.0  # used until the session's own pit-lane times are known\nNEUTRALISED_LOSS_FACTOR = {\"SAFETY_CAR\": 0.5, \"VSC\": 0.65}  # fallback only; see circuits.py\nFRESH_TYRE_LAPS = 5  # stopped this recently: no point stopping again\nOLD_TYRE_LAPS = 15  # old enough that fresh tyres are worth a couple of places\nMAX_PLACES_FOR_OLD_TYRES = 2\nMIN_LAPS_TO_BENEFIT = 5  # fresh tyres can't pay back a stop in fewer laps than this\n\n\n@dataclass(frozen=True)\nclass PitCall:\n    tla: str\n    position: int | None\n    call: str  # \"PIT\" | \"STAY OUT\" | \"IN PIT\" | \"RETIRED\"\n    reason: str\n    places_at_risk: int | None\n    compound: str | None\n    tyre_age_laps: int | None\n\n\n@dataclass(frozen=True)\nclass PitCallReport:\n    track_status: str\n    lap: int | None\n    laps_remaining: int | None\n    green_pit_loss_s: float\n    pit_loss_now_s: float\n    calls: tuple[PitCall, ...]\n    assumptions: tuple[str, ...]\n\n\ndef _places_at_risk(driver: DriverState, snapshot: RaceSnapshot, loss_s: float) -> int | None:\n    \"\"\"Cars behind within `loss_s` that would pass if this driver pits and they don't.\"\"\"\n    if driver.gap_to_leader_s is None:\n        return None\n    return sum(\n        1\n        for other in snapshot.drivers\n        if other is not driver\n        and not other.retired\n        and not other.in_pit\n        and other.gap_to_leader_s is not None\n        and (driver.position or 99) \u003c (other.position or 99)\n        and other.gap_to_leader_s - driver.gap_to_leader_s \u003c= loss_s\n    )\n\n\ndef _call(\n    driver: DriverState, snapshot: RaceSnapshot, loss_s: float, green_loss_s: float\n) -> PitCall:\n    def make(call: str, reason: str, at_risk: int | None = None) -> PitCall:\n        return PitCall(\n            driver.tla,\n            driver.position,\n            call,\n            reason,\n            at_risk,\n            driver.compound,\n            driver.tyre_age_laps,\n        )\n\n    if driver.retired:\n        return make(\"RETIRED\", \"Out of the race.\")\n    if driver.in_pit:\n        return make(\"IN PIT\", \"Already in the pit lane.\")\n\n    at_risk = _places_at_risk(driver, snapshot, loss_s)\n    remaining = snapshot.laps_remaining\n    age = driver.tyre_age_laps\n    risk_text = (\n        \"unknown gaps behind\"\n        if at_risk is None\n        else f\"{at_risk} car(s) within {loss_s:.1f}s behind\"\n    )\n\n    if driver.needs_second_compound and (remaining is None or remaining > 0):\n        return make(\n            \"PIT\",\n            f\"Still needs a second dry compound. A stop now costs ~{loss_s:.1f}s instead of \"\n            f\"~{green_loss_s:.1f}s under green ({risk_text}).\",\n            at_risk,\n        )\n    if remaining is not None and remaining \u003c MIN_LAPS_TO_BENEFIT:\n        return make(\n            \"STAY OUT\", f\"Only {remaining} laps left: fresh tyres can't pay back a stop.\", at_risk\n        )\n    if age is not None and age \u003c= FRESH_TYRE_LAPS:\n        return make(\"STAY OUT\", f\"Tyres only {age} laps old.\", at_risk)\n    if at_risk == 0:\n        return make(\"PIT\", f\"Free stop: no car within {loss_s:.1f}s behind.\", at_risk)\n    if (\n        age is not None\n        and age >= OLD_TYRE_LAPS\n        and at_risk is not None\n        and at_risk \u003c= MAX_PLACES_FOR_OLD_TYRES\n    ):\n        return make(\n            \"PIT\",\n            f\"{age}-lap-old tyres; fresh ones are worth the {at_risk} place(s) at risk.\",\n            at_risk,\n        )\n    return make(\"STAY OUT\", f\"Track position: pitting risks {risk_text}.\", at_risk)\n\n\ndef estimated_pit_loss(snapshot: RaceSnapshot) -> PitLoss:\n    \"\"\"Rule-of-thumb loss from this session's pit-lane times, when no measured data exists.\"\"\"\n    lane_s = snapshot.median_pit_lane_s or DEFAULT_PIT_LANE_S\n    green = lane_s - PIT_LANE_BYPASS_S\n    lane_source = (\n        f\"median of {len(snapshot.pit_lane_times_s)} pit-lane times this session\"\n        if snapshot.pit_lane_times_s\n        else \"default, no stops yet this session\"\n    )\n    return PitLoss(\n        green=green,\n        safety_car=green * NEUTRALISED_LOSS_FACTOR[\"SAFETY_CAR\"],\n        vsc=green * NEUTRALISED_LOSS_FACTOR[\"VSC\"],\n        source=(\n            f\"estimated: pit lane {lane_s:.1f}s ({lane_source}) minus {PIT_LANE_BYPASS_S}s \"\n            f\"bypass, x{NEUTRALISED_LOSS_FACTOR['SAFETY_CAR']} under SC / \"\n            f\"x{NEUTRALISED_LOSS_FACTOR['VSC']} under VSC\"\n        ),\n    )\n\n\ndef pit_calls(snapshot: RaceSnapshot, pit_loss: PitLoss | None = None) -> PitCallReport:\n    \"\"\"Calls for every driver. `pit_loss` should be the circuit's measured loss when known\n    (see circuits.py); otherwise it's estimated from this session's pit-lane times.\"\"\"\n    loss = pit_loss or estimated_pit_loss(snapshot)\n    loss_now = loss.for_status(snapshot.track_status)\n    return PitCallReport(\n        track_status=snapshot.track_status,\n        lap=snapshot.current_lap,\n        laps_remaining=snapshot.laps_remaining,\n        green_pit_loss_s=round(loss.green, 1),\n        pit_loss_now_s=round(loss_now, 1),\n        calls=tuple(_call(d, snapshot, loss_now, loss.green) for d in snapshot.drivers),\n        assumptions=(\n            (\n                f\"Pit loss {loss_now:.1f}s under {snapshot.track_status} vs {loss.green:.1f}s \"\n                f\"under green ({loss.source}).\"\n            ),\n            \"Places at risk assumes the cars behind stay out.\",\n            f\"Fresh tyres: \u003c= {FRESH_TYRE_LAPS} laps; old tyres: >= {OLD_TYRE_LAPS} laps.\",\n        ),\n    )\n", "src/livetiming/monitor.py": "\"\"\"Turn a stream of feed messages into race events for the UI / terminal.\n\n`RaceMonitor.feed(message)` is synchronous and deterministic (easy to test); `replay()` drives\nit from the archive at any speed. The live WebSocket client will drive the same monitor.\n\nEvents (dicts with a \"type\"):\n  session       {meeting, session, total_laps}                       once, when known\n  track_status  {status, lap}                                        on every change\n  race_control  {lap, category, message}                             each new message\n  radio         {driver, tla, url, utc, text}                        each new team radio clip\n  radio_transcript {url, tla, text}                                   when a clip's text is ready\n  pit_calls     {report}                                             when a SC / VSC starts\n  (+ whatever `on_neutralisation` returns, e.g. a `prediction` event: who wins from here)\n  snapshot      {lap, total_laps, status, clock, drivers:[...]}      throttled by the driver\n  track         {source, points, bounds, rotation?, corners?, marshal_sectors?}  once, first\n  positions     {utc, cars: [{number, tla, x, y, status}]}           ~4/s wall clock (replay)\n\"\"\"\n\nimport asyncio\nimport logging\nimport statistics\nfrom collections.abc import AsyncIterator, Callable\nfrom dataclasses import asdict, dataclass\nfrom datetime import UTC, datetime, timedelta\nfrom typing import Any, Protocol\n\nfrom src.livetiming.archive import STATIC, STRATEGY_TOPICS, ArchiveSession, Message\nfrom src.livetiming.circuits import Circuit, PitLoss, fetch_circuit\nfrom src.livetiming.rejoin import losses, rejoin_table\nfrom src.livetiming.snapshot import TRACK_STATUS, RaceSnapshot, build_snapshot\nfrom src.livetiming.state import TimingState\nfrom src.livetiming.strategy import pit_calls\nfrom src.livetiming.track import latest_positions, track_outline\nfrom src.weather.forecast import race_rain\n\nNEUTRALISED = {\"SAFETY_CAR\", \"VSC\"}\nlog = logging.getLogger(__name__)\nREPLAY_TOPICS = (*STRATEGY_TOPICS, \"TeamRadio\", \"Position.z\", \"WeatherData\")\n\n\ndef snapshot_event(\n    snap: RaceSnapshot, pit_loss: PitLoss | None = None, lap_time_s: float | None = None\n) -> dict[str, Any]:\n    \"\"\"`rejoin`: per running car, where it would come out if it pitted now (green / SC / VSC);\n    `lap_time_s`: a typical current green lap, for drawing the field on one line by gap.\"\"\"\n    return {\n        \"type\": \"snapshot\",\n        \"lap\": snap.current_lap,\n        \"total_laps\": snap.total_laps,\n        \"status\": snap.track_status,\n        \"clock\": snap.clock,\n        \"drivers\": [\n            {\n                \"position\": d.position,\n                \"tla\": d.tla,\n                \"number\": d.number,\n                \"team\": d.team,\n                \"team_colour\": d.team_colour,\n                \"gap\": d.gap_to_leader_s,\n                \"best_lap\": d.best_lap_s,\n                \"knocked_out\": d.knocked_out,\n                \"laps_down\": d.laps_down,\n                \"interval\": d.interval_s,\n                \"compound\": d.compound,\n                \"tyre_age\": d.tyre_age_laps,\n                \"pit_stops\": d.pit_stops,\n                \"in_pit\": d.in_pit,\n                \"retired\": d.retired,\n            }\n            for d in snap.drivers\n        ],\n        \"session_type\": snap.session_type,\n        \"pit_loss\": losses(pit_loss),\n        \"lap_time_s\": lap_time_s,\n        # Rejoin projections only in races (practice / qualifying gaps are lap-time deltas).\n        \"rejoin\": rejoin_table(snap, pit_loss) if snap.is_race else {},\n    }\n\n\ndef _float(value: Any) -> float | None:\n    try:\n        return float(value)\n    except (TypeError, ValueError):\n        return None\n\n\ndef weather_event(data: dict[str, Any]) -> dict[str, Any] | None:\n    \"\"\"`weather` event from a WeatherData message (published about once a minute).\"\"\"\n    if not isinstance(data, dict) or \"TrackTemp\" not in data:\n        return None\n    return {\n        \"type\": \"weather\",\n        \"air_c\": _float(data.get(\"AirTemp\")),\n        \"track_c\": _float(data.get(\"TrackTemp\")),\n        \"humidity\": _float(data.get(\"Humidity\")),\n        \"wind_ms\": _float(data.get(\"WindSpeed\")),\n        \"wind_dir\": _float(data.get(\"WindDirection\")),\n        \"raining\": str(data.get(\"Rainfall\", \"0\")) not in (\"0\", \"\", \"False\", \"false\"),\n    }\n\n\ndef session_start_utc(info: dict[str, Any]) -> datetime | None:\n    \"\"\"SessionInfo StartDate is local circuit time; GmtOffset (\"04:00:00\" / \"-05:00:00\") maps it\n    to UTC.\"\"\"\n    try:\n        local = datetime.fromisoformat(str(info[\"StartDate\"]))\n        sign = -1 if str(info.get(\"GmtOffset\", \"\")).startswith(\"-\") else 1\n        h, m, *_ = (int(x) for x in str(info.get(\"GmtOffset\", \"0:0\")).lstrip(\"-\").split(\":\"))\n        return (local - sign * timedelta(hours=h, minutes=m)).replace(tzinfo=UTC)\n    except (KeyError, ValueError):\n        return None\n\n\ndef forecast_event(info: dict[str, Any]) -> dict[str, Any] | None:\n    \"\"\"`forecast` event: Open-Meteo rain chance over the session window (live sessions only:\n    forecasts don't cover the past).\"\"\"\n    start = session_start_utc(info)\n    location = (info.get(\"Meeting\") or {}).get(\"Location\") or \"\"\n    if start is None or not location:\n        return None\n    try:\n        outlook = race_rain(location, start)\n    except Exception as e:  # noqa: BLE001 — no forecast is fine; never break the feed\n        log.info(\"no rain forecast for %s: %s\", location, e)\n        return None\n    return {\n        \"type\": \"forecast\",\n        \"location\": location,\n        \"p_rain\": outlook.p_rain,\n        \"mm\": outlook.mm,\n        \"hourly\": [{\"utc\": t, \"p\": p, \"mm\": mm} for t, p, mm in outlook.hourly],\n    }\n\n\n@dataclass(frozen=True)\nclass LapRecord:\n    \"\"\"One completed lap of one car, as seen live.\"\"\"\n\n    lap: int\n    time_s: float | None\n    compound: str | None\n    tyre_age: int | None  # laps on the set at the end of this lap\n    stint: int\n    pit_in: bool\n    pit_out: bool\n    neutralised: bool  # an SC / VSC / red flag was out at some point during the lap\n\n\ndef _lap_seconds(value: str | None) -> float | None:\n    \"\"\" \"1:48.619\" -> 108.619.\"\"\"\n    if not value:\n        return None\n    try:\n        minutes, _, seconds = value.rpartition(\":\")\n        return (int(minutes) * 60 if minutes else 0) + float(seconds)\n    except ValueError:\n        return None\n\n\nclass RaceMonitor:\n    def __init__(self, radio_base_url: str | None = None, pit_loss: PitLoss | None = None) -> None:\n        self.state = TimingState()\n        self._radio_base = radio_base_url  # clip paths are relative to the session folder\n        self.pit_loss = pit_loss  # measured for this circuit when known; else estimated\n        self._status: str | None = None\n        self._session_sent = False\n        self._race_control_seen = 0\n        self._radio_seen: set[str] = set()\n        self._positions: tuple[str, dict] | None = None\n        # Lap history (for in-race pace, degradation and tyre life): per car number.\n        self.laps: dict[str, list[LapRecord]] = {}\n        self._neutralised_since_lap: dict[str, bool] = {}\n        self._in_pit_this_lap: dict[str, bool] = {}\n\n    def positions_event(self) -> dict[str, Any] | None:\n        \"\"\"Newest car coordinates, or None before the first Position.z message.\"\"\"\n        if not self._positions:\n            return None\n        timestamp, entries = self._positions\n        drivers = self.state.topics.get(\"DriverList\", {})\n        cars = [\n            {\n                \"number\": number,\n                \"tla\": drivers.get(number, {}).get(\"Tla\", number),\n                \"x\": car.get(\"X\"),\n                \"y\": car.get(\"Y\"),\n                \"status\": car.get(\"Status\"),\n            }\n            for number, car in entries.items()\n            if isinstance(car, dict)\n        ]\n        return {\"type\": \"positions\", \"utc\": timestamp, \"cars\": cars}\n\n    def snapshot(self) -> RaceSnapshot:\n        return build_snapshot(self.state)\n\n    def reference_lap_s(self) -> float | None:\n        \"\"\"Median of each running car's latest clean green lap: the current lap time.\"\"\"\n        latest = []\n        for laps in self.laps.values():\n            for lap in reversed(laps[-3:]):\n                if lap.time_s and not (lap.neutralised or lap.pit_in or lap.pit_out):\n                    latest.append(lap.time_s)\n                    break\n        return round(statistics.median(latest), 3) if len(latest) >= 5 else None\n\n    def snapshot_event(self) -> dict[str, Any]:\n        return snapshot_event(self.snapshot(), self.pit_loss, self.reference_lap_s())\n\n    def starting_grid(self) -> dict[int, int]:\n        \"\"\"Official starting grid (car number -> slot, penalties applied) from TimingAppData\n        GridPos: published when the race feed opens, about an hour before the start. Empty\n        until most of the field has one, or outside a race.\"\"\"\n        if \"race\" not in str(self.state.topics.get(\"SessionInfo\", {}).get(\"Name\", \"\")).lower():\n            return {}\n        grid = {}\n        for number, line in self.state.topics.get(\"TimingAppData\", {}).get(\"Lines\", {}).items():\n            pos = line.get(\"GridPos\") if isinstance(line, dict) else None\n            if str(pos or \"\").isdigit() and int(pos) > 0 and str(number).isdigit():\n                grid[int(number)] = int(pos)\n        return grid if len(grid) >= 10 else {}\n\n    def feed(self, message: Message) -> list[dict[str, Any]]:\n        if message.topic == \"Position.z\":\n            # High-frequency and huge: kept out of TimingState; the caller throttles emission.\n            self._positions = latest_positions(message) or self._positions\n            return []\n        self.state.apply(message.topic, message.data, str(message.offset))\n        events: list[dict[str, Any]] = []\n        topics = self.state.topics\n        if message.topic == \"TrackStatus\":\n            status = TRACK_STATUS.get(str(message.data.get(\"Status\")), \"UNKNOWN\")\n            if status in (\"SAFETY_CAR\", \"VSC\", \"VSC_ENDING\", \"RED_FLAG\"):\n                for car in self._neutralised_since_lap:\n                    self._neutralised_since_lap[car] = True\n                self._neutralised_now = True\n            else:\n                self._neutralised_now = False\n        if message.topic == \"TimingData\":\n            events.extend(self._record_laps(message.data))\n\n        # Races wait for LapCount (the header carries the race distance); practice and\n        # qualifying never publish it.\n        info_type = topics.get(\"SessionInfo\", {}).get(\"Type\")\n        if (\n            not self._session_sent\n            and \"SessionInfo\" in topics\n            and (\"LapCount\" in topics or (info_type and info_type != \"Race\"))\n        ):\n            snap = self.snapshot()\n            events.append(\n                {\n                    \"type\": \"session\",\n                    \"meeting\": snap.meeting,\n                    \"session\": snap.session,\n                    \"session_type\": snap.session_type,\n                    \"total_laps\": snap.total_laps,\n                }\n            )\n            self._session_sent = True\n\n        if message.topic == \"TrackStatus\":\n            status = TRACK_STATUS.get(str(message.data.get(\"Status\")), \"UNKNOWN\")\n            if status != self._status:\n                snap = self.snapshot()\n                events.append({\"type\": \"track_status\", \"status\": status, \"lap\": snap.current_lap})\n                # Pit calls only mean something in a race (practice runs VSC tests).\n                if status in NEUTRALISED and self._status not in NEUTRALISED and snap.is_race:\n                    report = pit_calls(snap, self.pit_loss)\n                    events.append({\"type\": \"pit_calls\", \"report\": asdict(report)})\n                self._status = status\n\n        if message.topic == \"RaceControlMessages\":\n            messages = topics[\"RaceControlMessages\"].get(\"Messages\") or []\n            for rc in messages[self._race_control_seen :]:\n                if isinstance(rc, dict) and rc.get(\"Message\"):\n                    events.append(\n                        {\n                            \"type\": \"race_control\",\n                            \"lap\": rc.get(\"Lap\"),\n                            \"category\": rc.get(\"Category\"),\n                            \"message\": rc[\"Message\"],\n                        }\n                    )\n            self._race_control_seen = len(messages)\n\n        if message.topic == \"WeatherData\" and (event := weather_event(message.data)):\n            event[\"lap\"] = self.snapshot().current_lap\n            events.append(event)\n\n        if message.topic == \"TeamRadio\":\n            captures = topics[\"TeamRadio\"].get(\"Captures\") or []\n            drivers = topics.get(\"DriverList\", {})\n            for clip in captures:\n                path = clip.get(\"Path\") if isinstance(clip, dict) else None\n                if not path or path in self._radio_seen:\n                    continue\n                self._radio_seen.add(path)\n                number = str(clip.get(\"RacingNumber\"))\n                events.append(\n                    {\n                        \"type\": \"radio\",\n                        \"driver\": number,\n                        \"tla\": drivers.get(number, {}).get(\"Tla\", number),\n                        \"utc\": clip.get(\"Utc\"),\n                        \"url\": f\"{self._radio_base}{path}\" if self._radio_base else path,\n                        \"text\": None,\n                    }\n                )\n        return events\n\n    def _record_laps(self, update: dict) -> list[dict[str, Any]]:\n        \"\"\"Append each car's newly completed lap to `laps`; returns `lap` events.\"\"\"\n        events: list[dict[str, Any]] = []\n        drivers = self.state.topics.get(\"DriverList\", {})\n        lines = self.state.topics.get(\"TimingData\", {}).get(\"Lines\", {})\n        app = self.state.topics.get(\"TimingAppData\", {}).get(\"Lines\", {})\n        for car, change in (update.get(\"Lines\") or {}).items():\n            if not isinstance(change, dict):\n                continue\n            line = lines.get(car, {})\n            if change.get(\"InPit\") or change.get(\"PitOut\"):\n                self._in_pit_this_lap[car] = True\n            if \"NumberOfLaps\" not in change:\n                continue\n            stints = [s for s in (app.get(car, {}).get(\"Stints\") or []) if s.get(\"Compound\")]\n            current = stints[-1] if stints else {}\n            pitted = self._in_pit_this_lap.pop(car, False)\n            last = line.get(\"LastLapTime\") or {}\n            history = self.laps.get(car) or []\n            # A stop touches two laps (in the pit lane at the end of one and the start of the\n            # next): the second of two pit laps in a row is the out-lap.\n            out_lap = bool(line.get(\"PitOut\")) or (pitted and bool(history) and history[-1].pit_in)\n            record = LapRecord(\n                lap=int(change[\"NumberOfLaps\"]),\n                time_s=_lap_seconds((line.get(\"LastLapTime\") or {}).get(\"Value\")),\n                compound=current.get(\"Compound\"),\n                tyre_age=current.get(\"TotalLaps\"),\n                stint=len(stints),\n                # lap 1: cars on the grid read as \"in pit\" before the start\n                pit_in=(bool(line.get(\"InPit\")) or pitted)\n                and not out_lap\n                and int(change[\"NumberOfLaps\"]) > 1,\n                pit_out=out_lap,\n                neutralised=self._neutralised_since_lap.get(car, False)\n                or getattr(self, \"_neutralised_now\", False),\n            )\n            self.laps.setdefault(car, []).append(record)\n            self._neutralised_since_lap[car] = getattr(self, \"_neutralised_now\", False)\n            if record.lap \u003c 1:  # the grid state before the start, not a lap\n                continue\n            events.append(\n                {\n                    \"type\": \"lap\",\n                    \"number\": car,\n                    \"tla\": drivers.get(car, {}).get(\"Tla\", car),\n                    \"lap\": record.lap,\n                    \"time\": round(record.time_s, 3) if record.time_s else None,\n                    \"compound\": record.compound,\n                    \"tyre_age\": record.tyre_age,\n                    \"pit_in\": record.pit_in,\n                    \"pit_out\": record.pit_out,\n                    \"neutralised\": record.neutralised,\n                    \"personal_best\": bool(last.get(\"PersonalFastest\")),\n                    \"overall_best\": bool(last.get(\"OverallFastest\")),\n                }\n            )\n        return events\n\n    def driver_names(self, number: str) -> list[str]:\n        \"\"\"The driver's full name, to prime speech recognition with the right spelling.\"\"\"\n        d = self.state.topics.get(\"DriverList\", {}).get(number, {})\n        name = \" \".join(p for p in (d.get(\"FirstName\"), d.get(\"LastName\")) if p)\n        return [name] if name else []\n\n\ndef _circuit_for(messages: list[Message]) -> Circuit | None:\n    \"\"\"MultiViewer circuit data for the session's circuit key and season.\"\"\"\n    info = next((m.data for m in messages if m.topic == \"SessionInfo\"), None)\n    try:\n        key = int(info[\"Meeting\"][\"Circuit\"][\"Key\"])\n        year = int(str(info[\"StartDate\"])[:4])\n    except (TypeError, KeyError, ValueError):\n        return None\n    return fetch_circuit(key, year)\n\n\ndef _lap_count(message: Message) -> int | None:\n    if message.topic == \"LapCount\":\n        return message.data.get(\"CurrentLap\")\n    return None\n\n\nclass Transcriber(Protocol):\n    def cached(self, url: str) -> str | None: ...\n    async def transcribe(self, url: str, names: list[str] = ...) -> str | None: ...\n\n\nasync def pump(\n    source: AsyncIterator[tuple[Message, bool]],\n    monitor: RaceMonitor,\n    snapshot_every_s: float = 1.0,\n    transcriber: Transcriber | None = None,\n    transcript_wait_s: float = 30.0,\n    positions_every_s: float = 0.25,\n    on_neutralisation: Callable[[RaceMonitor], dict[str, Any] | None] | None = None,\n    load_circuit_live: bool = False,\n    on_grid: Callable[[RaceMonitor], dict[str, Any] | None] | None = None,\n    alerts: bool = False,\n    on_q3: Callable[[RaceMonitor], dict[str, Any] | None] | None = None,\n) -> AsyncIterator[dict[str, Any]]:\n    \"\"\"Turn a stream of (message, quiet) into race events — shared by the live feed and the\n    replay, so live runs the code the replays test.\n\n    `quiet` messages are applied without emitting events (replay fast-forward), except\n    `session`; when quiet ends a snapshot (and car positions) are sent straight away.\n    A `snapshot` is emitted at most every `snapshot_every_s` of wall-clock time, plus right\n    after SC/VSC pit calls. With a `transcriber`, `radio` events carry cached text or null and\n    uncached clips are transcribed in the background (`radio_transcript` events), so the race\n    feed never waits on speech recognition. `load_circuit_live` fetches circuit data (track map,\n    measured pit loss) once SessionInfo arrives — the replay precomputes it instead.\n    `on_grid` runs once when the official starting grid is known (before lap 1), e.g. for a\n    pre-race prediction from the real grid. `on_q3` runs once when qualifying reaches Q3 (the\n    pre-Q3 prediction). `alerts`: run the strategy alert engine (alerts.py)\n    after each completed lap and at SC/VSC calls; it emits `alert` events.\"\"\"\n    loop = asyncio.get_running_loop()\n    last_snapshot = last_positions = 0.0\n    was_quiet = False\n    circuit_done = not load_circuit_live\n    grid_done = on_grid is None\n    q3_done = on_q3 is None\n    engine = None\n    if alerts:\n        from src.livetiming.alerts import AlertEngine\n        from src.livetiming.director import Director\n\n        engine = AlertEngine()\n        director = Director()\n    last_lap = None\n    transcripts: asyncio.Queue[dict[str, Any]] = asyncio.Queue()\n    pending: set[asyncio.Task] = set()\n\n    async def write_alert(alert: dict[str, Any]) -> None:\n        from src.agents.alert_writer import phrase\n\n        text = await asyncio.to_thread(phrase, alert)\n        if text:\n            await transcripts.put({**alert, \"text\": text})\n\n    def start_writing(alert: dict[str, Any]) -> None:\n        from src.agents.alert_writer import enabled\n\n        if enabled():\n            task = asyncio.create_task(write_alert(alert))\n            pending.add(task)\n            task.add_done_callback(pending.discard)\n\n    async def transcribe(radio: dict[str, Any]) -> None:\n        text = await transcriber.transcribe(radio[\"url\"], monitor.driver_names(radio[\"driver\"]))\n        if text is not None:\n            await transcripts.put(\n                {\"type\": \"radio_transcript\", \"url\": radio[\"url\"], \"tla\": radio[\"tla\"], \"text\": text}\n            )\n\n    def start_transcription(event: dict[str, Any]) -> None:\n        if transcriber is None or event[\"type\"] != \"radio\":\n            return\n        cached = transcriber.cached(event[\"url\"])\n        if cached is not None:\n            event[\"text\"] = cached\n            return\n        task = asyncio.create_task(transcribe(event))\n        pending.add(task)\n        task.add_done_callback(pending.discard)\n\n    def drain() -> list[dict[str, Any]]:\n        ready = []\n        while not transcripts.empty():\n            ready.append(transcripts.get_nowait())\n        return ready\n\n    try:\n        async for message, quiet in source:\n            if was_quiet and not quiet:\n                yield monitor.snapshot_event()\n                if positions := monitor.positions_event():  # dots appear straight away\n                    yield positions\n            was_quiet = quiet\n\n            events = monitor.feed(message)\n            if not circuit_done and message.topic == \"SessionInfo\":\n                circuit_done = True\n                circuit = await asyncio.to_thread(_circuit_for, [message])\n                if circuit:\n                    monitor.pit_loss = circuit.pit_loss\n                    events.insert(0, circuit.track_event())\n                if forecast := await asyncio.to_thread(forecast_event, message.data):\n                    events.append(forecast)\n            if quiet:\n                # Lap history still flows during fast-forward: the run timeline shows every lap.\n                events = [e for e in events if e[\"type\"] in (\"session\", \"track\", \"lap\")]\n            for event in events:\n                start_transcription(event)\n                yield event\n                if event[\"type\"] == \"pit_calls\" and on_neutralisation and not quiet:\n                    extra = await asyncio.to_thread(on_neutralisation, monitor)\n                    if extra:\n                        yield extra\n            for event in drain():\n                yield event\n            if engine is not None and not quiet:\n                for e in events:\n                    if e[\"type\"] == \"pit_calls\":\n                        report = pit_calls(monitor.snapshot(), monitor.pit_loss)\n                        for alert in engine.on_pit_calls(report):\n                            start_writing(alert)\n                            yield alert\n                if message.topic == \"LapCount\":\n                    lap = monitor.snapshot().current_lap\n                    if lap and lap != last_lap:\n                        last_lap = lap\n                        loss = (\n                            (monitor.pit_loss.green, monitor.pit_loss.safety_car)\n                            if monitor.pit_loss\n                            else (22.0, 13.5)\n                        )\n                        try:\n                            new = await asyncio.to_thread(engine.on_lap, monitor, loss)\n                        except Exception:\n                            log.exception(\"alert engine failed on lap %s\", lap)\n                            new = []\n                        for alert in new:\n                            start_writing(alert)\n                            yield alert\n                        try:\n                            picks = await asyncio.to_thread(director.on_lap, monitor)\n                        except Exception:\n                            log.exception(\"director failed on lap %s\", lap)\n                            picks = []\n                        for event in picks:\n                            if event[\"type\"] == \"alert\":\n                                start_writing(event)\n                            yield event\n            if (\n                not q3_done\n                and not quiet\n                and message.topic == \"TimingData\"\n                and str(message.data.get(\"SessionPart\")) == \"3\"\n                and monitor.snapshot().session == \"Qualifying\"\n            ):\n                q3_done = True\n                if extra := await asyncio.to_thread(on_q3, monitor):\n                    yield extra\n            if (\n                not grid_done\n                and message.topic in (\"TimingAppData\", \"LapCount\")\n                and monitor.starting_grid()\n                # The race distance too: after a reconnect the grid can arrive just before\n                # LapCount, and the prediction needs both (Kuala Lumpur 2026 lost it that way).\n                and monitor.snapshot().total_laps\n            ):\n                grid_done = True\n                before_start = (monitor.snapshot().current_lap or 0) \u003c= 1\n                if before_start and (extra := await asyncio.to_thread(on_grid, monitor)):\n                    yield extra\n\n            now = loop.time()\n            if (\n                message.topic == \"Position.z\"\n                and not quiet\n                and now - last_positions >= positions_every_s\n                and (positions := monitor.positions_event())\n            ):\n                yield positions\n                last_positions = now\n            pit_call_made = any(e[\"type\"] == \"pit_calls\" for e in events)\n            if not quiet and (pit_call_made or now - last_snapshot >= snapshot_every_s):\n                yield monitor.snapshot_event()\n                last_snapshot = now\n\n        yield monitor.snapshot_event()\n        if pending:  # let clips from the last laps finish, within reason\n            await asyncio.wait(set(pending), timeout=transcript_wait_s)\n        for event in drain():\n            yield event\n        yield {\"type\": \"end\"}\n    finally:\n        for task in pending:\n            task.cancel()\n\n\nasync def replay(\n    session: ArchiveSession,\n    speed: float = 10.0,\n    from_lap: int | None = None,\n    snapshot_every_s: float = 1.0,\n    transcriber: Transcriber | None = None,\n    transcript_wait_s: float = 30.0,\n    positions_every_s: float = 0.25,\n    circuit_loader: Callable[[list[Message]], Circuit | None] | None = None,\n    monitor: RaceMonitor | None = None,\n    on_neutralisation: Callable[[RaceMonitor], dict[str, Any] | None] | None = None,\n    on_grid: Callable[[RaceMonitor], dict[str, Any] | None] | None = None,\n    alerts: bool = False,\n    on_q3: Callable[[RaceMonitor], dict[str, Any] | None] | None = None,\n) -> AsyncIterator[dict[str, Any]]:\n    \"\"\"Play an archived session as if live (a test source for the live tooling). Messages before\n    `from_lap` are applied instantly; afterwards the original timing is kept, divided by\n    `speed`. Event semantics are `pump`'s.\"\"\"\n    # A caller-owned monitor lets a live session answer questions about the race state while\n    # this generator feeds it.\n    if monitor is None:\n        monitor = RaceMonitor()\n    monitor._radio_base = f\"{STATIC}/{session.path}\"\n    load_circuit = circuit_loader or _circuit_for\n\n    # Downloading/parsing the archive is blocking I/O; keep it off the event loop.\n    messages = await asyncio.to_thread(lambda: list(session.messages(REPLAY_TOPICS)))\n    circuit = await asyncio.to_thread(load_circuit, messages)\n    if circuit:\n        monitor.pit_loss = circuit.pit_loss\n        yield circuit.track_event()\n    elif outline := await asyncio.to_thread(track_outline, messages):\n        yield {\"type\": \"track\", \"source\": \"traced\", **outline}\n\n    async def timed() -> AsyncIterator[tuple[Message, bool]]:\n        fast_forward = from_lap is not None\n        previous: timedelta | None = None\n        for message in messages:\n            if fast_forward and (_lap_count(message) or 0) >= from_lap:\n                fast_forward = False\n            if not fast_forward and previous is not None:\n                wait = (message.offset - previous).total_seconds() / speed\n                if wait > 0:\n                    await asyncio.sleep(min(wait, 5.0))  # cap long quiet gaps (red flags)\n            previous = message.offset\n            yield message, fast_forward\n\n    async for event in pump(\n        timed(),\n        monitor,\n        snapshot_every_s=snapshot_every_s,\n        transcriber=transcriber,\n        transcript_wait_s=transcript_wait_s,\n        positions_every_s=positions_every_s,\n        on_neutralisation=on_neutralisation,\n        on_grid=on_grid,\n        alerts=alerts,\n        on_q3=on_q3,\n    ):\n        yield event\n", "src/warehouse/refresh.py": "\"\"\"Keep the data store current: one idempotent job for cron or the server.\n\nEach run ingests every finished session (practice to race) that isn't in the warehouse yet,\nfrom OpenF1 once its data has settled, rebuilds the warehouse if anything was added, and fetches\nnew stewards' decisions. Running it again with nothing new does nothing.\n\nRace timing for the strategy models doesn't need this job: live sessions are recorded from F1's\nfeed by the server (`Recorder`), and a finished race is rebuilt from OpenF1 on demand when no\nrecording or archive copy exists (src/livetiming/sources.py).\n\nUsage: python -m src.warehouse.refresh [--years 2026] [--settle-minutes 45] [--no-decisions]\nServer: PITWALL_REFRESH_MINUTES=30 runs it on that interval in the API process.\n\"\"\"\n\nimport argparse\nimport logging\nfrom collections.abc import Callable\nfrom dataclasses import dataclass, field\nfrom datetime import UTC, datetime, timedelta\n\nfrom src.tools.openf1 import OpenF1Error\n\nALL_SESSIONS = (\n    \"Practice 1\",\n    \"Practice 2\",\n    \"Practice 3\",\n    \"Sprint Qualifying\",\n    \"Sprint\",\n    \"Qualifying\",\n    \"Race\",\n)\n# OpenF1 frees a session's data ~30 min after it ends.\nDEFAULT_SETTLE = timedelta(minutes=45)\n\nlog = logging.getLogger(__name__)\n\n\n@dataclass\nclass RefreshReport:\n    sessions: list[int] = field(default_factory=list)  # newly ingested session keys\n    rebuilt: bool = False\n    decisions: int | None = None  # stewards' documents on file after the run; None = failed\n    skipped: str = \"\"  # why OpenF1 wasn't read this run (e.g. a session is live)\n    errors: list[str] = field(default_factory=list)\n\n\ndef _ingest(years: list[int], sessions: list[str], settle: timedelta) -> list[int]:\n    from src.warehouse.ingest import ingest\n\n    return ingest(years, sessions, settle=settle)\n\n\ndef _build() -> None:\n    from src.warehouse.build import build\n\n    build()\n\n\ndef _decisions(seasons: list[int]) -> list:\n    from src.rag.decisions import ingest\n\n    return ingest(seasons)\n\n\ndef refresh(\n    years: list[int] | None = None,\n    settle: timedelta = DEFAULT_SETTLE,\n    decisions: bool = True,\n    ingest_fn: Callable[..., list[int]] = _ingest,\n    build_fn: Callable[[], None] = _build,\n    decisions_fn: Callable[[list[int]], list] = _decisions,\n) -> RefreshReport:\n    years = years or [datetime.now(UTC).year]\n    report = RefreshReport()\n    try:\n        report.sessions = list(ingest_fn(years, list(ALL_SESSIONS), settle))\n    except OpenF1Error as e:\n        # OpenF1 refuses every request while a session is live: try again next run.\n        report.skipped = str(e)\n        log.warning(\"refresh: OpenF1 skipped: %s\", e)\n    if report.sessions:\n        build_fn()\n        report.rebuilt = True\n    if decisions:\n        try:\n            report.decisions = len(decisions_fn(years))\n        except Exception as e:  # noqa: BLE001 - a stewards' site outage mustn't stop the job\n            report.errors.append(f\"stewards' decisions: {type(e).__name__}: {e}\")\n            log.warning(\"refresh: decisions failed: %s\", e)\n    return report\n\n\ndef main() -> None:\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--years\", type=int, nargs=\"+\", help=\"default: the current season\")\n    ap.add_argument(\"--settle-minutes\", type=int, default=int(DEFAULT_SETTLE.total_seconds() // 60))\n    ap.add_argument(\"--no-decisions\", action=\"store_true\", help=\"skip the stewards' documents\")\n    args = ap.parse_args()\n    logging.basicConfig(level=logging.INFO, format=\"%(asctime)s %(message)s\")\n    logging.getLogger(\"httpx\").setLevel(logging.WARNING)\n    report = refresh(\n        args.years, timedelta(minutes=args.settle_minutes), decisions=not args.no_decisions\n    )\n    print(\n        f\"ingested {len(report.sessions)} sessions, rebuilt: {report.rebuilt}, \"\n        f\"stewards' documents: {report.decisions}\"\n        + (f\", OpenF1 skipped: {report.skipped}\" if report.skipped else \"\")\n        + \"\".join(f\"\\nerror: {e}\" for e in report.errors)\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"}, "source_files": [{"path": "scripts/ingest_decisions.py", "lines": 30}, {"path": "scripts/ingest_regulations.py", "lines": 53}, {"path": "scripts/record_fixtures.py", "lines": 70}, {"path": "src/__init__.py", "lines": 0}, {"path": "src/agents/__init__.py", "lines": 0}, {"path": "src/agents/alert_writer.py", "lines": 61}, {"path": "src/agents/graph.py", "lines": 449}, {"path": "src/agents/live_chat.py", "lines": 182}, {"path": "src/agents/prompts.py", "lines": 90}, {"path": "src/agents/state.py", "lines": 100}, {"path": "src/analysis/__init__.py", "lines": 0}, {"path": "src/analysis/predictors.py", "lines": 238}, {"path": "src/analysis/track_fit.py", "lines": 209}, {"path": "src/api.py", "lines": 393}, {"path": "src/chat.py", "lines": 54}, {"path": "src/evals/__init__.py", "lines": 0}, {"path": "src/evals/judge.py", "lines": 66}, {"path": "src/evals/run.py", "lines": 242}, {"path": "src/live.py", "lines": 140}, {"path": "src/livetiming/__init__.py", "lines": 0}, {"path": "src/livetiming/alerts.py", "lines": 574}, {"path": "src/livetiming/archive.py", "lines": 158}, {"path": "src/livetiming/circuits.py", "lines": 111}, {"path": "src/livetiming/client.py", "lines": 220}, {"path": "src/livetiming/director.py", "lines": 346}, {"path": "src/livetiming/monitor.py", "lines": 651}, {"path": "src/livetiming/openf1_feed.py", "lines": 337}, {"path": "src/livetiming/rejoin.py", <script>
(() => {
"use strict";

// ---------------------------------------------------------------- data
const W = JSON.parse(document.getElementById("walkthrough-data").textContent);
// Inside the VS Code / Cursor extension the page talks to the extension instead of drawing code itself.
const HOST = typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : null;
if (HOST) document.documentElement.classList.add("in-editor");
const post = msg => { if (HOST) HOST.postMessage(msg); };
const DEPTHS = ["skip", "brief", "standard", "deep"];
const DEPTH_LABEL = { skip: "Skip", brief: "Brief", standard: "Standard", deep: "Deep" };
const topicsById = Object.fromEntries(W.topics.map(t => [t.id, t]));
const steps = W.steps;
const STORE_KEY = "tourguide:" + (W.repo && W.repo.name || "") + ":" + W.title;

const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;

};

// ---------------------------------------------------------------- learner profile
// baseline: default depth for topics the learner has not set.
// topics[id]: {depth, why, source: "you" | "adapted"}
// signals[id]: running record of feedback, used to gauge competency.
function freshProfile() {
  return { baseline: "standard", note: "", topics: {}, signals: {}, visited: [], current: -1 };
}
function load() {
  if (HOST) { const st = HOST.getState(); if (st && st.profile) return Object.assign(freshProfile(), st.profile); }
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return Object.assign(freshProfile(), JSON.parse(raw)); } catch (e) {}
  return freshProfile();
}
let P = load();
function save() {
  if (HOST) { HOST.setState({ profile: P }); post({ type: "profile", profile: P }); return; }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) {}
}

function depthOf(topicId) { return (P.topics[topicId] && P.topics[topicId].depth) || P.baseline; }
function whyOf(topicId) {

  if (t && t.why) return t.why;
  return "Your default depth is " + DEPTH_LABEL[P.baseline].toLowerCase() + ".";
}
function setTopic(topicId, depth, why, source) {
  P.topics[topicId] = { depth, why, source };

}
function shift(topicId, delta, why) {
  const cur = DEPTHS.indexOf(depthOf(topicId));
  const next = Math.min(3, Math.max(1, cur + delta));
  if (next === cur) return false;
  setTopic(topicId, DEPTHS[next], why, "adapted");
  return true;
}

// ---------------------------------------------------------------- live Claude (optional)
// In a claude.ai artifact the page can ask Claude through the `sample` capability (on the viewer's account).
// When served by `tourguide serve`, it posts to the local endpoint instead (using the developer's API key).
let live = null;   // async (prompt, {onText, quick, signal}) => text
let liveKind = "";
const hostCalls = {};

      if (t) { t.scrollIntoView({ behavior: "smooth", block: "center" }); t.focus(); }

}
async function setupLive() {

    liveKind = "local";
    live = async (prompt, opts = {}) => {
      const res = await fetch(W.live.endpoint, {
        method: "POST", headers: { "content-type": "application/json" }, signal: opts.signal,
        body: JSON.stringify({ prompt, quick: !!opts.quick }),
      });
      if (!res.ok || !res.body) throw { code: "upstream_error", message: await res.text() };

  }

    liveKind = "claude";

      const r = await sample(prompt, {

  return "That request didn't go through. Try again.";

// ---------------------------------------------------------------- reading the learner's own words
const SKIP_WORDS = /\b(skip|ignore|don'?t care|not interested|leave out)\b/i;
const LESS_WORDS = /\b(don'?t need|dont need|do not need|no need|already know|familiar with|know (?:it|that|this)|basic|basics|obvious|comfortable with|less|brief|quick(?:ly)?|skim)\b/i;
const MORE_WORDS = /\b(detail|detailed|deep|depth|in-depth|thorough|go into|dig into|focus|explain|new to|unfamiliar|don'?t know|never used|learn|more about|curious|care about|interested in|most)\b/i;

function heuristicRead(note) {
  const changes = {}; let baseline = null;
  if (/\b(senior|expert|staff|principal|\d+\s*\+?\s*years)\b/i.test(note)) baseline = "brief";
  if (/\b(beginner|junior|new to (?:programming|coding)|just learning|student)\b/i.test(note)) baseline = "deep";
  const clauses = note.split(/(?:[.;!?\n]|,|\bbut\b|\bhowever\b|\bwhile\b|\balthough\b)+/i).map(s => s.trim()).filter(Boolean);
  for (const clause of clauses) {
    const lc = clause.toLowerCase();
    const hit = W.topics.filter(t => [t.label, ...(t.keywords || [])].some(k => {
      const kk = String(k).toLowerCase().trim();
      return kk.length > 1 && new RegExp("\\b" + kk.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(lc);
    }));
    if (!hit.length) continue;
    let depth = null;
    if (SKIP_WORDS.test(clause)) depth = "skip";
    else if (LESS_WORDS.test(clause) && !/\bnew to\b/i.test(clause)) depth = "brief";
    else if (MORE_WORDS.test(clause)) depth = "deep";
    if (!depth) continue;
    for (const t of hit) changes[t.id] = { depth, why: "You said: “" + clause + "”" };
  }
  return { baseline, changes };
}

async function readNote(note) {
  if (live) {
    const prompt = [
      "A developer is about to take a guided tour of a code repository. Read their note and decide how much",
      "detail they want for each topic of the tour. Depth options: skip (leave the topic out), brief (1-3 sentences),",
      "standard (clear explanation), deep (internals and trade-offs).",
      "",
      "Topics:",
      ...W.topics.map(t => `- ${t.id}: ${t.label}. ${t.description} (keywords: ${(t.keywords || []).join(", ")})`),
      "",
      "Current default depth: " + P.baseline,
      "Their note: \"\"\"" + note + "\"\"\"",
      "",
      "Reply with only JSON in this shape:",
      '{"baseline": "brief"|"standard"|"deep"|null, "changes": {"<topic id>": {"depth": "skip"|"brief"|"standard"|"deep", "why": "<short reason quoting their words>"}}}',
      "Set baseline only if the note says something about their overall experience. Include only topics the note actually affects.",
      "Treat 'I don't need X explained' as brief, and 'skip X' or 'not interested in X' as skip.",
    ].join("\n");
    try {
      const text = await live(prompt, { quick: true });
      const m = text.match(/\{[\s\S]*\}/);
      const parsed = JSON.parse(m ? m[0] : text);
      const out = { baseline: DEPTHS.includes(parsed.baseline) && parsed.baseline !== "skip" ? parsed.baseline : null, changes: {} };
      for (const [id, c] of Object.entries(parsed.changes || {})) {
        if (topicsById[id] && c && DEPTHS.includes(c.depth)) out.changes[id] = { depth: c.depth, why: String(c.why || "From your note.") };
      }
      out.by = "Claude";
      return out;
    } catch (e) {
      const msg = liveError(e);
      if (msg) toast(msg);
    }
  }
  const out = heuristicRead(note); out.by = "keywords";
  return out;
}

async function applyNote(note, statusEl) {
  note = note.trim();
  if (!note) return;
  if (statusEl) statusEl.textContent = live ? "Reading your note…" : "Reading your note…";
  const r = await readNote(note);
  P.note = P.note ? P.note + "\n" + note : note;
  const parts = [];
  if (r.baseline && r.baseline !== P.baseline) { P.baseline = r.baseline; parts.push("default depth → " + DEPTH_LABEL[r.baseline]); }
  for (const [id, c] of Object.entries(r.changes)) {
    setTopic(id, c.depth, c.why, "you");
    parts.push(topicsById[id].label + " → " + DEPTH_LABEL[c.depth]);
  }
  save();
  const msg = parts.length ? "Adjusted: " + parts.join(" · ") : "I couldn't match that to a topic. Try naming one, or set the depths below.";
  if (statusEl) statusEl.textContent = msg + (parts.length && r.by === "keywords" ? " (matched by keywords)" : "");
  toast(msg);
  render();
}

// ---------------------------------------------------------------- markdown & code helpers
function md(text) {

  const clean = window.DOMPurify ? DOMPurify.sanitize(html) : escapeHtml(text || "");

    if (m && W.files[m[1]] != null) {
      a.classList.add("peek"); a.removeAttribute("href"); a.setAttribute("role", "button"); a.tabIndex = 0;
      a.title = "Show " + m[1] + " in the code panel";
      const go = () => peek(m[1], m[2] ? +m[2] : null, m[3] ? +m[3] : (m[2] ? +m[2] : null));
      a.addEventListener("click", go);
      a.addEventListener("keydown", e => { if (e.key === "Enter") go(); });

const LANG_BY_EXT = { py: "python", js: "javascript", mjs: "javascript", cjs: "javascript", jsx: "javascript", ts: "typescript", tsx: "typescript",
  json: "json", md: "markdown", yml: "yaml", yaml: "yaml", toml: "ini", ini: "ini", sh: "bash", bash: "bash", go: "go", rs: "rust",
  rb: "ruby", java: "java", kt: "kotlin", c: "c", h: "c", cpp: "cpp", cc: "cpp", hpp: "cpp", cs: "csharp", php: "php", sql: "sql",
  html: "xml", xml: "xml", css: "css", scss: "scss", swift: "swift", lua: "lua", r: "r", dockerfile: "dockerfile", makefile: "makefile" };
const codeCache = {};
function codeLines(path) {
  if (codeCache[path]) return codeCache[path];
  const text = W.files[path] || "";
  const base = path.split("/").pop().toLowerCase();
  const ext = base.includes(".") ? base.split(".").pop() : base;
  const lang = LANG_BY_EXT[ext];
  let html;
  try { html = (window.hljs && lang && hljs.getLanguage(lang)) ? hljs.highlight(text, { language: lang, ignoreIllegals: true }).value : escapeHtml(text); }

    else if (tok === "</span>") { open.pop(); cur += tok; }

}
function ghUrl(path, start, end) {

  if (start) u += "#L" + start + (end && end !== start ? "-L" + end : "");
  return u;
}

// ---------------------------------------------------------------- navigation
let index = Math.min(P.current ?? -1, steps.length - 1);   // -1 = welcome
let peeking = null;
let selection = null;   // {path, start, end} chosen by clicking line numbers
let selAnchor = null;
const isSkipped = s => depthOf(s.topic) === "skip";
function go(i, explicit) {

  const name = index < 0 ? "welcome" : "step-" + steps[index].id;
  if (location.hash.slice(1) !== name) { try { history.replaceState(null, "", "#" + name); } catch (e) { location.hash = name; } }
  render();

  if (window.matchMedia("(max-width: 760px)").matches && explicit) window.scrollTo({ top: 0 });
}
function nextIndex(from, dir) {
  let i = from + dir;
  while (i >= 0 && i < steps.length && isSkipped(steps[i])) i += dir;
  return i;
}
function next() { const i = nextIndex(index, 1); if (i < steps.length) go(i, true); }

// ---------------------------------------------------------------- rendering
const liveText = {};   // stepId -> {deeper: string, qa: [{q, a}]}
let controllers = {};

function render() {
  $("repoName").textContent = (W.repo && W.repo.name) || "";
  $("tourTitle").textContent = W.title;
  renderMeter(); renderRail(); renderSelect(); renderTuneSummary();
  const body = $("lesson"); body.replaceChildren();
  if (index < 0) renderWelcome(body); else renderStep(body, steps[index]);
  renderSource();
  if (HOST && index >= 0) {
    const active = steps.filter(x => !isSkipped(x));
    post({ type: "step", position: Math.max(1, active.indexOf(steps[index]) + 1), total: active.length, title: steps[index].title });
  }
  $("prevBtn").disabled = index < 0;
  const nxt = nextIndex(index, 1);
  $("nextBtn").disabled = nxt >= steps.length;
  $("nextBtn").textContent = index < 0 ? "Start the tour →" : "Next →";
}

function renderMeter() {
  const active = steps.filter(s => !isSkipped(s));
  const pos = index < 0 ? 0 : active.indexOf(steps[index]) + 1;
  $("meterText").textContent = index < 0 ? active.length + " steps for you" : "Step " + Math.max(pos, 1) + " of " + active.length;

}

    el("span", { class: "n" }, "0"), el("span", { class: "t" }, "Before we start"))));
  steps.forEach((s, i) => {

  toast(msg); render();
